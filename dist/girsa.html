      h += '<div class="row">';
      if (fx === 'skill5') h += U.sel('data-t', 'cr.bgsk', t.bgsk, primarySkillOpts(c), { label: 'Abilità' });
      if (fx === 'sec15') h += U.sel('data-t', 'cr.bgsk', t.bgsk, secSkillOpts(c), { label: 'Abilità secondaria' });
      if (fx === 'tr10') h += U.sel('data-t', 'cr.bgdef', t.bgdef, [['ess', 'TR Essenza'], ['fls', 'TR Flusso'], ['men', 'TR Mentalismo'], ['vel', 'TR Veleni'], ['mal', 'TR Malattie']], { label: 'Tiro resistenza' });
      h += '<button class="mini" data-act="cr_bgapply" data-i="' + i + '">Applica alla scheda</button></div>';
    } else if (e.kind === 'den' && !e.applied) {
      h += '<div class="row"><button class="mini" data-act="cr_bgapply" data-i="' + i + '">Aggiungi al denaro</button></div>';
    } else if (e.kind === 'ogg' && !e.applied) {
      h += '<div class="row"><button class="mini" data-act="cr_bgapply" data-i="' + i + '">Aggiungi all\'inventario</button></div>';
    }
    return h + '<button class="mini ghost" data-act="cr_bgdel" data-i="' + i + '" aria-label="Elimina">✕</button></div>';
  }
  function stepBg(c) {
    var k = cr(c), p = person(c), t = T(), pts = p ? p.bg : 0, used = k.bg.length;
    var h = '<section class="card"><h2>4 · Opzioni di background</h2>';
    if (!p) return h + '<p class="hint">Scegli prima il popolo: i punti di background dipendono da lui.</p></section>';
    h += '<p class="hint">Il popolo «' + esc(p.n) + '» ha <b>' + pts + '</b> punt' + (pts === 1 ? 'o' : 'i') + ' di background (usati: ' + used + '). Il GM può far scegliere l\'opzione, farla tirare o sceglierla lui. ' +
      (p.bgAbil ? 'Per questo popolo, abilità speciali: ' + esc(p.bgAbil) : '') + '</p>';
    var bx = C.BGX[p.id] || {};
    if (bx.note) h += '<p class="hint">' + esc(bx.note) + '</p>';
    if (bx.noAdd) h += '<p class="hint">Oggetti: ' + esc(p.bgOgg) + '</p>';
    if (C.BGX[p.id] && !bx.noAdd && p.bgOgg) h += '<p class="hint">Oggetti: ' + esc(p.bgOgg) + '</p>';
    h += '<div class="bgs">' + k.bg.map(function (e, i) { return bgEntry(c, e, i); }).join('') + '</div>';
    if (used < pts) {
      h += '<h3>Usa un punto</h3><div class="row"><button data-act="cr_bgroll" data-kind="spec">Tira: abilità speciale</button><button data-act="cr_bgroll" data-kind="ogg">Tira: oggetto speciale</button><button data-act="cr_bgroll" data-kind="den">Tira: denaro</button></div>';
      h += '<div class="grid g2">' + U.field('Oppure scegli un\'abilità speciale', U.sel('data-t', 'cr.bgpick', t.bgpick, [['', '(scegli)']].concat(C.BG.spec.map(function (r) { return [X.rangeKey(r[0], r[1]), X.rangeKey(r[0], r[1]) + ' · ' + r[2]]; })))) +
        '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bgpick">Scegli questa</button></div></div>';
      h += '<div class="grid g2">' +
        U.field('Gradi: +2 a un\'abilità primaria', U.sel('data-t', 'cr.bgsk', t.bgsk, primarySkillOpts(c))) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bggradi" data-n="2">+2 gradi</button></div>' +
        U.field('Gradi: +5 a un\'abilità secondaria', U.sel('data-t', 'cr.bgsk2', t.bgsk2 || '', secSkillOpts(c))) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bggradi" data-n="5">+5 gradi</button></div>' +
        U.field('Caratteristiche: +2 a una', U.sel('data-t', 'cr.bgstat', t.bgstat, [['', '(scegli)']].concat(D.STATS.map(function (s) { return [s[0], s[1]]; })))) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bgstat" data-n="2">+2</button></div>' +
        U.field('Oppure +1 a tre (separate da virgola)', U.inp('data-t', 'cr.bgstat3', t.bgstat3, { ph: 'es. FR, AG, CO' })) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bgstat" data-n="3">+1 a tre</button></div>' +
        U.field('Lingua a grado 5', U.inp('data-t', 'cr.bglang', t.bglang, { ph: 'es. Sindarin' })) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bglang">Aggiungi lingua</button></div></div>';
    } else if (pts) h += '<p class="hint">Punti di background esauriti.</p>';
    return h + '</section>';
  }
  function bgFull(c, p) { if (cr(c).bg.length >= p.bg) { say('Punti di background esauriti.'); return true; } return false; }
  function addBg(c, e) { cr(c).bg.push(e); S.save(); render(); }
  G.acts.cr_bgroll = function (b) {
    var c = S.cur(), p = person(c); if (!p || bgFull(c, p)) return;
    var kind = b.dataset.kind, e = kind === 'spec' ? X.rollSpecial(p.id, dice.d100) : kind === 'ogg' ? X.rollObject(dice.d100) : X.rollMoney(dice.d100);
    U.showRoll('Background', e.title, e.roll); addBg(c, e);
  };
  G.acts.cr_bgpick = function () {
    var c = S.cur(), p = person(c), t = T(); if (!p || bgFull(c, p)) return;
    if (!t.bgpick) { say('Scegli un\'abilità speciale.'); return; }
    var x = C.BGX[p.id] || {}, row = null;
    C.BG.spec.forEach(function (r) { if (X.rangeKey(r[0], r[1]) === t.bgpick) row = r; });
    var title = row[2], text = row[3], log = [];
    if (x.rep && x.rep[t.bgpick]) { title = x.rep[t.bgpick][0]; text = x.rep[t.bgpick][1]; log.push('Sostituita per questo popolo.'); }
    if (x.reroll && x.reroll.indexOf(t.bgpick) >= 0) { say('Questo popolo non può avere l\'opzione ' + t.bgpick + ' (da ritirare).'); return; }
    addBg(c, { kind: 'spec', roll: 0, range: t.bgpick, title: title, text: text, log: log });
  };
  G.acts.cr_bggradi = function (b) {
    var c = S.cur(), p = person(c), t = T(), n = +b.dataset.n; if (!p || bgFull(c, p)) return;
    var idx = n === 2 ? t.bgsk : t.bgsk2;
    if (idx === '' || idx == null) { say('Scegli l\'abilità.'); return; }
    var s = c.skills[+idx], r = X.addRanks(c, s.k, n, dice.d);
    addBg(c, { kind: 'gradi', title: '+' + n + ' gradi in ' + s.name, text: 'Gradi ' + r.before + ' → ' + r.after + '.', applied: s.name });
  };
  G.acts.cr_bgstat = function (b) {
    var c = S.cur(), p = person(c), t = T(), n = +b.dataset.n; if (!p || bgFull(c, p)) return;
    var list = n === 2 ? [t.bgstat] : String(t.bgstat3 || '').toUpperCase().split(/[\s,]+/).filter(Boolean);
    var okList = list.filter(function (s) { return c.stats[s] && s !== 'AS'; });
    if ((n === 2 && okList.length !== 1) || (n === 3 && (okList.length !== 3 || new Set(okList).size !== 3))) { say(n === 2 ? 'Scegli la caratteristica.' : 'Scrivi tre sigle diverse (FR, AG, CO, IN, IT, PR).'); return; }
    var add = n === 2 ? 2 : 1;
    okList.forEach(function (s) { c.stats[s].score = Math.min(101, R.num(c.stats[s].score) + add); });
    addBg(c, { kind: 'car', title: n === 2 ? '+2 a ' + okList[0] : '+1 a ' + okList.join(', '), text: '', applied: 'caratteristiche aumentate' });
  };
  G.acts.cr_bglang = function () {
    var c = S.cur(), p = person(c), t = T(); if (!p || bgFull(c, p)) return;
    var l = String(t.bglang || '').trim(); if (!l) { say('Scrivi il nome della lingua.'); return; }
    c.lingue = (c.lingue ? c.lingue + ' ' : '') + l + ' (5).'; t.bglang = '';
    addBg(c, { kind: 'ling', title: 'Lingua: ' + l + ' (5)', text: '', applied: 'aggiunta alle lingue' });
  };
  G.acts.cr_bgdel = function (b) {
    var c = S.cur(), k = cr(c); if (!confirm('Togliere questa voce dal background? Gli effetti già applicati alla scheda non vengono annullati.')) return;
    k.bg.splice(+b.dataset.i, 1); S.save(); render();
  };
  G.acts.cr_bgapply = function (b) {
    var c = S.cur(), k = cr(c), e = k.bg[+b.dataset.i], t = T(); if (!e || e.applied) return;
    function bump(i, v) { var s = c.skills[i]; s.spec = R.num(s.spec) + v; }
    if (e.kind === 'den') { c.denaro = (c.denaro ? c.denaro + ' + ' : '') + e.mo + ' MO'; e.applied = e.mo + ' MO nel denaro'; }
    else if (e.kind === 'ogg') { c.inv.push({ n: e.title, q: '1', note: e.text.slice(0, 160) }); e.applied = 'nell\'inventario'; }
    else {
      var fx = SPEC_FX[e.title];
      if (fx === 'skill5' || fx === 'sec15') {
        if (!t.bgsk) { say('Scegli l\'abilità.'); return; }
        var i = +t.bgsk; bump(i, fx === 'skill5' ? 5 : 15); e.applied = '+' + (fx === 'skill5' ? 5 : 15) + ' a ' + c.skills[i].name;
      } else if (fx === 'mov10') { c.skills.forEach(function (s, i) { if (s.cat === 'mov') bump(i, 10); }); e.applied = '+10 a tutte le manovre in movimento'; }
      else if (fx === 'oss10') { ['percez', 'tracce'].forEach(function (key) { bump(X.skillIdx(c, key), 10); }); e.applied = '+10 a Percezione e Seguire tracce'; }
      else if (fx === 'bd5') { c.defs.bd.extra = R.num(c.defs.bd.extra) + 5; e.applied = '+5 al BD (il +5 al BO va aggiunto all\'arma, a mano)'; }
      else if (fx === 'lead10') { c.defs.lead.extra = R.num(c.defs.lead.extra) + 10; e.applied = '+10 alla leadership'; }
      else if (fx === 'tr10') { c.defs[t.bgdef].extra = R.num(c.defs[t.bgdef].extra) + 10; e.applied = '+10 al TR scelto'; }
    }
    S.save(); render();
  };

  /* ---------- 5. adolescenza ---------- */
  function stepAdol(c) {
    var k = cr(c), p = person(c), h = '<section class="card"><h2>5 · Adolescenza</h2>';
    if (!p) return h + '<p class="hint">Scegli prima il popolo.</p></section>';
    var t = X.adolescenceOf(p.id), plan = X.adolescencePlan(p.id);
    h += '<p class="hint">Gradi appresi prima della professione (TGP-5) per il popolo «' + esc(p.n) + '».</p><div class="chips">' +
      plan.map(function (x) { return '<span class="chip2">' + esc(SKILL_NAME[x.key] || x.key) + ' <b>' + x.ranks + '</b></span>'; }).join('') + '</div>';
    h += '<p class="hint">Lingue addizionali: <b>' + t.lingue + '</b> gradi da distribuire (massimo 5 per lingua; si possono portare a 5 le lingue del popolo o impararne di nuove) · punti background: <b>' + t.bgpunti + '</b> · probabilità di aver imparato una porzione di lista di incantesimi: <b>' + t.lista + '%</b>.</p>';
    h += '<div class="row"><button data-act="cr_adol">Applica i gradi di adolescenza</button><button class="ghost" data-act="cr_adolspell">Tira la lista di incantesimi (' + t.lista + '%)</button></div>';
    h += '<p class="hint">Applicare imposta i gradi delle abilità elencate (quelli già scritti in quelle righe vengono sostituiti). Per la Resistenza fisica l\'app tira i dadi della progressione (d10 per i gradi 1–10, d4 per i gradi 11–20, TB-4) e salva il bonus nella riga.</p>';
    if (k.adol === p.id) h += '<p class="hint ok">✔ Gradi di adolescenza applicati.</p>';
    if (k.spellRoll) h += '<p class="hint">Lista di incantesimi: ' + esc(k.spellRoll) + '</p>';
    return h + '</section>';
  }
  G.acts.cr_adol = function () {
    var c = S.cur(), p = person(c); if (!p) return;
    if (cr(c).adol === p.id && !confirm('I gradi di adolescenza sono già stati applicati: riapplicarli sostituisce di nuovo i gradi di quelle abilità. Procedere?')) return;
    var n = X.applyAdolescence(c, p.id, dice.d); S.save(); render(); say('Gradi di adolescenza applicati a ' + n + ' abilità.');
  };
  G.acts.cr_adolspell = function () {
    var c = S.cur(), p = person(c), k = cr(c); if (!p) return;
    var t = X.adolescenceOf(p.id), r = dice.d100(), ok = r <= t.lista;
    k.spellRoll = 'tiro ' + r + ' contro ' + t.lista + ': ' + (ok ? 'hai imparato una porzione di lista. Puoi sceglierla dopo aver deciso la professione, entro le restrizioni di popolo e professione.' : 'nessuna lista appresa.');
    U.showRoll('Lista di incantesimi', 'd100 contro ' + t.lista, r); S.save(); render();
  };

  /* ---------- 6. punti sviluppo ---------- */
  function stepPs(c) {
    var k = cr(c), f = prof(c), t = T();
    var h = '<section class="card"><h2>6 · Punti sviluppo e livelli</h2>';
    if (!f) return h + '<p class="hint">Scegli e applica la professione.</p></section>';
    h += '<p class="hint">Ogni livello (e alla creazione) hai i punti della tabella TGP-4 per la professione. Un grado in un\'abilità costa 1 PS, due gradi 3 PS; nessuna abilità sale più di due gradi per livello. ' +
      'Manovre in movimento: 1 PS per grado, senza limite. Si possono trasferire PS tra categorie: ogni PS ottenuto costa 2 PS se la professione ha già almeno 1 PS in quella categoria, altrimenti 4; Arti marziali sempre 2 a 1; ' +
      'Percezione si paga con PS di altre categorie a 1 a 1.</p>';
    var cats = C.PS_CATS.filter(function (x) { return f.ps[x[0]] || X.psPool(c, x[0]) !== 0; }).concat([['perc', 'Percezione (da altre categorie)']]);
    h += '<div class="scroll"><table class="sk"><thead><tr><th class="l">Categoria</th><th>Base</th><th>Disponibili</th><th>Spendi</th></tr></thead><tbody>';
    cats.forEach(function (x) {
      var ck = x[0], pool = X.psPool(c, ck), skills = (C.PS_SKILLS[ck] || []).map(function (key) { return X.skillIdx(c, key); }).filter(function (i) { return i >= 0 && (c.skills[i].cat !== 'sec' || c.skills[i].name); });
      if (ck === 'perc') skills = [X.skillIdx(c, 'percez')];
      if (ck === 'sec') skills = c.skills.map(function (s, i) { return s.cat === 'sec' && s.name ? i : -1; }).filter(function (i) { return i >= 0; });
      var opts = skills.map(function (i) { return [String(i), c.skills[i].name]; });
      var selv = t.sk[ck] != null && opts.some(function (o) { return o[0] === String(t.sk[ck]); }) ? String(t.sk[ck]) : (opts[0] ? opts[0][0] : '');
      h += '<tr><td class="l">' + esc(x[1]) + '</td><td>' + (f.ps[ck] || 0) + '</td><td><b>' + pool + '</b></td><td>';
      if (skills.length) {
        h += '<div class="row nm0">' + (skills.length > 1 ? U.sel('data-tc', 'cr.sk.' + ck, selv, opts, { cls: 'ps', label: 'Abilità ' + x[1] }) : '<span class="dim">' + esc(opts[0][1]) + '</span>') +
          '<button class="mini" data-act="cr_raise" data-cat="' + ck + '" data-n="1" data-sk="' + selv + '">+1 grado</button>' +
          (ck === 'mov' ? '<button class="mini" data-act="cr_raise" data-cat="' + ck + '" data-n="2" data-sk="' + selv + '">+2 gradi</button>' : '<button class="mini" data-act="cr_raise" data-cat="' + ck + '" data-n="2" data-sk="' + selv + '">+2 gradi (3 PS)</button>') + '</div>';
      } else {
        h += '<div class="row nm0"><button class="mini" data-act="cr_spend" data-cat="' + ck + '" data-n="1">−1 PS</button><button class="mini" data-act="cr_spend" data-cat="' + ck + '" data-n="3">−3 PS</button><span class="hint">' + (ck === 'ling' ? 'Lingue: aggiornale nel campo Lingue' : ck === 'liste' ? 'Liste: annotale tra gli incantesimi' : 'segna la spesa') + '</span></div>';
      }
      h += '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<h3>Trasferire punti</h3><div class="grid g3">' +
      U.field('Da', U.sel('data-t', 'cr.from', t.from, [['', '(categoria)']].concat(C.PS_CATS.map(function (x) { return [x[0], x[1]]; })))) +
      U.field('A', U.sel('data-t', 'cr.to', t.to, [['', '(categoria)'], ['perc', 'Percezione']].concat(C.PS_CATS.map(function (x) { return [x[0], x[1]]; })))) +
      U.field('PS da ottenere', U.inp('data-t', 'cr.amt', t.amt, { type: 'number' })) + '</div>' +
      '<div class="row"><button class="ghost" data-act="cr_transfer">Trasferisci</button></div>';
    var man = X.profManualBonuses(f, Math.max(1, Math.floor(R.num(c.livello)) || 1));
    h += '<div class="row"><button data-act="cr_newlevel">Passa al livello ' + ((Math.floor(R.num(c.livello)) || 0) + 1) + '</button></div>' +
      '<p class="hint">Il passaggio di livello azzera la spesa dei punti sviluppo e ricalcola i bonus di professione (TB-4.2). I PF del nuovo livello e l\'esperienza non sono nei documenti: aggiornali a mano.' +
      (man.length ? ' Da aggiornare a mano: ' + esc(man.join('; ')) + '.' : '') + '</p>';
    return h + '</section>';
  }
  G.acts.cr_raise = function (b) {
    var c = S.cur(), t = T(), cat = b.dataset.cat, n = +b.dataset.n, sk = t.sk[cat] != null ? t.sk[cat] : b.dataset.sk;
    var f = X.profByName(cr(c).prof || c.prof); if (!f) { say('Scegli la professione.'); return; }
    var i = +sk; if (isNaN(i) || !c.skills[i]) { say('Scegli l\'abilità.'); return; }
    var r = X.raiseSkill(c, cat, c.skills[i].k, n, dice.d);
    if (!r.ok) { say(r.msg); return; }
    S.save(); render(); say(c.skills[i].name + ': ' + r.before + ' → ' + r.after + ' gradi (−' + r.cost + ' PS).');
  };
  G.acts.cr_spend = function (b) {
    var c = S.cur(), r = X.spendPlain(c, b.dataset.cat, +b.dataset.n); if (!r.ok) { say(r.msg); return; } S.save(); render();
  };
  G.acts.cr_transfer = function () {
    var c = S.cur(), t = T(), r = X.transfer(c, t.from, t.to, Math.floor(R.num(t.amt)));
    if (!r.ok) { say(r.msg); return; } S.save(); render(); say('Trasferiti: costo ' + r.cost + ' PS.');
  };
  G.acts.cr_newlevel = function () {
    var c = S.cur(); if (!confirm('Passare al livello ' + ((Math.floor(R.num(c.livello)) || 0) + 1) + '? La spesa dei punti sviluppo si azzera e i bonus di professione si ricalcolano.')) return;
    var lv = X.newLevel(c); S.save(); render(); say('Ora sei al livello ' + lv + '.');
  };

  function render_() {
    var c = S.cur();
    return '<section class="card"><p class="hint">Percorso di creazione del personaggio «' + esc(c.name) + '», nell\'ordine del compendio. Ogni passo scrive nella scheda; puoi tornare indietro e rifare. ' +
      'Il compendio non dà tabelle per i PF iniziali: scrivili in Scheda.</p></section>' +
      stepPeople(c) + stepProf(c) + stepStats(c) + stepBg(c) + stepAdol(c) + stepPs(c);
  }
  G.pages.create = { render: render_ };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Pagina Guida: popoli, professioni, tabelle di creazione, disponibilità temporale, abilità secondarie. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var R = G.rules, D = G.data, U = G.ui, S = G.store, C = G.creation, X = G.creationlogic, esc = U.esc;
  var dice = G.dice.dice;
  G.acts = G.acts || {};

  function T() { return U.tmp.ref || (U.tmp.ref = { people: '', q: '', istat: '' }); }
  var TIPO = { P: 'Usufruttore puro', I: 'Usufruttore ibrido', R: 'Usufruttore parziale', N: 'Non usufruttore', A: 'Altro' };

  function peopleSec() {
    var t = T(), p = X.personById(t.people);
    return '<section class="card"><h2>Popoli</h2>' + U.field('Popolo', U.sel('data-t', 'ref.people', t.people, [['', '(scegli)']].concat(C.PEOPLE.map(function (x) { return [x.id, x.g + ' — ' + x.n]; })), { re: 1, label: 'Popolo' })) +
      (p ? G.peopleHtml(p) : '<p class="hint">Le schede dei 28 popoli del Prospetto sui Popoli: caratteristiche speciali, lingue, professioni, equipaggiamento, background, abilità tipiche.</p>') + '</section>';
  }

  function profSec() {
    var h = '<section class="card"><h2>Professioni</h2><p class="hint">TB-6 (caratteristica fondamentale, regno, bonus per livello) e TGP-4 (punti sviluppo per livello). «Regno (n)»: livello massimo delle liste apribili.</p>' +
      '<div class="scroll"><table class="sk"><thead><tr><th class="l">Professione</th><th>Tipo</th><th>Car.</th><th>Regno</th><th class="l">Bonus per livello</th></tr></thead><tbody>';
    C.PROFS.forEach(function (f) {
      h += '<tr><td class="l"><b>' + esc(f.n) + '</b></td><td>' + TIPO[f.tipo] + '</td><td>' + esc(f.stat.length ? f.stat.join(' o ') : '*') + (f.sec.length ? ' / ' + esc(f.sec.join(' o ')) : '') + '</td><td>' + esc(f.regno) + '</td><td class="l">' +
        Object.keys(f.b).map(function (k) { return esc(C.BONUS_LABEL[k]) + ' +' + f.b[k]; }).join('; ') + '</td></tr>';
    });
    h += '</tbody></table></div><p class="hint">* Cittadino: una caratteristica correlata all\'occupazione. Car. = principale / secondaria. Evocatore, Stregone, Mistico e Astrologo scelgono una principale e una secondaria tra quelle indicate.</p>';
    h += '<h3>Punti sviluppo (TGP-4)</h3><div class="scroll"><table class="sk"><thead><tr><th class="l">Professione</th>' + C.PS_CATS.map(function (x) { return '<th title="' + esc(x[1]) + '">' + esc(x[1].replace('Abilità ', 'Ab. ').replace('Manovre in movimento', 'Manovre')) + '</th>'; }).join('') + '</tr></thead><tbody>';
    C.PROFS.forEach(function (f) { h += '<tr><td class="l">' + esc(f.n) + '</td>' + C.PS_CATS.map(function (x) { return '<td>' + (f.ps[x[0]] || 0) + '</td>'; }).join('') + '</tr>'; });

      '<details><summary>Accesso alle liste di incantesimi</summary>' +

    var A = G.adolescence || {}, keys = [['mov_nessuna', 'Nessuna'], ['mov_cuoio_g', 'C. grezzo'], ['mov_cuoio_r', 'C. rinf.'], ['mov_maglie', 'Maglia'], ['taglio', 'Taglio'], ['contund', 'Contund.'], ['due_mani', '2 mani'],

    h += '<details><summary>Sviluppo dei bonus di professione (TB-4.2)</summary><div class="scroll"><table class="sk"><thead><tr><th class="l">Progressione</th><th>Livelli 1–20</th><th>Livello 21 e oltre</th></tr></thead><tbody>' +

  }
  G.acts.ref_inc = function () {
    var t = T(), c = S.cur();

  G.acts.ref_addsec = function (b) {

  function render() {

<script>
/* Pagina Combattimento: calcolo dell'attacco, colpo critico, avversari. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var R = G.rules, D = G.data, U = G.ui, S = G.store, T = G.tables, esc = U.esc;
  var LETTERS = ['', 'T', 'A', 'B', 'C', 'D', 'E'];
  var ORDER = ['T', 'A', 'B', 'C', 'D', 'E'];
  var TYPE_TC = { IM: 'TC-1', TA: 'TC-2', PU: 'TC-3', PE: 'TC-4', PR: 'TC-5', CA: 'TC-6', FR: 'TC-7', EL: 'TC-8', IMM: 'TC-9' };
  var ARMOR_NAMES = ['corazza di piastre', 'corazza di maglie', 'cuoio rinforzato', 'cuoio grezzo', 'nessuna armatura'];

  /* Dati dell'arma scelta: dal catalogo (TSC-1) oppure personalizzati. */
  function weaponInfo(w) {
    if (!w) return null;
    var cw = null; ((G.weapondata) || []).forEach(function (x) { if (x.id === w.id) cw = x; });
    if (cw) {
      return { name: cw.n, atk: cw.atk, limit: cw.limit || '', cm: cw.cm, c1: cw.c1 && { ct: TYPE_TC[cw.c1.type] || '', max: cw.c1.max }, c2: cw.c2 && { ct: TYPE_TC[cw.c2.type] || '', max: cw.c2.max },
        mods: cw.mods, manual: cw.manual, note: cw.note, git: cw.git };
    }
    return { name: w.n, atk: w.atk, limit: '', cm: w.fumble === '' ? null : R.num(w.fumble), c1: { ct: w.ct, max: null }, c2: null, mods: [], manual: [], note: '', git: w.git };
  }
  /* Lettera del critico limitata al tipo massimo dell'arma (la lettera tra parentesi). */
  function capLetter(letter, max) {
    if (!letter || !max) return letter || '';
    return ORDER.indexOf(letter) > ORDER.indexOf(max) ? max : letter;
  }
  /* Secondario: se il primario è maggiore di A, un grado sotto il primario (regola scritta per gli animali, TSC-2; qui estesa alle armi). */
  function secondaryLetter(primary, c2) {
    if (!c2 || !primary) return '';
    var i = ORDER.indexOf(primary); if (i < 2) return '';
    return capLetter(ORDER[i - 1], c2.max);
  }
  /* Somma dei modificatori «sulla TA» dell'arma per l'armatura scelta */
  function taMod(wi, armor) {
    var t = 0;
    if (wi && armor !== '') wi.mods.forEach(function (m) { if (!m.arm || m.arm.indexOf(+armor) >= 0) t += m.v; });
    return t;
  }
  /* Tabella di fallimento suggerita in base alla tabella di attacco (scelta mia: il compendio non lo dice esplicitamente) */
  var FUMBLE_DEFAULT = { 'TA-1': 'TTM-1', 'TA-2': 'TTM-1', 'TA-3': 'TTM-1', 'TA-10': 'TTM-1', 'TA-4': 'TTM-2', 'TA-11': 'TTM-6', 'TA-7': 'TTM-3', 'TA-8': 'TTM-3' };

  function cb() {
    if (!U.tmp.cb) U.tmp.cb = { weapon: '', atk: '', armor: '', limit: '', fumble: '', skill: '', bo: '', bd: '', mods: {}, extra: '', roll: '', pf: '', letter: '', ct: '', ft: '', croll: '', letter2: '', ct2: '', croll2: '', cres2: null, wi: null, cres: null, fres: null, res: null, target: '' };
    return U.tmp.cb;
  }
  function tableById(list, id) { for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i]; return null; }
  function atkList(st) { return ((G.tabledata && G.tabledata.atk) || []).concat(st.atk); }
  function critList(st) { return ((G.tabledata && G.tabledata.crit) || []).concat(st.crit); }

  function modsSum(f, melee) {
    var t = 0; D.ATK_MODS.forEach(function (m) { if (f.mods[m.id] && (melee || !m.melee)) t += m.v; });
    return t;
  }

  /* Calcolo puro dell'attacco, separato dal DOM per poterlo provare. */
  function resolveAttack(f, c, st, rollFn) {
    var cx = R.ctx(st.settings), table = tableById(atkList(st), f.atk);
    var r = f.roll !== '' ? { first: R.num(f.roll), total: R.num(f.roll), rolls: [R.num(f.roll)], dir: '' } : rollFn(st.settings.dice);
    var bo = f.skill !== '' ? R.skillTotal(c, +f.skill, cx) : R.num(f.bo);
    var bd = R.num(f.bd), ms = modsSum(f, true), extra = R.num(f.extra);
    var total = r.total + bo - bd + ms + extra, tam = taMod(f.wi, f.armor);
    var res = { ta: tam, wi: f.wi, roll: r, bo: bo, bd: bd, mods: ms, extra: extra, total: total, table: table, cell: null, fumble: false, fail: false, beyond: false, capped: false, ti: false, fumbleMax: null };
    if (table) {
      var fm = f.fumble !== '' ? R.num(f.fumble) : table.fumble;
      res.fumbleMax = fm;
      if (fm != null && r.first <= fm) res.fumble = true;
      if (f.armor !== '') {
        var a = T.attackCell(table, +f.armor, total + tam, { first: r.first, limit: f.limit });
        res.cell = a.cell; res.beyond = a.beyond; res.capped = a.capped; res.ti = a.ti;
        res.fail = !!(a.cell && a.cell.fail);
      }
    }
    return res;
  }

  function attackHtml(f, st, c) {
    var skills = c.skills.map(function (s, i) { return [String(i), s.name + ' (' + R.fmt(R.skillTotal(c, i, R.ctx(st.settings))) + ')']; })
      .filter(function (x, i) { var s = c.skills[i]; return (s.cat === 'arm' || s.cat === 'ama' || s.cat === 'mag') && s.name; });
    var tables = [['', '(nessuna: leggo io la tabella)']].concat(atkList(st).map(function (t) { return [t.id, t.name]; }));
    var t = tableById(atkList(st), f.atk);
    var armors = t ? [['', '(scegli)']].concat(t.armors.map(function (a, i) { return [String(i), a]; })) : [];
    var wl = [['', '(nessuna: scelgo a mano)']].concat(c.weapons.map(function (w, i) { return [String(i), w.n || 'Arma ' + (i + 1)]; }));
    var h = '<section class="card"><h2>Attacco</h2><div class="grid g2">' +
      (c.weapons.length ? U.field('Arma', U.sel('data-act-change', 'weapon', f.weapon, wl)) : '') +
      U.field('Tabella di attacco', U.sel('data-t', 'cb.atk', f.atk, tables, { re: 1 })) +
      (t ? U.field('Armatura del bersaglio', U.sel('data-t', 'cb.armor', f.armor, armors)) : '') +
      (t && t.limits && t.limits.length ? U.field(t.id === 'TA-7' ? 'Tipo di dardo' : 'Taglia dell\'attacco', U.sel('data-t', 'cb.limit', f.limit, [['', '(scegli)']].concat(t.limits.map(function (l) { return [l.label, l.label]; })))) : '') +
      (t && t.fumble == null ? U.field('Colpo maldestro: tiro massimo (si imposta in Scheda → Armi)', U.inp('data-t', 'cb.fumble', f.fumble, { type: 'number', ph: 'es. 4' })) : '') +
      U.field('BO dalla scheda', U.sel('data-t', 'cb.skill', f.skill, [['', '(a mano)']].concat(skills), { re: 1 })) +
      (f.skill === '' ? U.field('BO a mano', U.inp('data-t', 'cb.bo', f.bo, { type: 'number' })) : '') +
      U.field('BD del bersaglio', U.inp('data-t', 'cb.bd', f.bd, { type: 'number' })) +
      U.field('Altri modificatori', U.inp('data-t', 'cb.extra', f.extra, { type: 'number' })) +
      U.field('Tiro già fatto (vuoto = tira l\'app)', U.inp('data-t', 'cb.roll', f.roll, { type: 'number' })) + '</div><div class="mods">' +
      D.ATK_MODS.map(function (m) { return U.check('data-tc', 'cb.mods.' + m.id, f.mods[m.id], m.label + ' (' + R.fmt(m.v) + ')'); }).join('') + '</div>' +
      '<p class="hint">I modificatori «sul fianco», «da dietro», «sorpreso», «stordito» valgono solo in mischia: con armi da tiro o da lancio non spuntarli.</p>' +
      '<div class="row"><button class="big" data-act="attack">Tira l\'attacco</button><button class="ghost" data-act="mybd">Usa il mio BD come BD</button></div>';
    if (f.res) h += resultHtml(f, f.res, st);
    return h + '</section>';
  }

  function fumbleBlock(f, res, st) {
    var ids = critList(st).filter(function (x) { return /^TTM-/.test(x.id) || x.type === 'crit' && !/^TC-/.test(x.id); });
    var def = f.ft || (res.table && FUMBLE_DEFAULT[res.table.id]) || '';

  function resultHtml(f, r, st) {
    var s = '<div class="res"><div>Tiro ' + (r.roll.rolls.length > 1 ? r.roll.rolls.join(', ') + ' = ' : '') + '<b>' + r.roll.total + '</b> + BO ' + R.fmt(r.bo) + ' − BD ' + r.bd +

  function critBlock(f, st, k, title) {
    var cts = [['', '(nessuna: leggo io)']].concat(critList(st).filter(function (t) { return !/^TTM-/.test(t.id); }).map(function (t) { return [t.id, t.name]; }));

      '<div class="row"><button data-act="crit" data-k="' + k + '" ' + (f['letter' + k] ? '' : 'disabled') + '>Tira il critico</button></div>';

  function enemies(f, st) {
    var h = '<section class="card"><h2>Avversari</h2>';
    if (!st.enemies.length) h += '<p class="hint">Nessun avversario.</p>';
    st.enemies.forEach(function (e, i) {
      var cur = R.num(e.max) - R.num(e.dmg);

        U.inp('data-p-en', i + '.n', e.n, { cls: 'wide', label: 'Nome avversario' }) + '</label><span class="pfb">' + (e.max === '' ? 'PF ?' : cur + '/' + e.max) + '</span>' +

  function logHtml(st) {

<script>
/* Avvio, navigazione e gestione degli eventi. */
(function (root) {
  'use strict';
  var G = root.GIRSA, R = G.rules, D = G.data, U = G.ui, S = G.store, T = G.tables, dice = G.dice.dice;
  var P = G.pages, esc = U.esc;
  var ROUTES = [['sheet', 'Scheda'], ['create', 'Crea'], ['dice', 'Dadi'], ['combat', 'Combattimento'], ['diary', 'Diario'], ['ref', 'Guida'], ['data', 'Dati']];
  var STATE_LISTS = { enemies: 1, atk: 1, crit: 1 };

  function route() { var r = (location.hash || '').replace(/^#\/?/, ''); return P[r] ? r : 'sheet'; }
  function val(t) { return t.type === 'checkbox' ? t.checked : t.value; }

  function renderHeader() {
    var st = S.get(), c = S.cur();
    document.getElementById('charsel').innerHTML = st.chars.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === st.cur ? ' selected' : '') + '>' + esc(x.name || '(senza nome)') + '</option>';
    }).join('');
    document.getElementById('nav').innerHTML = ROUTES.map(function (r) {
      return '<a href="#/' + r[0] + '"' + (r[0] === route() ? ' aria-current="page"' : '') + '>' + r[1] + '</a>';
    }).join('');
    U.updateCalc();
  }
  function render() {
    var y = root.scrollY;
    document.getElementById('view').innerHTML = P[route()].render();
    renderHeader(); U.paintLast();
    root.scrollTo(0, y);
  }

  function pushLog(text) { U.logLine(S.get().clog, text); }
  function need(cond, msg) { if (!cond) U.toast(msg); return cond; }

  /* ---------- eventi di input ---------- */
  document.addEventListener('input', function (e) {
    var t = e.target, st = S.get();
    if (t.hasAttribute('data-p')) {
      S.setPath(S.cur(), t.getAttribute('data-p'), val(t));
      if (t.getAttribute('data-p') === 'name') renderHeader();
    } else if (t.hasAttribute('data-s')) {
      var v = val(t); if (t.type === 'number') v = v === '' ? '' : +v;
      S.setPath(st.settings, t.getAttribute('data-s'), v);
    } else if (t.hasAttribute('data-t') || t.hasAttribute('data-tc')) {
      S.setPath(U.tmp, t.getAttribute('data-t') || t.getAttribute('data-tc'), val(t));
      return;
    } else if (t.hasAttribute('data-p-en')) {
      S.setPath(st.enemies, t.getAttribute('data-p-en'), val(t));
    } else return;
    S.save(); U.updateCalc();
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-act-change')) {
      var a = t.getAttribute('data-act-change');
      if (a === 'char') { S.get().cur = t.value; S.save(); render(); }
      if (a === 'weapon') {
        var f = P.combat.cb(), w = S.cur().weapons[+t.value], wi = P.combat.weaponInfo(w);
        f.weapon = t.value; f.limit = ''; f.res = null; f.cres = null; f.cres2 = null; f.fres = null; f.letter = ''; f.letter2 = ''; f.wi = wi;
        if (w && wi) { f.atk = wi.atk || ''; f.limit = wi.limit || ''; f.skill = w.skill; f.fumble = wi.cm == null ? '' : String(wi.cm); f.ct = wi.c1 ? wi.c1.ct : ''; f.ct2 = wi.c2 ? wi.c2.ct : ''; f.armor = ''; }
        render();
      }
      if (a.indexOf('wcat:') === 0) {
        var wi2 = +a.slice(5), ww = S.cur().weapons[wi2], cw = null;
        U.weaponCat().forEach(function (x) { if (x.id === t.value) cw = x; });
        ww.id = t.value; if (cw && !ww.n) ww.n = cw.n; S.save(); render();
      }
      var ap = a.split(':');
      if (G.changes && G.changes[ap[0]]) G.changes[ap[0]](t.value, ap[1]);
      if (a === 'popolo') { if (R.applyPopolo(S.cur(), t.value)) { S.save(); render(); U.toast('Applicate le modifiche del popolo (TB-3).'); } else { S.cur().popolo = ''; S.save(); } }
    } else if (t.hasAttribute('data-act-file')) {
      importFile(t.files && t.files[0]); t.value = '';
    } else if (t.getAttribute('data-re')) render();
  });

  /* ---------- azioni ---------- */
  function listOf(name) {
    var st = S.get();
    return STATE_LISTS[name] ? st[name] : S.getPath(S.cur(), name);
  }
  function openRoll(label, bonus) {
    var r = dice.open(S.get().settings.dice), tot = r.total + bonus;
    U.showRoll(label, 'tiro ' + (r.rolls.length > 1 ? r.rolls.join(', ') + ' = ' + r.total : r.total) + (bonus ? ' ' + R.fmt(bonus) : ''), tot);
    return tot;
  }

  var ACT = {
    pf: function (b) { var c = S.cur(); c.pf.dmg = Math.max(0, R.num(c.pf.dmg) + (+b.dataset.n)); S.save(); render(); },
    newchar: function () {
      var c = R.newChar('Personaggio ' + (S.get().chars.length + 1)); S.get().chars.push(c); S.get().cur = c.id; S.save(); location.hash = '#/sheet'; render();
    },
    dupchar: function () {
      var c = JSON.parse(JSON.stringify(S.cur())); c.id = R.uid(); c.name += ' (copia)'; S.get().chars.push(c); S.get().cur = c.id; S.save(); render();
    },
    delchar: function () {
      var st = S.get(); if (!need(st.chars.length > 1, 'Deve restare almeno un personaggio.')) return;
      if (!confirm('Eliminare «' + S.cur().name + '»? Non si può annullare.')) return;
      st.chars = st.chars.filter(function (x) { return x.id !== st.cur; }); st.cur = st.chars[0].id; S.save(); render();
    },
    rollskill: function (b) { var c = S.cur(), i = +b.dataset.i; openRoll(c.skills[i].name || 'Abilità', R.skillTotal(c, i, R.ctx(S.get().settings))); },
    rolldef: function (b) {
      var d = D.DEFENSES.filter(function (x) { return x[0] === b.dataset.k; })[0];
      openRoll(d[1], R.defenseTotal(S.cur(), d[0], d[2], R.ctx(S.get().settings)));
    },
    d100o: function () { openRoll('d100 aperto', 0); },
    d100c: function () { var r = dice.closed(); U.showRoll('d100 chiuso', '', r.total); render(); },
    die: function (b) { var n = +b.dataset.d.slice(1), v = dice.d(n); U.showRoll(b.dataset.d, '', v); render(); },
    rollexpr: function () {
      var r = dice.expr(U.tmp.expr || ''); if (!need(r, 'Espressione non valida. Esempio: 2d6+1')) return;
      U.showRoll(U.tmp.expr, '[' + r.rolls.join(', ') + ']' + (r.mod ? ' ' + R.fmt(r.mod) : ''), r.total); render();
    },
    clearroll: function () { S.get().dlog = []; S.save(); render(); },
    add: function (b) {
      var l = b.dataset.list, c = S.cur();
      c[l].push(l === 'inv' ? { n: '', q: '', note: '' } : l === 'weapons' ? { id: '', n: '', atk: '', skill: '', ct: '', fumble: '', git: '' } : { n: '', lvl: '', note: '' }); S.save(); render();
    },
    del: function (b) {
      var arr = listOf(b.dataset.list); if (!arr) return;
      if ((b.dataset.list === 'atk' || b.dataset.list === 'crit') && !confirm('Eliminare questa tabella?')) return;
      arr.splice(+b.dataset.i, 1); S.save(); render();
    },
    attack: function () {
      var f = P.combat.cb(), st = S.get(), c = S.cur();
      if (f.atk && !need(f.armor !== '', 'Scegli l\'armatura del bersaglio.')) return;
      if (f.atk && (P.combat.tableById(P.combat.atkList(S.get()), f.atk).limits || []).length && !need(f.limit !== '', 'Scegli taglia o tipo di dardo.')) return;
      var res = P.combat.resolveAttack(f, c, st, dice.open);
      f.res = res;
      if (res.cell) {
        f.pf = String(res.cell.pf); f.cres = null; f.cres2 = null;
        f.letter = res.fail ? '' : P.combat.capLetter(res.cell.crit || '', f.wi && f.wi.c1 && f.wi.c1.max);
        f.letter2 = P.combat.secondaryLetter(f.letter, f.wi && f.wi.c2);
      }
      var desc = 'Attacco ' + res.total + (res.cell && !res.fail ? ' → ' + res.cell.pf + ' PF' + (res.cell.crit ? ' + critico ' + res.cell.crit : '') : '') + (res.fumble ? ' · FALLIMENTO' : '');
      pushLog(desc); U.showRoll('Attacco', 'tiro ' + res.roll.total + ' ' + R.fmt(res.bo) + ' − ' + res.bd, res.total);
      S.save(); render();
    },
    fumbleroll: function () {
      var f = P.combat.cb(), st = S.get(), id = f.ft || (f.res && f.res.table && ({ 'TA-1': 'TTM-1', 'TA-2': 'TTM-1', 'TA-3': 'TTM-1', 'TA-10': 'TTM-1', 'TA-4': 'TTM-2', 'TA-11': 'TTM-6', 'TA-7': 'TTM-3', 'TA-8': 'TTM-3' })[f.res.table.id]);
      var tb = P.combat.tableById(P.combat.critList(st), id); if (!need(tb, 'Scegli la tabella dei fallimenti.')) return;
      var raw = dice.closed().total, row = T.lookupCrit(tb, raw);
      f.fres = { raw: raw, row: row }; pushLog('Fallimento (' + tb.id + ') ' + raw + ': ' + row.text); U.showRoll('Fallimento', tb.id, raw); S.save(); render();
    },
    mybd: function () {
      var f = P.combat.cb(), c = S.cur();
      f.bd = String(R.defenseTotal(c, 'bd', 'AG', R.ctx(S.get().settings)) + R.num(c.prot.modbd)); render();
    },
    crit: function (b) {
      var k = b.getAttribute('data-k') || '', f = P.combat.cb(), st = S.get(), letter = f['letter' + k], croll = f['croll' + k];
      var raw = croll !== '' ? R.num(croll) : dice.closed().total;
      var mod = D.CRIT_MOD[letter] || 0, total = raw + mod, tb = P.combat.tableById(P.combat.critList(st), f['ct' + k]);
      f['cres' + k] = { raw: raw, mod: mod, letter: letter, total: total, row: tb ? T.lookupCrit(tb, total) : null };
      pushLog('Critico ' + (k ? 'secondario ' : '') + letter + ': ' + raw + ' ' + R.fmt(mod) + ' = ' + total + (f['cres' + k].row ? ' — ' + f['cres' + k].row.text : ''));
      U.showRoll('Critico ' + letter, raw + ' ' + R.fmt(mod), total); S.save(); render();
    },
    dmgenemy: function () {
      var f = P.combat.cb(), st = S.get(), e = st.enemies.filter(function (x) { return x.id === f.target; })[0];
      if (!need(e, 'Seleziona un avversario.') || !need(f.pf !== '', 'Indica i PF inflitti.')) return;
      e.dmg = R.num(e.dmg) + R.num(f.pf); pushLog(e.n + ' subisce ' + f.pf + ' PF'); S.save(); render();
    },
    dmgme: function () {
      var f = P.combat.cb(), c = S.cur(); if (!need(f.pf !== '', 'Indica i PF inflitti.')) return;
      c.pf.dmg = R.num(c.pf.dmg) + R.num(f.pf); pushLog(c.name + ' subisce ' + f.pf + ' PF'); S.save(); render();
    },
    enadd: function () {
      var e = U.tmp.en || {}; if (!need((e.n || '').trim(), 'Dai un nome all\'avversario.')) return;
      S.get().enemies.push({ id: R.uid(), n: e.n.trim(), max: e.max === undefined ? '' : e.max, dmg: 0 }); U.tmp.en = {}; S.save(); render();
    },
    enhit: function (b) { var e = S.get().enemies[+b.dataset.i]; e.dmg = Math.max(0, R.num(e.dmg) + (+b.dataset.n)); S.save(); render(); },
    target: function (b) { P.combat.cb().target = S.get().enemies[+b.dataset.i].id; },
    clearclog: function () { S.get().clog = []; S.save(); render(); },
    diaryadd: function () {
      var d = S.cur().diary, s = (U.tmp.dn || '').trim(); if (!need(s, 'Scrivi una nota.')) return;
      d.log.unshift({ t: Date.now(), par: d.par, s: s }); U.tmp.dn = ''; S.save(); render();
    },
    flagadd: function () {
      var s = (U.tmp.df || '').trim(); if (!need(s, 'Scrivi il segnalino.')) return;
      S.cur().diary.flags.push(s); U.tmp.df = ''; S.save(); render();
    },
    impatk: function () {
      var im = U.tmp.imp || {}, armors = (im.armors || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!need((im.name || '').trim(), 'Dai un nome alla tabella.') || !need(armors.length, 'Indica i nomi delle colonne di armatura.')) return;
      try {
        var rows = T.parseAttackText(im.text || '', armors.length);
        S.get().atk.push({ id: R.uid(), name: im.name.trim(), armors: armors, fumble: im.fumble === undefined ? '' : im.fumble, rows: rows });
        U.tmp.imp = null; S.save(); render(); U.toast('Tabella importata: ' + rows.length + ' righe.');
      } catch (err) { U.toast(err.message); }
    },
    impcrit: function () {
      var im = U.tmp.imp || {};
      if (!need((im.cname || '').trim(), 'Dai un nome alla tabella.')) return;
      try {
        var rows = T.parseCritText(im.ctext || '');
        S.get().crit.push({ id: R.uid(), name: im.cname.trim(), rows: rows });
        U.tmp.imp = null; S.save(); render(); U.toast('Tabella importata: ' + rows.length + ' righe.');
      } catch (err) { U.toast(err.message); }
    },
    resetsettings: function () { S.get().settings = R.defaultSettings(); S.save(); render(); U.toast('Impostazioni ripristinate.'); },
    healroll: function () {
      var f = U.tmp.heal || (U.tmp.heal = { roll: '', col: '1', sev: 'lieve' }), r = dice.d100();
      f.roll = String(r + R.statBonus(S.cur(), 'CO', R.ctx(S.get().settings))); U.showRoll('Guarigione', 'd100 ' + r + ' + bonus CO', f.roll); render();
    },
    export: function () {
      var blob = new Blob([JSON.stringify(S.get(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'girsa-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    },
    wipe: function () {
      if (!confirm('Cancellare TUTTI i personaggi, le tabelle e le impostazioni di questo dispositivo?')) return;
      S.replaceAll(S.blank()); render(); U.toast('Dati cancellati.');
    }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.tagName === 'INPUT' && b.type !== 'radio' || b.disabled) return;
    var nm = b.getAttribute('data-act'), f = ACT[nm] || (G.acts && G.acts[nm]); if (f) f(b);
  });

  /* ---------- importazione file ---------- */
  function validTable(o) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.rows)) throw new Error('Tabella non valida: mancano le righe.');
    if (o.type === 'attack') {
      if (!Array.isArray(o.armors) || !o.armors.length) throw new Error('Tabella di attacco senza colonne di armatura.');
      T.validateAttackRows(o.rows);
      o.rows.forEach(function (r, i) { if (!Array.isArray(r.cells) || r.cells.length !== o.armors.length) throw new Error('Riga ' + (i + 1) + ': numero di celle diverso dalle colonne.'); });
      return { id: R.uid(), name: String(o.name || 'Senza nome'), armors: o.armors.map(String), fumble: o.fumble == null ? '' : o.fumble, rows: o.rows };
    }
    o.rows.forEach(function (r, i) { if (typeof r.text !== 'string' || typeof r.max !== 'number') throw new Error('Riga ' + (i + 1) + ' dei critici non valida.'); });
    return { id: R.uid(), name: String(o.name || 'Senza nome'), rows: o.rows };
  }
  function importFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result), st = S.get();
        if (o && Array.isArray(o.chars)) {
          if (!confirm('Sostituire tutti i dati attuali con quelli del file?')) return;
          S.replaceAll(o); render(); U.toast('Backup importato.'); return;
        }
        var arr = Array.isArray(o) ? o : [o], n = 0;
        arr.forEach(function (t) {
          if (t.type === 'attack') { st.atk.push(validTable(t)); n++; } else if (t.type === 'crit') { st.crit.push(validTable(t)); n++; } else throw new Error('Formato non riconosciuto.');
        });
        S.save(); render(); U.toast('Importate ' + n + ' tabelle.');
      } catch (err) { U.toast('Importazione fallita: ' + err.message); }
    };
    fr.readAsText(file);
  }

  /* ---------- avvio ---------- */
  function init() {
    S.load();
    root.addEventListener('hashchange', render);
    render();
    if (!S.ok()) U.toast('Il browser impedisce il salvataggio: usa «Esporta» in Dati.');
    root.addEventListener('pagehide', function () { S.flush(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) S.flush(); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    }
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  }
  G.app = { render: render, ACT: ACT, validTable: validTable };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
