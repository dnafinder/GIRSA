      '<p class="hint">Si tira 1d100 + Bonus Offensivo Base + modificatori e si legge la TA-9 nella colonna del regno e della protezione del bersaglio. Il numero ottenuto è il modificatore al tiro resistenza del bersaglio; «F» è un fallimento (tira sulla TTM-3). ' +
      'La colonna «Generale» è letta come quella da usare quando il bersaglio non ha nessuna delle protezioni elencate: il compendio non lo scrive in modo esplicito.</p>' +
      '<div class="grid g2">' + U.field('Regno', U.sel('data-t', 'sp.realm', f.realm, M.REALMS.map(function (x) { return [x.id, x.n]; }), { re: 1 })) +
      U.field('Protezione del bersaglio', U.sel('data-t', 'sp.col', f.col, cols)) +
      U.field('BO Incantesimi Base dalla scheda', U.sel('data-t', 'sp.skill', f.skill, skillOpts(c, ['mag', 'arm', 'ama']), { re: 1 })) +
      (f.skill === '' ? U.field('BO a mano', U.inp('data-t', 'sp.bo', f.bo, { type: 'number' })) : '') +
      U.field('Distanza', U.sel('data-t', 'sp.dist', f.dist, M.DIST.map(function (x) { return [String(x[0]), x[1]]; }))) +
      U.field('Preparazione', U.sel('data-t', 'sp.prep', f.prep, M.PREP.map(function (x) { return [String(x[0]), x[1]]; }))) +
      U.field('Bonus di copertura del bersaglio (si sottrae)', U.inp('data-t', 'sp.cover', f.cover, { type: 'number' })) +
      U.field('Altri modificatori', U.inp('data-t', 'sp.extra', f.extra, { type: 'number' })) +
      U.field('Tiro già fatto (vuoto = tira l\'app)', U.inp('data-t', 'sp.roll', f.roll, { type: 'number' })) + '</div><div class="mods">' +
      U.check('data-tc', 'sp.half', f.half, 'L\'attaccante ha perso più della metà dei PF (−10)') +
      U.check('data-tc', 'sp.stat', f.stat, 'Bersaglio statico: colto di sorpresa o prono, senza riparo (+10)') + '</div>' +
      '<div class="row"><button class="big" data-act="sp_cast">Tira l\'incantesimo</button></div>';
    var r = f.res;
    if (r) {
      h += '<div class="res"><div>Tiro ' + (r.roll.rolls.length > 1 ? r.roll.rolls.join(', ') + ' = ' : '') + '<b>' + r.roll.total + '</b> + BO ' + R.fmt(r.bo) + ' ' + R.fmt(r.mods) + ' = <b class="big">' + r.total + '</b>' +
        (r.out.ti ? ' · riga «TI» del tiro non modificato (' + r.roll.first + ')' : r.out.clamped ? ' · letto come ' + Math.min(95, Math.max(3, r.total)) + ' (limite 3–95)' : '') + '</div>' +
        (r.out.fail ? '<div class="warn"><b>Fallimento dell\'incantesimo</b>: tira sulla tabella dei fallimenti TTM-3 (nel blocco «Attacco», scegli l\'arma o la tabella e usa «Tira il fallimento»).</div>'
          : '<div class="hit">Modificatore al TR del bersaglio: <b>' + R.fmt(r.out.mod) + '</b></div>') + '</div>';
      if (!r.out.fail) {
        h += '<h3>Tiro resistenza del bersaglio</h3><div class="grid g3">' +
          U.field('Livello d\'attacco (livello di chi lancia)', U.inp('data-t', 'sp.alvl', f.alvl, { type: 'number', ph: String(alvl) })) +
          U.field('Livello del bersaglio', U.inp('data-t', 'sp.tlvl', f.tlvl, { type: 'number' })) +
          U.field('Bonus TR del bersaglio (regno dell\'incantesimo)', U.inp('data-t', 'sp.trb', f.trb, { type: 'number' })) + '</div><div class="mods">' +
          U.check('data-tc', 'sp.consent', f.consent, 'Bersaglio cosciente e consenziente (−50, livello 1)') +
          U.check('data-tc', 'sp.same', f.same, 'Bersaglio dello stesso regno dell\'incantesimo (+15)') + '</div>' +
          U.field('Tiro del bersaglio già fatto (vuoto = tira l\'app)', U.inp('data-t', 'sp.troll', f.troll, { type: 'number' })) +
          '<div class="row"><button data-act="sp_tr">Tira il TR del bersaglio</button></div>';
        if (f.tr) {
          var t = f.tr;
          h += '<div class="res">Livelli: attacco ' + t.a + ', bersaglio ' + t.t + ' → serve almeno <b>' + t.need + '</b> (TRR).<div>Tiro ' + t.roll + ' + bonus ' + R.fmt(t.bonus) + ' + modificatore ' + R.fmt(t.mod) + (t.misc ? ' ' + R.fmt(t.misc) : '') + ' = <b class="big">' + t.total + '</b></div>' +
            '<div class="' + (t.ok ? 'hit' : 'warn') + '">' + (t.ok ? 'Il bersaglio <b>resiste</b>.' : 'Il bersaglio <b>non resiste</b>: l\'incantesimo ha effetto.') + '</div></div>';
        }
      }
    }
    return h + '</section>';
  }

  function iniHtml() {
    var f = ini(), c = S.cur();
    var h = '<section class="card"><h2>Tiro iniziativa</h2><p class="hint">1d100 + 2 × bonus alle Manovre in Movimento + modificatori; a parità si agisce in contemporanea. Il tiro si ripete solo se cambiano le condizioni.</p>' +
      '<div class="grid g2">' + U.field('Manovre in movimento dalla scheda', U.sel('data-t', 'ini.skill', f.skill, skillOpts(c, ['mov']), { re: 1 })) +
      (f.skill === '' ? U.field('Bonus Manovre in Movimento a mano', U.inp('data-t', 'ini.bmm', f.bmm, { type: 'number' })) : '') +
      U.field('Varie', U.inp('data-t', 'ini.misc', f.misc, { type: 'number' })) +
      U.field('Tiro già fatto (vuoto = tira l\'app)', U.inp('data-t', 'ini.roll', f.roll, { type: 'number' })) + '</div><div class="mods">' +
      U.check('data-tc', 'ini.surprised', f.surprised, 'Sorpreso (−20)') + U.check('data-tc', 'ini.hurt', f.hurt, 'Ha perso più del 50% dei PF (−20)') +
      U.check('data-tc', 'ini.poleFar', f.poleFar, 'Arma ad asta, nemico a più di 3 m (+25, di solito solo il primo turno)') +
      U.check('data-tc', 'ini.poleNear', f.poleNear, 'Arma ad asta, nemico a meno di 3 m (−10)') + U.check('data-tc', 'ini.twoHands', f.twoHands, 'Arma a due mani (−5)') + '</div>' +
      '<p class="hint">Il bonus alle Manovre in Movimento raddoppia anche se negativo. Le armi hanno talvolta un modificatore all\'iniziativa nelle note (Scheda → Armi, catalogo): inseriscilo in «Varie».</p>' +
      '<div class="row"><button data-act="ini_roll">Tira l\'iniziativa</button></div>';
    if (f.res) h += '<div class="res">Tiro <b>' + f.res.roll + '</b> + 2 × ' + R.fmt(f.res.bmm) + ' + modificatori = <b class="big">' + f.res.total + '</b></div>';
    return h + '</section>';
  }

  function tfiHtml() {
    var f = tf(), cl = f.clvl !== '' ? f.clvl : S.cur().livello, cls = cl !== '' && cl != null && f.slvl !== '' ? M.spellClass(cl, f.slvl) : null;
    var h = '<section class="card"><h2>Incantesimo inoffensivo (TFI)</h2><p class="hint">Per gli incantesimi di tipo E, U e I senza TR: tiro aperto di 1d100, riesce se il risultato supera la percentuale di fallimento (minimo 02%). ' +
      'Classe III: tempo normale; classe II: considerato già preparato da 1 round; classe I: da 2 round. Indica tu i round di preparazione che contano: il compendio non dice se i round già «gratis» della classe si sommano a quelli che dedichi, e l\'app non lo decide per te.</p>' +
      '<div class="grid g3">' + U.field('Livello del personaggio', U.inp('data-t', 'tf.clvl', f.clvl, { type: 'number', ph: String(S.cur().livello || '') })) +
      U.field('Livello dell\'incantesimo', U.inp('data-t', 'tf.slvl', f.slvl, { type: 'number' })) +
      U.field('Round di preparazione (0, 1, 2 o più)', U.inp('data-t', 'tf.rounds', f.rounds, { type: 'number' })) + '</div>' +
      (cls ? '<p class="hint">Classe dell\'incantesimo: <b>' + cls + '</b>.</p>' : '') + U.check('data-tc', 'tf.instant', f.instant, 'Incantesimo istantaneo (sempre 02%)') +
      '<div class="row"><button data-act="tf_roll">Tira il lancio</button></div>';
    if (f.res) h += '<div class="res">Fallimento ' + f.res.pct + '% · tiro <b>' + f.res.roll + '</b> → <b>' + (f.res.roll > f.res.pct ? 'riuscito' : 'fallito') + '</b></div>';
    return h + '</section>';
  }
  function rangeHtml() {
    var f = rg(), res = f.base !== '' && f.m !== '' ? M.range(f.base, f.m) : null;
    var h = '<section class="card"><h2>Gittata (TSC-5)</h2><div class="grid g2">' +
      U.field('Gittata base dell\'arma', U.sel('data-t', 'rg.base', f.base, [['', '(scegli)']].concat(G.combatdata.tsc5.map(function (x) { return [String(x.base), String(x.base)]; })), { re: 1 })) +
      U.field('Distanza del bersaglio (m)', U.inp('data-t', 'rg.m', f.m, { type: 'number' })) + '</div>' +
      '<div class="row"><button class="ghost" data-act="rg_calc">Calcola la penalità</button></div>';
    if (f.shown && res) h += '<div class="res">' + (res.pen === null ? '<b>Oltre la gittata massima.</b>' : 'Fascia <b>' + ['corta', 'media', 'lunga', 'massima'][res.band] + '</b>: penalità al BO <b>' + R.fmt(res.pen) + '</b> (si inserisce in «Altri modificatori»).') + '</div>';
    return h + '<p class="hint">La gittata base delle armi da lancio sale di 1 ogni +5 del bonus in Forza: aggiungila tu alla base. Ai limiti tra due fasce la tabella indica lo stesso numero in entrambe: l\'app usa la fascia più vicina.</p></section>';
  }

  function num(v) { return v === '' || v == null ? 0 : (+v || 0); }

  G.acts.sp_cast = function () {
    var f = sp(), c = S.cur(), st = S.get(), cx = R.ctx(st.settings);
    var bo = f.skill !== '' ? R.skillTotal(c, +f.skill, cx) : num(f.bo);
    var r = f.roll !== '' ? { first: num(f.roll), total: num(f.roll), rolls: [num(f.roll)], dir: '' } : dice.open(st.settings.dice);
    var mods = num(f.dist) + num(f.prep) + (f.half ? -10 : 0) + (f.stat ? 10 : 0) - num(f.cover) + num(f.extra);
    var total = r.total + bo + mods, out = M.ta9(r.first, total, +f.col);
    f.res = { roll: r, bo: bo, mods: mods, total: total, out: out }; f.tr = null;
    U.logLine(st.clog, 'Incantesimo base ' + total + (out.fail ? ' → FALLIMENTO' : ' → modificatore al TR ' + R.fmt(out.mod)));
    U.showRoll('Incantesimo base', 'tiro ' + r.total + ' ' + R.fmt(bo) + ' ' + R.fmt(mods), total); S.save(); render();
  };
  G.acts.sp_tr = function () {
    var f = sp(), c = S.cur(), st = S.get(); if (!f.res || f.res.out.fail) return;
    var a = Math.floor(num(f.alvl !== '' ? f.alvl : c.livello)) || 1, t = f.consent ? 1 : (Math.floor(num(f.tlvl)) || 1);
    var need = M.trr(a, t), roll = f.troll !== '' ? num(f.troll) : dice.open(st.settings.dice).total;
    var misc = (f.consent ? -50 : 0) + (f.same ? 15 : 0), bonus = num(f.trb), mod = f.res.out.mod, total = roll + bonus + mod + misc;
    f.tr = { a: a, t: t, need: need, roll: roll, bonus: bonus, mod: mod, misc: misc, total: total, ok: total >= need };
    U.logLine(st.clog, 'TR del bersaglio ' + total + ' contro ' + need + (f.tr.ok ? ': resiste' : ': non resiste'));
    U.showRoll('TR bersaglio', 'tiro ' + roll + ' ' + R.fmt(bonus) + ' ' + R.fmt(mod), total); S.save(); render();
  };
  G.acts.tf_roll = function () {
    var f = tf(), st = S.get(), c = S.cur(); f.res = null;
    var pct = M.tfi(num(f.rounds), f.instant), roll = dice.open(st.settings.dice).total;
    f.res = { pct: pct, roll: roll };
    U.logLine(st.clog, 'Incantesimo inoffensivo: ' + roll + ' contro ' + pct + '% → ' + (roll > pct ? 'riuscito' : 'fallito')); U.showRoll('Incantesimo inoffensivo', pct + '%', roll); S.save(); render();
  };
  G.acts.rg_calc = function () { rg().shown = true; render(); };
  G.acts.ini_roll = function () {
    var f = ini(), c = S.cur(), st = S.get(), cx = R.ctx(st.settings);
    var bmm = f.skill !== '' ? R.skillTotal(c, +f.skill, cx) : num(f.bmm), roll = f.roll !== '' ? num(f.roll) : dice.closed().total;
    var total = M.initiative(roll, { bmm: bmm, surprised: f.surprised, hurt: f.hurt, poleFar: f.poleFar, poleNear: f.poleNear, twoHands: f.twoHands, misc: num(f.misc) });
    f.res = { roll: roll, bmm: bmm, total: total };
    U.logLine(st.clog, 'Iniziativa ' + total); U.showRoll('Iniziativa', 'tiro ' + roll, total); S.save(); render();
  };

  G.magicpage = { html: function () { return iniHtml() + spellHtml() + tfiHtml() + rangeHtml(); } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Pagina Oggetti: equipaggiamento e prezzi (TS-4), statistiche delle armature (TSC-4), metalli e gemme, erbe, veleni e malattie (TS-5).
   Dati dal compendio (js/geardata.js); i pulsanti portano le voci nell'inventario, nelle protezioni o nell'erbario del personaggio. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var U = G.ui, S = G.store, esc = U.esc, Ge = G.gear, GD = G.geardata;
  G.acts = G.acts || {};

  function T() { return U.tmp.gear || (U.tmp.gear = { sec: 'armi', q: '', cat: '', cl: '', lim: 60, sig: '' }); }

  var SECS = [
    ['armi', 'Armi: prezzi'], ['prot', 'Protezioni: prezzi'], ['arm', 'Armature, elmi e scudi: statistiche'], ['acc', 'Accessori e oggetti'], ['borse', 'Borse e zaini'],
    ['vest', 'Indossati e vestiti'], ['vitto', 'Vitto, alloggio e servizi'], ['trasp', 'Trasporti'], ['met', 'Metalli'], ['gem', 'Gemme'], ['erbe', 'Erbe e veleni'], ['mal', 'Malattie']
  ];

  /* Tabelle di prezzi: colonne [intestazione, campo, classe] */
  var PRICE = {
    armi: { rows: function () { return GD.equip.armi; }, cols: [['Arma', 'n', 'l'], ['Costo', 'costo'], ['Peso', 'peso'], ['T.P.', 'tp']] },
    prot: { rows: function () { return GD.equip.prot; }, cols: [['Equipaggiamento', 'n', 'l'], ['Costo', 'costo'], ['Peso', 'peso'], ['T.P.', 'tp']], notes: function () { return GD.equip.prot_note; } },
    acc: { rows: function () { return GD.equip.accessori; }, cols: [['Oggetto', 'n', 'l'], ['Costo', 'costo'], ['Peso', 'peso'], ['T.P.', 'tp'], ['Note', 'note', 'l']], notes: function () { return [GD.equip.oggetti_note]; } },
    borse: { rows: function () { return GD.equip.borse; }, cols: [['Oggetto', 'n', 'l'], ['Costo', 'costo'], ['Peso', 'peso'], ['T.P.', 'tp'], ['Note', 'note', 'l']], notes: function () { return [GD.equip.oggetti_note]; } },
    vest: { rows: function () { return GD.equip.vestiti; }, cols: [['Oggetto', 'n', 'l'], ['Costo', 'costo'], ['Peso*', 'peso'], ['T.P.', 'tp'], ['Note', 'note', 'l']], notes: function () { return [GD.equip.oggetti_note, '*Il peso viene considerato come carico solo quando l’oggetto è trasportato, non quando è indossato']; } },
    vitto: { rows: function () { return GD.equip.vitto; }, cols: [['Merce o servizio', 'n', 'l'], ['Costo', 'costo'], ['Note', 'note', 'l']], notes: function () { return GD.equip.vitto_note; } },
    trasp: { rows: function () { return GD.equip.trasporti; }, cols: [['Mezzo di trasporto', 'n', 'l'], ['Costo', 'costo'], ['Velocità di viaggio', 'vel'], ['Capacità', 'cap'], ['Bonus Cavalcare*', 'cav']], notes: function () { return GD.equip.trasporti_note; } }
  };

  function table(head, rows) {
    return '<div class="scroll"><table class="sk"><thead><tr>' + head.map(function (h) { return '<th' + (h[1] ? ' class="l"' : '') + '>' + esc(h[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function td(v, l) { return '<td' + (l ? ' class="l"' : '') + '>' + esc(v) + '</td>'; }
  function notes(arr) { return arr.map(function (n) { return '<p class="hint">' + esc(n) + '</p>'; }).join(''); }
  function more(t, total, shown) {
    return total > shown ? '<p class="hint">Mostrate ' + shown + ' voci su ' + total + '. <button class="mini" data-act="gear_more">Mostra altre</button></p>' : '';
  }

  function priceSec(k) {
    var t = T(), P = PRICE[k], res = Ge.filter(P.rows(), t.q), shown = res.slice(0, t.lim);
    var head = P.cols.map(function (c) { return [c[0], c[2]]; }).concat([['', '']]);
    var rows = shown.map(function (x) {
      return '<tr>' + P.cols.map(function (c) { return td(x.r[c[1]], c[2]); }).join('') + '<td><button class="mini" data-act="gear_inv" data-k="' + k + '" data-i="' + x.i + '" aria-label="Aggiungi ' + esc(x.r.n) + ' all\'inventario">+ Inv.</button></td></tr>';
    });
    return (res.length ? table(head, rows) : '<p class="hint">Nessuna voce trovata.</p>') + more(t, res.length, shown.length) + (P.notes ? notes(P.notes()) : '');
  }

  /* ---- armature ---- */
  function wearBtn(kind, sec, i, name) {
    return '<td><button class="mini" data-act="gear_wear" data-kind="' + kind + '" data-sec="' + sec + '" data-i="' + i + '" aria-label="Indossa ' + esc(name) + '">Indossa</button></td>';
  }
  function armSec() {
    var t = T(), q = (t.q || '').toLowerCase().trim(), A = GD.armature, h = '', any = false;
    var ok = function (r) { return !q || Ge.hay(r).indexOf(q) >= 0; };
    A.body.forEach(function (sec) {
      var rows = [];
      sec.rows.forEach(function (r, i) {
        if (ok(r)) rows.push('<tr>' + td(r.n, 1) + td(r.mm) + td(r.bom) + td(r.bot) + td(r.d, 1) + td(r.res) + td(r.bd) + wearBtn('body', sec.id, i, r.n) + '</tr>');
      });
      if (!rows.length) return;
      any = true;
      h += '<h3>' + esc(sec.n) + '</h3>' + table([['Armatura', 1], ['MM', 0], ['BO-M', 0], ['BO-T', 0], ['Descrizione', 1], ['Res', 0], ['BD', 0], ['', 0]], rows) + (sec.id === 'NA' ? notes([A.note.NA]) : '');
    });
    var er = [];
    A.elmi.forEach(function (r, i) { if (ok(r)) er.push('<tr>' + td(r.n, 1) + td(r.prc) + td(r.d, 1) + td(r.res) + td(r.bdi) + wearBtn('elmo', 'elmi', i, r.n) + '</tr>'); });
    if (er.length) { any = true; h += '<h3>Elmi e copricapi</h3>' + table([['Elmo', 1], ['PRC', 0], ['Descrizione', 1], ['Res', 0], ['BD-I', 0], ['', 0]], er) + notes([A.note.elmi]); }
    if (!q || /bracciali|schinieri|avambraccia|gambe|cuoio|metallo/.test(q)) { any = true; h += '<h3>' + esc(A.bracciali.titolo) + '</h3>' + notes(A.bracciali.righe); }
    var sr = [];
    A.scudi.forEach(function (r, i) { if (ok(r)) sr.push('<tr>' + td(r.n, 1) + td(r.bdm) + td(r.bdt) + td(r.bdi) + td(r.d, 1) + td(r.res) + wearBtn('scudo', 'scudi', i, r.n) + '</tr>'); });
    if (sr.length) { any = true; h += '<h3>Scudi</h3>' + table([['Scudo', 1], ['BD-M', 0], ['BD-T', 0], ['BD-I', 0], ['Descrizione', 1], ['Res', 0], ['', 0]], sr); }
    if (!any) return '<p class="hint">Nessuna voce trovata.</p>';
    return h + notes([A.legenda]);
  }

  /* ---- metalli e gemme ---- */
  function metSec() {
    var t = T(), M = GD.metalli, res = Ge.filter(M.metalli, t.q);
    var h = res.length ? table([['Metallo', 1], ['Bonus', 0], ['Valore', 0], ['Costo di lavorazione', 0], ['Tempo (ore)', 0], ['Note', 1]], res.map(function (x) {
      return '<tr>' + td(x.r.n, 1) + td(x.r.bonus) + td(x.r.valore) + td(x.r.lav) + td(x.r.tempo) + td(x.r.note, 1) + '</tr>';
    })) : '<p class="hint">Nessun metallo trovato.</p>';
    return h + notes(M.note_metalli) + descr();
  }
  function gemSec() {
    var t = T(), M = GD.metalli, res = Ge.filter(M.gemme, t.q);
    var h = res.length ? table([['Gemma', 1], ['Rarità - Valore', 1], ['Tipo - Colore', 1], ['Proprietà', 1]], res.map(function (x) {
      return '<tr>' + td(x.r.n, 1) + td(x.r.rarita, 1) + td(x.r.tipo, 1) + td(x.r.prop, 1) + '</tr>';
    })) : '<p class="hint">Nessuna gemma trovata.</p>';
    return h + notes(M.note_gemme) + descr();
  }
  function descr() {
    var t = T(), q = (t.q || '').toLowerCase().trim(), M = GD.metalli;
    var rows = M.descr.filter(function (d) { return !q || (d.n + ' ' + d.t).toLowerCase().indexOf(q) >= 0; });
    if (!rows.length) return '';
    return '<details' + (q ? ' open' : '') + '><summary>I metalli e le gemme usati dagli artigiani elfici (' + rows.length + ')</summary>' +
      rows.map(function (d) { return '<p class="pl"><b>' + esc(d.n) + ':</b> ' + esc(d.t) + '</p>'; }).join('') + '</details>';
  }

  /* ---- erbe, veleni, malattie ---- */
  var CATSHORT = { cur: 'Curativa', var: 'Varia', vel: 'Veleno', mal: 'Malattia' };
  function herbSec() {
    var t = T(), res = Ge.herbs(t.q, t.cat, t.cl), shown = res.slice(0, t.lim);
    var h = '<div class="grid g3">' +
      U.field('Tipo', U.sel('data-t', 'gear.cat', t.cat, [['', '(tutti)']].concat(Object.keys(Ge.CAT).map(function (k) { return [k, Ge.CAT[k]]; })), { re: 1, label: 'Tipo' })) +
      U.field('Clima', U.sel('data-t', 'gear.cl', t.cl, [['', '(tutti)']].concat(GD.erbeClimi.map(function (c, i) { return [String(i), c.replace(/^Clima /, '')]; })), { re: 1, label: 'Clima' })) + '</div>';
    h += '<p class="hint">' + res.length + ' erbe, veleni ed effetti trovati. Il tipo è quello dei colori della tabella del compendio: curativa, varia/d\'utilità, veleno, malattia/effetto ambientale. Mod. d\'uso, assuefazione e prezzo: vedi sotto.</p>';
    if (res.length) {
      h += table([['Cod', 0], ['Erba', 1], ['Dif.', 0], ['Parte / uso', 0], ['Costo', 0], ['Effetti', 1], ['AF', 0], ['Lv', 0], ['', 0]], shown.map(function (x) {
        var e = x.r;
        return '<tr><td>' + e.cod + '</td><td class="l"><b>' + esc(e.n) + '</b> <span class="tag" title="' + esc(Ge.CAT[e.cat]) + '">' + CATSHORT[e.cat] + '</span><br><span class="hint">' + esc(GD.erbeClimi[e.cl].replace(/^Clima /, '')) + ' · ' + esc(GD.erbeTerreni[e.te]) + '</span></td>' +
          td(e.dif) + td(e.uso) + td(e.costo) + td(e.eff, 1) + td(e.af) + td(e.lv) + '<td><button class="mini" data-act="gear_herb" data-i="' + x.i + '" aria-label="Aggiungi ' + esc(e.n) + ' all\'erbario">+ Erbario</button></td></tr>';
      })) + more(T(), res.length, shown.length);
    } else h += '<p class="hint">Nessuna erba trovata.</p>';
    h += '<details><summary>Modalità d\'uso, prezzo, effetti, assuefazione</summary>' + GD.erbeUso.map(function (u) { return '<p class="pl"><b>' + esc(u.n) + ':</b> ' + esc(u.t) + '</p>'; }).join('') + '</details>';
    return h;
  }
  function malSec() {
    var t = T(), res = Ge.filter(GD.malattie, t.q);
    if (!res.length) return '<p class="hint">Nessuna malattia trovata.</p>';
    return table([['Cod', 0], ['Malattia', 1], ['Dif.', 0], ['Provenienza', 0], ['Luogo', 0], ['Effetti', 1], ['Lv', 0], ['Clima', 0]], res.map(function (x) {
      var d = x.r;
      return '<tr><td>' + d.cod + '</td>' + td(d.n, 1) + td(d.dif) + td(d.prov) + td(d.luogo) + td(d.eff, 1) + td(d.lv) + td(GD.malattieClimi[d.cl].replace(/^Clima /, '')) + '</tr>';
    })) + '<p class="hint">Le malattie e gli effetti ambientali non si comprano: servono al GM. Codici da 600.</p>';
  }

  /* Rapporti di cambio dalla nota della TS-6 (Tabelle dei tesori) */
  function cvText() {
    var t = T(), W = G.world, amt = t.cva === undefined ? '1' : t.cva, cc = t.cvc || 'MO';
    if (amt === '' || isNaN(+amt) || +amt < 0) return 'Scrivi una quantità.';
    return W.fromMS(W.toMS(+amt, cc)).map(function (x) { return '<b>' + W.fmtNum(x.v) + '</b> ' + x.code; }).join(' · ');
  }
  function converter() {
    var t = T(), amt = t.cva === undefined ? '1' : t.cva, cc = t.cvc || 'MO';
    return '<details><summary>Convertitore di monete</summary><div class="grid g2">' + U.field('Quantità', U.inp('data-t', 'gear.cva', amt, { type: 'number', label: 'Quantità' }).replace('<input ', '<input data-w="cv" ')) +
      U.field('Moneta', U.sel('data-t', 'gear.cvc', cc, G.worlddata.monete.map(function (m) { return [m[0], m[0] + ' · ' + m[1]]; }), { label: 'Moneta' }).replace('<select ', '<select data-w="cv" ')) + '</div>' +
      '<p class="pl" id="cvres">' + cvText() + '</p>' +
      '<p class="hint">MS: Moneta di Stagno (1) · MR: Rame (10) · MB: Bronzo (100) · MA: Argento (1.000) · MO: Oro (10.000) · MM: Mithril (1.000.000), dalla nota della TS-6.</p></details>';
  }

  function render() {
    var t = T(), sig = [t.sec, t.q, t.cat, t.cl].join('|');
    if (sig !== t.sig) { t.sig = sig; t.lim = 60; }
    var body = PRICE[t.sec] ? priceSec(t.sec) : t.sec === 'arm' ? armSec() : t.sec === 'met' ? metSec() : t.sec === 'gem' ? gemSec() : t.sec === 'erbe' ? herbSec() : malSec();
    return '<section class="card"><h2>Oggetti</h2><p class="hint">Equipaggiamento e prezzi, armature, metalli e gemme, erbe, veleni e malattie del compendio Istaro Quettar. Con «+ Inv.» la voce va nell\'inventario della Scheda, con «Indossa» nelle Protezioni, con «+ Erbario» nell\'erbario. ' +
      'Le monete sono quelle del compendio (nella tabella dei tesori TS-6: MS=1, MR=10, MB=100, MA=1.000, MO=10.000, MM=1.000.000): in fondo trovi il convertitore.</p>' +
      '<div class="grid g2">' + U.field('Sezione', U.sel('data-t', 'gear.sec', t.sec, SECS, { re: 1, label: 'Sezione' })) +
      U.field('Cerca', '<input type="search" data-t="gear.q" data-re="1" value="' + esc(t.q) + '" placeholder="es. spada, cotta, athelas, cura">') + '</div>' +
      '<p class="hint">Scrivi e premi Invio per cercare.</p>' + body + converter() + '</section>';
  }

  /* ---- azioni ---- */
  function addInv(c, name, note) {
    var hit = null;
    c.inv.forEach(function (x) { if (!hit && x.n === name && /^\d+$/.test(String(x.q))) hit = x; });
    if (hit) hit.q = String(+hit.q + 1); else c.inv.push({ n: name, q: '1', note: note });
  }
  G.acts.gear_inv = function (b) {
    var k = b.dataset.k, P = PRICE[k], r = P && P.rows()[+b.dataset.i], c = S.cur(); if (!r) return;
    var parts = k === 'vitto' ? [r.costo, r.note] : k === 'trasp' ? [r.costo, r.vel, r.cap] : ['Costo ' + r.costo, r.peso && 'Peso ' + r.peso, r.tp && r.tp !== '-' && 'T.P. ' + r.tp, r.note];
    addInv(c, r.n, Ge.invNote(parts)); S.save(); U.toast('«' + r.n + '» aggiunto all\'inventario.');
  };
  G.acts.gear_wear = function (b) {
    var A = GD.armature, kind = b.dataset.kind, i = +b.dataset.i, c = S.cur(), r, sec = null;
    if (kind === 'body') { A.body.forEach(function (s) { if (s.id === b.dataset.sec) sec = s; }); r = sec && sec.rows[i]; } else r = (kind === 'elmo' ? A.elmi : A.scudi)[i];
    if (!r) return;
    var name = Ge.wornName(kind, sec, r), slot = kind === 'body' ? 'armatura' : kind === 'elmo' ? 'elmo' : 'scudo';
    c.prot[slot] = name; S.save(); U.toast('«' + name + '» indossato: lo trovi in Protezioni, nella Scheda.');
  };
  G.acts.gear_herb = function (b) {
    var h = GD.erbe[+b.dataset.i], c = S.cur(); if (!h) return;
    var hit = null; c.erbario.forEach(function (x) { if (!hit && String(x.cod) === String(h.cod) && /^\d+$/.test(String(x.q))) hit = x; });
    if (hit) hit.q = String(+hit.q + 1); else c.erbario.push({ n: h.n, uso: h.uso, cod: String(h.cod), q: '1', note: h.eff });
    S.save(); U.toast('«' + h.n + '» nell\'erbario.');
  };
  G.acts.gear_more = function () { T().lim += 60; G.app.render(); };

  if (typeof document !== 'undefined') {
    var cvUpd = function (e) {
      var t = e.target;
      if (!t || !t.getAttribute || t.getAttribute('data-w') !== 'cv') return;
      setTimeout(function () { var el = document.getElementById('cvres'); if (el) el.innerHTML = cvText(); }, 0);
    };
    document.addEventListener('input', cvUpd); document.addEventListener('change', cvUpd);
  }

  G.pages.gear = { render: render };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Pagina Mondo: esperienza, manovre in movimento e statiche, meteo, incontri, rischio degli incantesimi, tesori, prezzi magici,
   animali e mostri, Mutaforma. Dati dal compendio (js/worlddata.js); logica in js/world.js. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var R = G.rules, U = G.ui, S = G.store, Wd = G.worlddata, Wr = G.world, dice = G.dice.dice, esc = U.esc;
  G.acts = G.acts || {};

  var SECS = [['xp', 'Punti Esperienza (TE)'], ['mov', 'Manovre in movimento (TM-1)'], ['stat', 'Manovre statiche (TM-2)'], ['meteo', 'Meteo (TS-8)'], ['inc', 'Incontri (TS-10)'],
    ['ris', 'Rischio incantesimi (TS-12)'], ['clima', 'Freddo e caldo (TRR-2)'], ['liste', 'Liste di incantesimi: Pirocinesi, Potenziamento Corporeo'], ['tes', 'Tesori (TS-6)'], ['mag', 'Prezzi oggetti magici (TS-7)'], ['anim', 'Animali e mostri (TS-2)'], ['muta', 'Mutaforma']];

  function T() {
    var t = U.tmp.world;
    if (!t) {
      t = U.tmp.world = { sec: 'xp', q: '', grp: '',
        xp: { kind: 'kill', en: '', pc: '', size: 'N', done: '', mult: '1', cm: '1', A: '', B: '', C: '', D: '', E: '', lvdiff: '0', sit: '1', pf: '', diff: '0', km: '', zone: '1', risen: '' },
        mov: { diff: '2', bonus: '', roll: '', stord: false, terra: false, arto: false, res: null },
        stat: { col: '0', diff: '0', bonus: '', extra: '', roll: '', res: null },
        meteo: { mese: '0', pc: '2', tc: '2', res: null },
        inc: { dens: '1', ter: '', abit: '', xa: '', dim: '', modo: '', gen: '', xe: '', ra: '', re: '', res: null },
        ris: { tipo: '6', per: '2', area: '1', r1: '', r2: '', x2: '', res: null },
        clima: { kind: 'freddo', tr: '', temp: '', ind: '', alt: {}, x: '', min: '', max: '', roll: '', res: null },
        liste: { l: '0' },
        tes: { w: '2', res: null } };
    }
    return t;
  }
  function num(v) { return v === '' || v == null || isNaN(+v) ? 0 : +v; }
  function sg(n) { return (n > 0 ? '+' : n < 0 ? '−' : '') + Math.abs(n); }
  function meseName(x) { return (x.match(/\(/g) || []).length > (x.match(/\)/g) || []).length ? x + ')' : x; }
  function opts(arr, fn) { return arr.map(function (x, i) { return [String(i), fn ? fn(x, i) : x]; }); }

  function table(head, rows) {
    return '<div class="scroll"><table class="sk"><thead><tr>' + head.map(function (h) { return '<th' + (h[1] ? ' class="l"' : '') + '>' + esc(h[0]) + '</th>'; }).join('') + '</tr></thead><tbody>' + rows.join('') + '</tbody></table></div>';
  }
  function td(v, l) { return '<td' + (l ? ' class="l"' : '') + '>' + esc(v) + '</td>'; }
  function notes(arr) { return arr.map(function (n) { return '<p class="hint">' + esc(n) + '</p>'; }).join(''); }
  function paras(arr) { return arr.map(function (n) { return '<p class="pl">' + esc(n) + '</p>'; }).join(''); }
  /* Campo numerico; con re='xp' il risultato del calcolatore si aggiorna mentre scrivi, senza ridisegnare la pagina (così il campo non perde il fuoco). */
  function fld(label, path, val, o, re) {
    o = o || { type: 'number' };
    var html = U.inp('data-t', path, val, o);
    if (re) html = html.replace('<input ', '<input data-w="' + re + '" ');
    return U.field(label, html);
  }
  function selF(label, path, val, list) { return U.field(label, U.sel('data-t', path, val, list, { re: 1, label: label })); }
  function det(title, body, open) { return '<details' + (open ? ' open' : '') + '><summary>' + esc(title) + '</summary>' + body + '</details>'; }
  function openRoll() { return dice.open(S.get().settings.dice); }
  function out(html) { return '<div class="pl res">' + html + '</div>'; }

  /* ================= Esperienza ================= */
  function xpCompute() {
    var t = T(), x = t.xp, c = S.cur(), X = Wd.xp, pc = x.pc !== '' ? num(x.pc) : (c.livello !== '' ? num(c.livello) : 1);
    var mult = [['1', 'Normale (x1)'], ['5', 'Prima volta (x5)'], ['2', 'Seconda volta (x2)'], ['0.5', 'Routine (x0,5)']];
    var kinds = [['kill', 'Nemico sconfitto (TE-1)'], ['critinf', 'Colpi critici inflitti (TE-3)'], ['critsub', 'Colpi critici subiti (TE-3)'], ['pf', 'Punti Ferita subiti'], ['morte', 'Ferita mortale (Punti Morte)'],
      ['spell', 'Incantesimo lanciato (TE-2)'], ['man', 'Manovra riuscita (TE-4)'], ['via', 'Viaggio (TE-6)']];
    var f = '', base = 0, expl = '';
    var crits = function () { return fld('Critici A', 'world.xp.A', x.A, null, 'xp') + fld('Critici B', 'world.xp.B', x.B, null, 'xp') + fld('Critici C', 'world.xp.C', x.C, null, 'xp') + fld('Critici D', 'world.xp.D', x.D, null, 'xp') + fld('Critici E', 'world.xp.E', x.E, null, 'xp'); };
    var cnt = { A: x.A, B: x.B, C: x.C, D: x.D, E: x.E };
    var size = selF('Dimensioni del nemico', 'world.xp.size', x.size, [['N', 'Normale'], ['G', 'Grande (x1,5)'], ['E', 'Enorme (x3)']]);
    var cm = selF('Moltiplicatore dei critici', 'world.xp.cm', x.cm, [['1', 'x1'], ['0', 'Nemico morente (x0)'], ['0.5', 'Stordito (x0,5)'], ['0.1', 'Svenuto o incapacitato (x0,1)'], ['2', 'Da solo contro più nemici (x2)']]);
    if (x.kind === 'kill') {
      base = Wr.peKill(num(x.en), pc, x.size); var done = Math.min(base, num(x.done)); base -= done;
      f = fld('Livello del nemico', 'world.xp.en', x.en, null, 'xp') + fld('Livello del personaggio (colpo decisivo)', 'world.xp.pc', x.pc, { type: 'number', ph: String(pc) }, 'xp') + size + fld('PE già dati per i suoi critici', 'world.xp.done', x.done, null, 'xp');
      expl = 'PU di TE-1 ' + Wr.peKill(num(x.en), pc, x.size) + (done ? ' − ' + done + ' già assegnati' : '');
    } else if (x.kind === 'critinf') {
      var cap = Wr.peKill(num(x.en), pc, x.size), raw = Wr.peCritInflitti(cnt, num(x.en)) * num(x.cm);
      base = Math.min(raw, cap);
      f = fld('Livello del nemico', 'world.xp.en', x.en, null, 'xp') + fld('Livello del personaggio', 'world.xp.pc', x.pc, { type: 'number', ph: String(pc) }, 'xp') + size + cm + crits();
      expl = 'Critici ' + raw + ' (tetto: PU del nemico ' + cap + ')';
    } else if (x.kind === 'critsub') {
      base = Wr.peCritSubiti(cnt) * num(x.cm); f = cm + crits(); expl = '100/200/300/400/500 per A/B/C/D/E';
    } else if (x.kind === 'pf') {
      base = Math.max(0, num(x.pf)); f = fld('PF subiti nel combattimento', 'world.xp.pf', x.pf, null, 'xp'); expl = '1 PE per PF subito';
    } else if (x.kind === 'morte') {
      base = Wr.peKillBase(pc, 1) * (x.risen ? 2 : 1);
      f = fld('Livello del personaggio', 'world.xp.pc', x.pc, { type: 'number', ph: String(pc) }, 'xp') + '<label class="chk"><input type="checkbox" data-t="world.xp.risen" data-re="1"' + (x.risen ? ' checked' : '') + '> Poi riportato in vita (x2)</label>';
      expl = 'Come un personaggio di livello 1 che uccide un nemico del livello ' + pc + (x.risen ? ', raddoppiato' : '');
    } else if (x.kind === 'spell') {
      base = Wr.peSpell(num(x.lvdiff));
      f = fld('Livello del personaggio − livello dell\'incantesimo', 'world.xp.lvdiff', x.lvdiff, { type: 'number', ph: '0 = stesso livello' }, 'xp') +
        selF('Situazione', 'world.xp.sit', x.sit, [['0.5', 'In assenza di pericolo (x0,5)'], ['1', 'In combattimento (x1)'], ['2', 'In estremo pericolo (x2)'], ['3', 'In estremo pericolo (x3)'], ['5', 'Nemico sconfitto con l\'incantesimo (x5)']]);
      base = base * num(x.sit); expl = 'TE-2: ' + Wr.peSpell(num(x.lvdiff)) + ' x ' + x.sit + ' (il compendio dà «x2/x3» per l\'estremo pericolo: scegli tu)';
    } else if (x.kind === 'man') {
      base = Wd.xp.te4[num(x.diff)][1]; f = selF('Difficoltà della manovra', 'world.xp.diff', x.diff, opts(Wd.xp.te4, function (r) { return r[0] + ' (' + r[1] + ')'; })); expl = 'TE-4';
    } else {
      base = num(x.km) / 2 * num(x.zone); f = fld('Chilometri percorsi (a piedi o a cavallo)', 'world.xp.km', x.km, null, 'xp') +
        selF('Zona', 'world.xp.zone', x.zone, [['0.5', 'Civilizzata (x0,5)'], ['1', 'Normale (x1)'], ['2', 'Pericolosa (x2)'], ['3', 'Molto pericolosa (x3)']]);
      expl = '1 PE ogni 2 km (per volo o mare: 1 PE ogni 20 km, dividi i km per 10)';
    }
    return { f: f, tot: Math.round(base * num(x.mult)), expl: expl, mult: x.mult, kinds: kinds, multList: mult, c: c };
  }
  function xpResult(r) {
    return '<b>' + r.tot + ' PE</b> <span class="hint">' + esc(r.expl) + ' · moltiplicatore TE-0 x' + esc(String(r.mult)) + ' · arrotondato</span>';
  }
  function xpCalc() {
    var x = T().xp, r = xpCompute();
    return '<h3>Calcolatore</h3><div class="grid g2">' + selF('Che cosa dà PE', 'world.xp.kind', x.kind, r.kinds) + selF('Familiarità (TE-0)', 'world.xp.mult', x.mult, r.multList) + '</div>' +
      '<div class="grid g3">' + r.f + '</div><div class="pl res" id="xpres">' + xpResult(r) + '</div>' +
      '<p><button data-act="world_xp" id="xpadd">Aggiungi ' + r.tot + ' PE a ' + esc(r.c.name || 'questo personaggio') + '</button></p>' +
      '<p class="hint">Il calcolatore applica le tabelle una voce alla volta; sommare i PE di un combattimento e decidere i casi dubbi spetta al GM. Livello e PE correnti sono nella Scheda.</p>';
  }
  function xpSec() {
    var X = Wd.xp, h = xpCalc();
    h += det('TE-0 · Moltiplicatore', paras(X.te0t) + table([['Frequenza', 1], ['Moltiplicatore', 0]], X.te0.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })));
    var hd = [['Liv. nemico', 1]]; for (var i = 1; i <= 10; i++) hd.push([String(i), 0]); hd.push(['11+', 0]);
    h += det('TE-1 · Punti Uccisione', paras(X.te1t) + '<p class="hint">Colonne: livello del personaggio che infligge il colpo decisivo.</p>' +
      table(hd, X.te1.map(function (r, i) { return '<tr>' + td(i, 1) + r.map(function (v) { return td(v); }).join('') + '</tr>'; })) + notes(X.te1n) +
      '<p class="hint">Nella colonna 11+ i livelli 8, 9 e 10 riportano 130, 150 e 200 come nel PDF (lo schema degli altri valori darebbe 110, 130, 150): la riga 11+ del compendio vale comunque con la formula della nota *.</p>');
    h += det('TE-2 · Punti Incantesimo', paras(X.te2t) + table([['Livello Incantesimo', 1], ['PE', 0]], X.te2.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })) +
      '<h3>Moltiplicatori</h3>' + table([['Situazione', 1], ['', 0]], X.te2m.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })));
    h += det('TE-3 · Punti Colpi Critici, Punti Ferita, Punti Morte', paras(X.te3t) + table([['Critico', 1], ['Inflitti', 1], ['Subiti', 0]], X.te3.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1], 1) + td(r[2]) + '</tr>'; })) + notes(X.te3n) +
      '<h3>Moltiplicatori</h3>' + table([['Situazione', 1], ['', 0]], X.te3m.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })) +
      '<h3>Punti Ferita</h3><p class="pl">' + esc(X.pf) + '</p><h3>Punti Morte</h3>' + paras(X.morte));
    h += det('TE-4 · Manovre', '<p class="pl">' + esc(X.te4t) + '</p>' + table([['Difficoltà', 1], ['PE', 0]], X.te4.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })));
    h += det('TE-6 · Punti Viaggio', table([['Viaggio', 1], ['PE', 0]], X.te6.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })) +
      '<h3>Moltiplicatori</h3>' + table([['Zona', 1], ['', 0]], X.te6m.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })));
    h += det('TE-7 · Punti Vari', '<p class="pl">' + esc(X.te7t) + '</p>' + table([['Voce', 1], ['PE', 0]], X.te7.map(function (r) { return '<tr><td class="l"><b>' + esc(r[0]) + '</b><br>' + esc(r[1]) + '</td>' + td(r[2]) + '</tr>'; })));
    h += det('Punti Esperienza Semplificati', '<p class="pl">' + esc(X.semplt) + '</p>' + table([['Voce', 1], ['PE', 0]], X.sempl.map(function (r) { return '<tr>' + td(r[0], 1) + td(r[1]) + '</tr>'; })));
    h += '<p class="hint">La tabella TE-5 (PE necessari per livello) è già nell\'app: la usa il campo Livello della Scheda.</p>';
    return h;
  }

  /* ================= Manovre in movimento ================= */
  function movSec() {
    var t = T(), m = t.mov, M = Wd.mov, h = paras(M.intro);
    h += '<h3>Tira una manovra</h3><div class="grid g3">' + selF('Difficoltà', 'world.mov.diff', m.diff, opts(M.diff)) + fld('Bonus di Movimento e Manovra (o dell\'abilità)', 'world.mov.bonus', m.bonus) +

    var wl = [['', '(nessuna: scelgo a mano)']].concat(c.weapons.map(function (w, i) { return [String(i), w.n || 'Arma ' + (i + 1)]; }));
    var h = '<section class="card"><h2>Attacco</h2><div class="grid g2">' +
      (c.weapons.length ? U.field('Arma', U.sel('data-act-change', 'weapon', f.weapon, wl)) : '') +
      U.field('Tabella di attacco', U.sel('data-t', 'cb.atk', f.atk, tables, { re: 1 })) +
      (t ? U.field('Armatura del bersaglio', U.sel('data-t', 'cb.armor', f.armor, armors)) : '') +
      (t && t.limits && t.limits.length ? U.field(t.id === 'TA-7' ? 'Tipo di dardo' : 'Taglia dell\'attacco', U.sel('data-t', 'cb.limit', f.limit, [['', '(scegli)']].concat(t.limits.map(function (l) { return [l.label, l.label]; })))) : '') +
      (t && t.fumble == null ? U.field('Colpo maldestro: tiro massimo (si imposta in Scheda → Armi)', U.inp('data-t', 'cb.fumble', f.fumble, { type: 'number', ph: 'es. 4' })) : '') +
      U.field('BO dalla scheda', U.sel('data-t', 'cb.skill', f.skill, [['', '(a mano)']].concat(skills), { re: 1 })) +
      (f.skill === '' ? U.field('BO a mano', U.inp('data-t', 'cb.bo', f.bo, { type: 'number' })) : '') +
      U.field('BD del bersaglio', U.inp('data-t', 'cb.bd', f.bd, { type: 'number' })) +
      U.field('Altri modificatori', U.inp('data-t', 'cb.extra', f.extra, { type: 'number' })) +
      U.field('Tiro già fatto (vuoto = tira l\'app)', U.inp('data-t', 'cb.roll', f.roll, { type: 'number' })) + '</div><div class="mods">' +
      D.ATK_MODS.map(function (m) { return U.check('data-tc', 'cb.mods.' + m.id, f.mods[m.id], m.label + ' (' + R.fmt(m.v) + ')'); }).join('') + '</div>' +
      '<p class="hint">I bonus «fianco», «da dietro», «sorpresa», «stordito», «atterrato», «prono» non valgono con armi da tiro o da lancio. Tra stordito, atterrato e prono si applica uno solo (il più alto). Gli altri modificatori sono cumulativi.</p>' +
      '<div class="row"><button class="big" data-act="attack">Tira l\'attacco</button><button class="ghost" data-act="mybd">Usa il mio BD come BD</button></div>';
    if (f.res) h += resultHtml(f, f.res, st);
    return h + '</section>';
  }

  function fumbleBlock(f, res, st) {
    var ids = critList(st).filter(function (x) { return /^TTM-/.test(x.id) || x.type === 'crit' && !/^TCM?-/.test(x.id); });
    var def = f.ft || (res.table && FUMBLE_DEFAULT[res.table.id]) || '';
    var h = '<div class="warn"><b>' + (res.table && /^TA-[78]$/.test(res.table.id) ? 'Fallimento dell\'incantesimo' : res.table && /^TA-[56]$/.test(res.table.id) ? 'Attacco fallito' : 'Colpo maldestro') +
      '</b>: il tiro non modificato (' + res.roll.first + ') è ≤ ' + res.fumbleMax + '.';
    if (ids.length && !(res.table && /^TA-[56]$/.test(res.table.id))) {
      h += '<div class="row">' + U.field('Tabella dei fallimenti', U.sel('data-t', 'cb.ft', def, ids.map(function (x) { return [x.id, x.name]; }))) +
        '<button data-act="fumbleroll">Tira il fallimento</button></div>';
    }
    h += '</div>';
    if (f.fres) h += '<div class="res">Fallimento: tiro <b>' + f.fres.raw + '</b>' + (f.fres.row ? '<div class="hit">' + esc(f.fres.row.text) + '</div>' : '') + '</div>';
    return h;
  }

  function resultHtml(f, r, st) {
    var s = '<div class="res"><div>Tiro ' + (r.roll.rolls.length > 1 ? r.roll.rolls.join(', ') + ' = ' : '') + '<b>' + r.roll.total + '</b> + BO ' + R.fmt(r.bo) + ' − BD ' + r.bd +
      (r.mods ? ' ' + R.fmt(r.mods) : '') + (r.extra ? ' ' + R.fmt(r.extra) : '') + ' = <b class="big">' + r.total + '</b></div>';
    if (r.ta) s += '<div class="hint">Modificatore dell\'arma sulla tabella: <b>' + R.fmt(r.ta) + '</b> (' + ARMOR_NAMES[+f.armor] + '), applicato dopo gli altri bonus: si legge la riga ' + (r.total + r.ta) + '.</div>';
    if (r.fumble) s += fumbleBlock(f, r, st);
    if (r.cell && !r.fumble) {
      if (r.fail) s += '<div class="warn"><b>Fallimento dell\'incantesimo</b> (cella «F»): tira sulla tabella dei fallimenti degli incantesimi (TTM-3).</div>';
      else s += '<div class="hit">' + r.cell.pf + ' PF' + (r.cell.crit ? ' · critico <b>' + r.cell.crit + '</b>' : ' · nessun critico') + '</div>';
      if (r.ti) s += '<div class="hint">Riga «TI» (tiro non modificato).</div>';
      if (r.capped) s += '<div class="hint">Risultato limitato al massimo previsto per «' + esc(f.limit) + '».</div>';
      if (r.beyond) {
        var b = G.magic && !/^TA-[78]$/.test(r.table.id) ? G.magic.beyond150(r.total + r.ta) : null;
        s += '<div class="hint">Oltre l\'ultima riga della tabella: usata l\'ultima.' + (b ? ' Regola «Oltre il 150» (a discrezione del GM): margine ' + b.margin + ', ' +
          (b.letter ? 'ulteriore colpo critico di grado <b>' + b.letter + '</b> dello stesso tipo del primario dell\'arma.' : 'nessun critico supplementare (margine fino a 30).') + '</div>' : '</div>');
      }
    } else if (r.table && f.armor === '' && !r.fumble) {
      s += '<div class="hint">Scegli l\'armatura del bersaglio per leggere la tabella.</div>';
    } else if (!r.table) {
      s += '<div class="hint">Nessuna tabella scelta: cerca il risultato <b>' + r.total + '</b> sulla tabella cartacea e inserisci PF e lettera qui sotto.</div>';
    }
    if (r.wi && (r.wi.note || r.wi.manual.length)) {
      s += '<div class="hint"><b>' + esc(r.wi.name) + '</b>: ' + esc(r.wi.note) + (r.wi.manual.length ? ' <b>Da applicare a mano:</b> ' + esc(r.wi.manual.join('; ')) : '') + '</div>';
    }
    return s + '</div>';
  }

  function critBlock(f, st, k, title) {
    var aimed = f.mods && f.mods.mira;
    var cts = [['', '(nessuna: leggo io)']].concat(critList(st).filter(function (t) { return !/^TTM-/.test(t.id); }).map(function (t) { return [t.id, t.name]; }));
    var res = f['cres' + k];
    var h = '<h3>' + title + '</h3><div class="grid g3">' +
      U.field('Lettera', U.sel('data-t', 'cb.letter' + k, f['letter' + k], LETTERS.map(function (x) { return [x, x || '–']; }))) +
      U.field('Tabella critici', U.sel('data-t', 'cb.ct' + k, f['ct' + k], cts)) +
      U.field('Tiro già fatto (1–100)', U.inp('data-t', 'cb.croll' + k, f['croll' + k], { type: 'number' })) + '</div>' +
      (aimed ? '<p class="hint">Con la mira (−30) il critico si legge sulle tabelle TCM-1…4 (gambe, braccia, petto, testa): solo con armi da tiro o da lancio che fanno critici da punta.</p>' : '') +
      '<div class="row"><button data-act="crit" data-k="' + k + '" ' + (f['letter' + k] ? '' : 'disabled') + '>Tira il critico</button></div>';
    if (res) {
      h += '<div class="res">Tiro ' + res.raw + ' ' + R.fmt(res.mod) + ' (lettera ' + res.letter + ') = <b class="big">' + res.total + '</b>' +
        (res.row ? '<div class="hit">' + esc(res.row.text) + '</div>' : '<div class="hint">Cerca ' + res.total + ' sulla tabella dei critici.</div>') + '</div>';
    }
    return h;
  }

  function critHtml(f, st) {
    var h = '<section class="card"><h2>Danno e colpo critico</h2><div class="grid g3">' +
      U.field('PF inflitti', U.inp('data-t', 'cb.pf', f.pf, { type: 'number' })) + '</div>' +
      '<div class="row"><button data-act="dmgenemy">PF all\'avversario</button><button data-act="dmgme">PF a me</button></div>' +
      critBlock(f, st, '', 'Critico primario');
    if (f.letter2 || f.ct2 || f.cres2) h += critBlock(f, st, '2', 'Critico secondario');
    return h + '</section>';
  }

  function enemies(f, st) {
    var h = '<section class="card"><h2>Avversari</h2>';
    if (!st.enemies.length) h += '<p class="hint">Nessun avversario.</p>';
    st.enemies.forEach(function (e, i) {
      var cur = R.num(e.max) - R.num(e.dmg);
      h += '<div class="li en' + (cur <= 0 && e.max !== '' ? ' dead' : '') + '"><label class="rad"><input type="radio" name="tg" data-act="target" data-i="' + i + '"' + (f.target === e.id ? ' checked' : '') + '> ' +
        U.inp('data-p-en', i + '.n', e.n, { cls: 'wide', label: 'Nome avversario' }) + '</label><span class="pfb">' + (e.max === '' ? 'PF ?' : cur + '/' + e.max) + '</span>' +
        '<button class="mini" data-act="enhit" data-i="' + i + '" data-n="1">−1</button><button class="mini" data-act="enhit" data-i="' + i + '" data-n="5">−5</button>' +
        '<button class="mini" data-act="enhit" data-i="' + i + '" data-n="-5">+5</button><button class="mini" data-act="del" data-list="enemies" data-i="' + i + '">✕</button></div>';
    });
    return h + '<div class="row"><label>Nome' + U.inp('data-t', 'en.n', U.tmp.en && U.tmp.en.n || '') + '</label><label>PF' + U.inp('data-t', 'en.max', U.tmp.en && U.tmp.en.max || '', { type: 'number', cls: 'sm' }) +
      '</label><button data-act="enadd">+ Aggiungi</button></div></section>';
  }

  function logHtml(st) {
    return '<section class="card"><h2>Registro</h2><div class="row"><button class="ghost" data-act="clearclog">Svuota</button></div>' +
      (st.clog.length ? '<ul class="log">' + st.clog.map(function (x) { return '<li><span class="t">' + U.timeStr(x.t) + '</span> ' + esc(x.s) + '</li>'; }).join('') + '</ul>' : '<p class="hint">Vuoto.</p>') + '</section>';
  }

  function render() {
    var st = S.get(), c = S.cur(), f = cb();
    return attackHtml(f, st, c) + critHtml(f, st) + (G.magicpage ? G.magicpage.html() : '') + enemies(f, st) + logHtml(st);
  }

  G.pages.combat = { weaponInfo: weaponInfo, capLetter: capLetter, secondaryLetter: secondaryLetter, taMod: taMod, TYPE_TC: TYPE_TC, render: render, resolveAttack: resolveAttack, modsSum: modsSum, cb: cb, tableById: tableById, atkList: atkList, critList: critList };
  if (typeof module !== 'undefined') module.exports = G.pages.combat;
})(typeof window !== 'undefined' ? window : globalThis);

</script>

<script>
/* Pagina Dati: tabelle importate, impostazioni, copie di sicurezza, aiuti. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var R = G.rules, D = G.data, U = G.ui, S = G.store, esc = U.esc;

  function tablesCard(st) {
    var im = U.tmp.imp || (U.tmp.imp = { name: '', armors: '', fumble: '', text: '', cname: '', ctext: '' });
    var bd = U.bundled();
    var h = '<section class="card"><h2>Tabelle</h2><p class="hint"><b>Incluse nell\'app</b> (dal compendio): ' + bd.atk.length + ' tabelle di attacco (TA-1…TA-8, TA-10, TA-11; la TA-9 degli incantesimi base è nella pagina Combattimento), ' +
      bd.crit.filter(function (t) { return /^TC-/.test(t.id); }).length + ' tabelle dei colpi critici (TC-1…TC-13), ' + bd.crit.filter(function (t) { return /^TCM-/.test(t.id); }).length + ' dei colpi critici mirati (TCM-1…TCM-4) e ' + bd.crit.filter(function (t) { return /^TTM-/.test(t.id); }).length +
      ' dei fallimenti (TTM-1…TTM-7). Qui sotto puoi aggiungerne altre tue, incollando il testo o importando un file JSON (formato in <code>data/README.md</code>).</p>';
    h += '<h3>Tue tabelle di attacco</h3>' + (st.atk.length ? st.atk.map(function (t, i) {
      return '<div class="li"><span><b>' + esc(t.name) + '</b> · ' + t.rows.length + ' righe · ' + t.armors.length + ' colonne</span><button class="mini" data-act="del" data-list="atk" data-i="' + i + '">✕</button></div>';
    }).join('') : '<p class="hint">Nessuna.</p>');
    h += '<h3>Tue tabelle di critici</h3>' + (st.crit.length ? st.crit.map(function (t, i) {
      return '<div class="li"><span><b>' + esc(t.name) + '</b> · ' + t.rows.length + ' righe</span><button class="mini" data-act="del" data-list="crit" data-i="' + i + '">✕</button></div>';
    }).join('') : '<p class="hint">Nessuna.</p>');
    h += '<details><summary>Importa tabella di attacco</summary><div class="grid g2">' +
      U.field('Nome (es. Spada corta)', U.inp('data-t', 'imp.name', im.name)) +
      U.field('Intervallo di fallimento: massimo tiro', U.inp('data-t', 'imp.fumble', im.fumble, { type: 'number', ph: 'es. 4' })) + '</div>' +
      U.field('Nomi delle colonne di armatura, separati da virgola', U.inp('data-t', 'imp.armors', im.armors, { ph: 'es. 1,2,3,…' })) +
      U.field('Righe, una per riga: «36-40 0 0 1B 2C…»; la prima inizia con «xx-»', '<textarea data-t="imp.text" rows="8">' + esc(im.text) + '</textarea>') +
      '<button data-act="impatk">Importa attacco</button></details>';
    h += '<details><summary>Importa tabella dei critici</summary>' + U.field('Nome (es. Taglio)', U.inp('data-t', 'imp.cname', im.cname)) +
      U.field('Righe: «06-16 testo…», «80 testo…», «-(49)-05 testo…»; le righe senza intervallo continuano la precedente', '<textarea data-t="imp.ctext" rows="8">' + esc(im.ctext) + '</textarea>') +
      '<button data-act="impcrit">Importa critici</button></details>';
    return h + '</section>';
  }

  function settingsCard(st) {
    var s = st.settings, h = '<section class="card"><h2>Impostazioni di calcolo</h2>' +
      '<h3>Tiro aperto (convenzione, non scritta nel compendio)</h3><div class="grid g2">' +
      U.field('Si tira ancora se il primo tiro è almeno', U.inp('data-s', 'dice.high', s.dice.high, { type: 'number' })) +
      U.field('Si tira ancora, sottraendo, se è al più', U.inp('data-s', 'dice.low', s.dice.low, { type: 'number' })) + '</div>' +
      '<h3>Bonus gradi, progressione primaria (TB-4)</h3><div class="grid g3">' +
      U.field('0 gradi', U.inp('data-s', 'prog.zero', s.prog.zero, { type: 'number' })) +
      U.field('Gradi 1–10, per grado', U.inp('data-s', 'prog.r1', s.prog.r1, { type: 'number' })) +
      U.field('Gradi 11–20', U.inp('data-s', 'prog.r2', s.prog.r2, { type: 'number' })) +
      U.field('Gradi 21–30', U.inp('data-s', 'prog.r3', s.prog.r3, { type: 'number' })) +
      U.field('Gradi 31 e oltre', U.inp('data-s', 'prog.r4', s.prog.r4, { type: 'number' })) + '</div>' +
      '<details><summary>Tabella TB-1 (bonus alle caratteristiche)</summary><div class="scroll"><table class="sk"><thead><tr><th>Da</th><th>A</th><th>Bonus</th></tr></thead><tbody>' +
      s.tb1.map(function (r, i) {
        return '<tr><td>' + U.inp('data-s', 'tb1.' + i + '.from', r.from, { type: 'number', cls: 'sm' }) + '</td><td>' + U.inp('data-s', 'tb1.' + i + '.to', r.to, { type: 'number', cls: 'sm' }) +
          '</td><td>' + U.inp('data-s', 'tb1.' + i + '.bonus', r.bonus, { type: 'number', cls: 'sm' }) + '</td></tr>';
      }).join('') + '</tbody></table></div></details>' +
      '<div class="row"><button class="ghost" data-act="resetsettings">Ripristina i valori del compendio</button></div></section>';
    return h;
  }

  function healCard() {
    var f = U.tmp.heal || (U.tmp.heal = { roll: '', col: '1', sev: 'lieve' }), out = '';
    if (f.roll !== '') {
      var days = R.healDays(R.num(f.roll), +f.col, f.sev);
      out = '<div class="res">Guarigione: <b class="big">' + days + ' giorni</b></div>';
    }
    return '<section class="card"><h2>Guarigione (TFC-2)</h2><div class="grid g3">' +
      U.field('Tiro + bonus Costituzione', U.inp('data-t', 'heal.roll', f.roll, { type: 'number' })) +
      U.field('Tipo di ferita', U.sel('data-t', 'heal.col', f.col, D.HEAL_COLS.map(function (n, i) { return [String(i), n]; }))) +
      U.field('Gravità', U.sel('data-t', 'heal.sev', f.sev, [['lieve', 'Lieve'], ['media', 'Media (×5)'], ['grave', 'Grave (×10)']])) +
      '</div><button data-act="healroll">Tira il d100 per me</button>' + out + '</section>';
  }

  function backupCard() {
    return '<section class="card"><h2>Copia di sicurezza</h2><p class="hint">I dati stanno nel browser di questo dispositivo. Esporta ogni tanto un file: è l\'unica protezione contro la cancellazione dei dati del sito.</p>' +
      '<div class="row"><button data-act="export">Esporta tutto (JSON)</button><label class="btn ghost">Importa file<input type="file" accept=".json,application/json" data-act-file="1" hidden></label></div>' +
      '<p class="hint">Importando un backup completo, i dati attuali vengono sostituiti. Un file di tabella singola viene invece aggiunto all\'elenco.</p>' +
      '<h3>Azzeramento</h3><p class="hint"><b>Elimina tutte le schede</b> cancella i personaggi, gli avversari del Combattimento e le cronologie, e lascia un personaggio vuoto. Le tabelle importate e le impostazioni non si toccano.</p>' +
      '<div class="row"><button class="danger" data-act="wipechars">Elimina tutte le schede</button></div></section>';
  }

  function creditsCard() {
    return '<section class="card"><h2>Crediti</h2><p class="hint">Regole, tabelle e dati dal compendio <b>«Istaro Quettar»</b> di Filduin, basato su GIRSA (Gioco di Ruolo del Signore degli Anelli): ' +
      '<a href="https://www.istaroquettar.it" target="_blank" rel="noopener">www.istaroquettar.it</a>. Il compendio è per uso personale o distribuzione gratuita: questa app non è in vendita. ' +
      'GIRSA e «Il Signore degli Anelli» appartengono ai rispettivi titolari; il progetto non è affiliato a nessuno di loro.</p></section>';
  }

  function render() {
    var st = S.get();
    return tablesCard(st) + settingsCard(st) + healCard() + backupCard() + creditsCard();
  }
  G.pages.data = { render: render };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Avvio, navigazione e gestione degli eventi. */
(function (root) {
  'use strict';
  var G = root.GIRSA, R = G.rules, D = G.data, U = G.ui, S = G.store, T = G.tables, dice = G.dice.dice;
  var P = G.pages, esc = U.esc;
  var ROUTES = [['create', 'Crea'], ['develop', 'Sviluppa'], ['sheet', 'Scheda'], ['dice', 'Dadi'], ['combat', 'Combattimento'], ['gear', 'Oggetti'], ['world', 'Mondo'], ['diary', 'Diario'], ['ref', 'Guida'], ['data', 'Dati']];
  var STATE_LISTS = { enemies: 1, atk: 1, crit: 1 };

  function route() { var r = (location.hash || '').replace(/^#\/?/, ''); return P[r] ? r : 'sheet'; }
  function val(t) { return t.type === 'checkbox' ? t.checked : t.value; }

  function renderHeader() {
    var st = S.get(), c = S.cur();
    document.getElementById('charsel').innerHTML = st.chars.map(function (x) {
      return '<option value="' + esc(x.id) + '"' + (x.id === st.cur ? ' selected' : '') + '>' + esc(x.name || '(senza nome)') + '</option>';
    }).join('');
    document.getElementById('nav').innerHTML = ROUTES.map(function (r) {
      return '<a href="#/' + r[0] + '"' + (r[0] === route() ? ' aria-current="page"' : '') + '>' + r[1] + '</a>';
    }).join('');
    U.updateCalc();
  }
  function render() {
    var y = root.scrollY;
    document.getElementById('view').innerHTML = P[route()].render();
    renderHeader(); U.paintLast();
    root.scrollTo(0, y);
  }

  function pushLog(text) { U.logLine(S.get().clog, text); }
  function need(cond, msg) { if (!cond) U.toast(msg); return cond; }

  /* ---------- eventi di input ---------- */
  document.addEventListener('input', function (e) {
    var t = e.target, st = S.get();
    if (t.hasAttribute('data-p')) {
      S.setPath(S.cur(), t.getAttribute('data-p'), val(t));
      if (t.getAttribute('data-p') === 'name') renderHeader();
    } else if (t.hasAttribute('data-s')) {
      var v = val(t); if (t.type === 'number') v = v === '' ? '' : +v;
      S.setPath(st.settings, t.getAttribute('data-s'), v);
    } else if (t.hasAttribute('data-t') || t.hasAttribute('data-tc')) {
      S.setPath(U.tmp, t.getAttribute('data-t') || t.getAttribute('data-tc'), val(t));
      return;
    } else if (t.hasAttribute('data-p-en')) {
      S.setPath(st.enemies, t.getAttribute('data-p-en'), val(t));
    } else return;
    S.save(); U.updateCalc();
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.hasAttribute('data-act-change')) {
      var a = t.getAttribute('data-act-change');
      if (a === 'char') { S.get().cur = t.value; S.save(); render(); }
      if (a === 'weapon') {
        var f = P.combat.cb(), w = S.cur().weapons[+t.value], wi = P.combat.weaponInfo(w);
        f.weapon = t.value; f.limit = ''; f.res = null; f.cres = null; f.cres2 = null; f.fres = null; f.letter = ''; f.letter2 = ''; f.wi = wi;
        if (w && wi) { f.atk = wi.atk || ''; f.limit = wi.limit || ''; f.skill = w.skill; f.fumble = wi.cm == null ? '' : String(wi.cm); f.ct = wi.c1 ? wi.c1.ct : ''; f.ct2 = wi.c2 ? wi.c2.ct : ''; f.armor = ''; }
        render();
      }
      if (a.indexOf('wcat:') === 0) {
        var wi2 = +a.slice(5), ww = S.cur().weapons[wi2], cw = null;
        U.weaponCat().forEach(function (x) { if (x.id === t.value) cw = x; });
        ww.id = t.value; if (cw && !ww.n) ww.n = cw.n; S.save(); render();
      }
      var ap = a.split(':');
      if (G.changes && G.changes[ap[0]]) G.changes[ap[0]](t.value, ap[1]);
      if (a === 'popolo') { if (R.applyPopolo(S.cur(), t.value)) { S.save(); render(); U.toast('Applicate le modifiche del popolo (TB-3).'); } else { S.cur().popolo = ''; S.save(); } }
    } else if (t.hasAttribute('data-act-file')) {
      importFile(t.files && t.files[0]); t.value = '';
    } else if (t.getAttribute('data-re')) render();
  });

  /* ---------- azioni ---------- */
  function listOf(name) {
    var st = S.get();
    return STATE_LISTS[name] ? st[name] : S.getPath(S.cur(), name);
  }
  function openRoll(label, bonus) {
    var r = dice.open(S.get().settings.dice), tot = r.total + bonus;
    U.showRoll(label, 'tiro ' + (r.rolls.length > 1 ? r.rolls.join(', ') + ' = ' + r.total : r.total) + (bonus ? ' ' + R.fmt(bonus) : ''), tot);
    return tot;
  }

  var ACT = {
    pf: function (b) { var c = S.cur(); c.pf.dmg = Math.max(0, R.num(c.pf.dmg) + (+b.dataset.n)); S.save(); render(); },
    newchar: function () {
      var c = R.newChar('Personaggio ' + (S.get().chars.length + 1)); S.get().chars.push(c); S.get().cur = c.id; S.save(); location.hash = '#/sheet'; render();
    },
    dupchar: function () {
      var c = JSON.parse(JSON.stringify(S.cur())); c.id = R.uid(); c.name += ' (copia)'; S.get().chars.push(c); S.get().cur = c.id; S.save(); render();
    },
    delchar: function () {
      var st = S.get(); if (!need(st.chars.length > 1, 'Deve restare almeno un personaggio.')) return;
      if (!confirm('Eliminare «' + S.cur().name + '»? Non si può annullare.')) return;
      st.chars = st.chars.filter(function (x) { return x.id !== st.cur; }); st.cur = st.chars[0].id; S.save(); render();
    },
    rollskill: function (b) { var c = S.cur(), i = +b.dataset.i; openRoll(c.skills[i].name || 'Abilità', R.skillTotal(c, i, R.ctx(S.get().settings))); },
    rolldef: function (b) {
      var d = D.DEFENSES.filter(function (x) { return x[0] === b.dataset.k; })[0];
      openRoll(d[1], R.defenseTotal(S.cur(), d[0], d[2], R.ctx(S.get().settings)));
    },
    d100o: function () { openRoll('d100 aperto', 0); render(); },
    d100c: function () { var r = dice.closed(); U.showRoll('d100 chiuso', '', r.total); render(); },
    die: function (b) { var n = +b.dataset.d.slice(1), v = dice.d(n); U.showRoll(b.dataset.d, '', v); render(); },
    rollexpr: function () {
      var r = dice.expr(U.tmp.expr || ''); if (!need(r, 'Espressione non valida. Esempio: 2d6+1')) return;
      U.showRoll(U.tmp.expr, '[' + r.rolls.join(', ') + ']' + (r.mod ? ' ' + R.fmt(r.mod) : ''), r.total); render();
    },
    clearroll: function () { S.get().dlog = []; S.save(); render(); },
    add: function (b) {
      var l = b.dataset.list, c = S.cur();
      c[l].push(l === 'inv' ? { n: '', q: '', note: '' } : l === 'erbario' ? { n: '', uso: '', cod: '', q: '', note: '' } : l === 'weapons' ? { id: '', n: '', atk: '', skill: '', ct: '', fumble: '', git: '' } : { n: '', lvl: '', note: '' }); S.save(); render();
    },
    del: function (b) {
      var arr = listOf(b.dataset.list); if (!arr) return;
      if ((b.dataset.list === 'atk' || b.dataset.list === 'crit') && !confirm('Eliminare questa tabella?')) return;
      arr.splice(+b.dataset.i, 1); S.save(); render();
    },
    attack: function () {
      var f = P.combat.cb(), st = S.get(), c = S.cur();
      if (f.atk && !need(f.armor !== '', 'Scegli l\'armatura del bersaglio.')) return;
      if (f.atk && (P.combat.tableById(P.combat.atkList(S.get()), f.atk).limits || []).length && !need(f.limit !== '', 'Scegli taglia o tipo di dardo.')) return;
      var res = P.combat.resolveAttack(f, c, st, dice.open);
      f.res = res;
      if (res.cell) {
        f.pf = String(res.cell.pf); f.cres = null; f.cres2 = null;
        f.letter = res.fail ? '' : P.combat.capLetter(res.cell.crit || '', f.wi && f.wi.c1 && f.wi.c1.max);
        f.letter2 = P.combat.secondaryLetter(f.letter, f.wi && f.wi.c2);
      }
      var desc = 'Attacco ' + res.total + (res.cell && !res.fail ? ' → ' + res.cell.pf + ' PF' + (res.cell.crit ? ' + critico ' + res.cell.crit : '') : '') + (res.fumble ? ' · FALLIMENTO' : '');
      pushLog(desc); U.showRoll('Attacco', 'tiro ' + res.roll.total + ' ' + R.fmt(res.bo) + ' − ' + res.bd, res.total);
      S.save(); render();
    },
    fumbleroll: function () {
      var f = P.combat.cb(), st = S.get(), id = f.ft || (f.res && f.res.table && ({ 'TA-1': 'TTM-1', 'TA-2': 'TTM-1', 'TA-3': 'TTM-1', 'TA-10': 'TTM-1', 'TA-4': 'TTM-2', 'TA-11': 'TTM-6', 'TA-7': 'TTM-3', 'TA-8': 'TTM-3' })[f.res.table.id]);
      var tb = P.combat.tableById(P.combat.critList(st), id); if (!need(tb, 'Scegli la tabella dei fallimenti.')) return;
      var raw = dice.closed().total, row = T.lookupCrit(tb, raw);
      f.fres = { raw: raw, row: row }; pushLog('Fallimento (' + tb.id + ') ' + raw + ': ' + row.text); U.showRoll('Fallimento', tb.id, raw); S.save(); render();
    },
    mybd: function () {
      var f = P.combat.cb(), c = S.cur();
      f.bd = String(R.defenseTotal(c, 'bd', 'AG', R.ctx(S.get().settings)) + R.num(c.prot.modbd)); render();
    },
    crit: function (b) {
      var k = b.getAttribute('data-k') || '', f = P.combat.cb(), st = S.get(), letter = f['letter' + k], croll = f['croll' + k];
      var raw = croll !== '' ? R.num(croll) : dice.closed().total;
      var mod = D.CRIT_MOD[letter] || 0, total = raw + mod, tb = P.combat.tableById(P.combat.critList(st), f['ct' + k]);
      f['cres' + k] = { raw: raw, mod: mod, letter: letter, total: total, row: tb ? T.lookupCrit(tb, total) : null };
      pushLog('Critico ' + (k ? 'secondario ' : '') + letter + ': ' + raw + ' ' + R.fmt(mod) + ' = ' + total + (f['cres' + k].row ? ' — ' + f['cres' + k].row.text : ''));
      U.showRoll('Critico ' + letter, raw + ' ' + R.fmt(mod), total); S.save(); render();
    },
    dmgenemy: function () {
      var f = P.combat.cb(), st = S.get(), e = st.enemies.filter(function (x) { return x.id === f.target; })[0];
      if (!need(e, 'Seleziona un avversario.') || !need(f.pf !== '', 'Indica i PF inflitti.')) return;
      e.dmg = R.num(e.dmg) + R.num(f.pf); pushLog(e.n + ' subisce ' + f.pf + ' PF'); S.save(); render();
    },
    dmgme: function () {
      var f = P.combat.cb(), c = S.cur(); if (!need(f.pf !== '', 'Indica i PF inflitti.')) return;
      c.pf.dmg = R.num(c.pf.dmg) + R.num(f.pf); pushLog(c.name + ' subisce ' + f.pf + ' PF'); S.save(); render();
    },
    enadd: function () {
      var e = U.tmp.en || {}; if (!need((e.n || '').trim(), 'Dai un nome all\'avversario.')) return;
      S.get().enemies.push({ id: R.uid(), n: e.n.trim(), max: e.max === undefined ? '' : e.max, dmg: 0 }); U.tmp.en = {}; S.save(); render();
    },
    enhit: function (b) { var e = S.get().enemies[+b.dataset.i]; e.dmg = Math.max(0, R.num(e.dmg) + (+b.dataset.n)); S.save(); render(); },
    target: function (b) { P.combat.cb().target = S.get().enemies[+b.dataset.i].id; },
    clearclog: function () { S.get().clog = []; S.save(); render(); },
    diaryadd: function () {
      var d = S.cur().diary, s = (U.tmp.dn || '').trim(); if (!need(s, 'Scrivi una nota.')) return;
      d.log.unshift({ t: Date.now(), par: d.par, s: s }); U.tmp.dn = ''; S.save(); render();
    },
    flagadd: function () {
      var s = (U.tmp.df || '').trim(); if (!need(s, 'Scrivi il segnalino.')) return;
      S.cur().diary.flags.push(s); U.tmp.df = ''; S.save(); render();
    },
    impatk: function () {
      var im = U.tmp.imp || {}, armors = (im.armors || '').split(',').map(function (x) { return x.trim(); }).filter(Boolean);
      if (!need((im.name || '').trim(), 'Dai un nome alla tabella.') || !need(armors.length, 'Indica i nomi delle colonne di armatura.')) return;
      try {
        var rows = T.parseAttackText(im.text || '', armors.length);
        S.get().atk.push({ id: R.uid(), name: im.name.trim(), armors: armors, fumble: im.fumble === undefined ? '' : im.fumble, rows: rows });
        U.tmp.imp = null; S.save(); render(); U.toast('Tabella importata: ' + rows.length + ' righe.');
      } catch (err) { U.toast(err.message); }
    },
    impcrit: function () {
      var im = U.tmp.imp || {};
      if (!need((im.cname || '').trim(), 'Dai un nome alla tabella.')) return;
      try {
        var rows = T.parseCritText(im.ctext || '');
        S.get().crit.push({ id: R.uid(), name: im.cname.trim(), rows: rows });
        U.tmp.imp = null; S.save(); render(); U.toast('Tabella importata: ' + rows.length + ' righe.');
      } catch (err) { U.toast(err.message); }
    },
    resetsettings: function () { S.get().settings = R.defaultSettings(); S.save(); render(); U.toast('Impostazioni ripristinate.'); },
    healroll: function () {
      var f = U.tmp.heal || (U.tmp.heal = { roll: '', col: '1', sev: 'lieve' }), r = dice.d100();
      f.roll = String(r + R.statBonus(S.cur(), 'CO', R.ctx(S.get().settings))); U.showRoll('Guarigione', 'd100 ' + r + ' + bonus CO', f.roll); render();
    },
    export: function () {
      var blob = new Blob([JSON.stringify(S.get(), null, 1)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'girsa-backup-' + new Date().toISOString().slice(0, 10) + '.json';
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    },
    wipechars: function () {
      var st = S.get(), n = st.chars.length;
      if (!confirm('Eliminare TUTTE le ' + n + ' schede dei personaggi, gli avversari del Combattimento e le cronologie dei dadi e del combattimento? Le tabelle importate e le impostazioni restano. Non si può annullare: se non hai esportato un backup, annulla ed esporta prima.')) return;
      if (!confirm('Ultima conferma: ' + n + (n === 1 ? ' scheda verrà eliminata' : ' schede verranno eliminate') + ' e al suo posto ci sarà un personaggio vuoto. Procedo?')) return;
      var b = S.blank();
      st.chars = b.chars; st.cur = b.cur; st.enemies = []; st.clog = []; st.dlog = [];
      Object.keys(U.tmp).forEach(function (k) { delete U.tmp[k]; });
      S.save(); render(); U.toast('Schede eliminate: ora c\'è un personaggio vuoto.');
    }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!b || b.tagName === 'INPUT' && b.type !== 'radio' || b.disabled) return;
    var nm = b.getAttribute('data-act'), f = ACT[nm] || (G.acts && G.acts[nm]); if (f) f(b);
  });

  /* ---------- importazione file ---------- */
  function validTable(o) {
    if (!o || typeof o !== 'object' || !Array.isArray(o.rows)) throw new Error('Tabella non valida: mancano le righe.');
    if (o.type === 'attack') {
      if (!Array.isArray(o.armors) || !o.armors.length) throw new Error('Tabella di attacco senza colonne di armatura.');
      T.validateAttackRows(o.rows);
      o.rows.forEach(function (r, i) { if (!Array.isArray(r.cells) || r.cells.length !== o.armors.length) throw new Error('Riga ' + (i + 1) + ': numero di celle diverso dalle colonne.'); });
      return { id: R.uid(), name: String(o.name || 'Senza nome'), armors: o.armors.map(String), fumble: o.fumble == null ? '' : o.fumble, rows: o.rows };
    }
    o.rows.forEach(function (r, i) { if (typeof r.text !== 'string' || typeof r.max !== 'number') throw new Error('Riga ' + (i + 1) + ' dei critici non valida.'); });
    return { id: R.uid(), name: String(o.name || 'Senza nome'), rows: o.rows };
  }
  function importFile(file) {
    if (!file) return;
    var fr = new FileReader();
    fr.onload = function () {
      try {
        var o = JSON.parse(fr.result), st = S.get();
        if (o && Array.isArray(o.chars)) {
          if (!confirm('Sostituire tutti i dati attuali con quelli del file?')) return;
          S.replaceAll(o); render(); U.toast('Backup importato.'); return;
        }
        var arr = Array.isArray(o) ? o : [o], n = 0;
        arr.forEach(function (t) {
          if (t.type === 'attack') { st.atk.push(validTable(t)); n++; } else if (t.type === 'crit') { st.crit.push(validTable(t)); n++; } else throw new Error('Formato non riconosciuto.');
        });
        S.save(); render(); U.toast('Importate ' + n + ' tabelle.');
      } catch (err) { U.toast('Importazione fallita: ' + err.message); }
    };
    fr.readAsText(file);
  }

  /* ---------- avvio ---------- */
  function init() {
    S.load();
    root.addEventListener('hashchange', render);
    render();
    if (!S.ok()) U.toast('Il browser impedisce il salvataggio: usa «Esporta» in Dati.');
    root.addEventListener('pagehide', function () { S.flush(); });
    document.addEventListener('visibilitychange', function () { if (document.hidden) S.flush(); });
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    }
  }
  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
  }
  G.app = { render: render, header: renderHeader, ACT: ACT, validTable: validTable };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
</html>
