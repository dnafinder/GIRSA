      U.field('Altri bonus ai PF', U.inp('data-p', 'pf.extra', c.pf.extra, { type: 'number' })) +
      U.field('Danno subito', U.inp('data-p', 'pf.dmg', c.pf.dmg, { type: 'number' })) +
      '<div class="fld"><span>Stato</span><b class="pfbig" data-calc="pf" data-state="' + R.pfInfo(c, R.ctx(S.get().settings)).state + '">' + esc(U.calcText('pf')) + '</b></div></div>' +
      '<p class="hint" data-calc="pfd">' + esc(U.calcText('pfd')) + '</p>' +
      '<p class="hint">I PF si calcolano da soli: un d10 per ogni grado di Resistenza fisica (li tira l\'app quando alzi i gradi), più il bonus speciale della riga. I pulsanti PF in alto modificano il danno subito.</p></section>';
  }

  function skillRow(c, i) {
    var s = c.skills[i], m = R.meta(s), free = s.cat === 'sec' || s.k === 'arm_x';
    var label = free ? U.inp('data-p', 'skills.' + i + '.name', s.name, { ph: 'Abilità', label: 'Nome abilità' }) : '<span class="nm">' + esc(s.name) + (m.tag ? ' <i class="tag">' + m.tag + '</i>' : '') + '</span>';
    var stat = m.noStat ? '<span class="dim">–</span>' : U.sel('data-p', 'skills.' + i + '.stat', s.stat, [['', '–']].concat(D.STATS.map(function (x) { return x[0]; })), { cls: 'sm', label: 'Caratteristica' });
    var ranks = m.noRanks ? '<span class="dim">–</span>' : U.inp('data-p', 'skills.' + i + '.ranks', s.ranks, { type: 'number', cls: 'sm', label: 'Gradi', title: m.maxRanks ? 'Massimo ' + m.maxRanks + ' gradi (TB-4)' : '' });
    if (m.prog === 'manual') ranks += U.inp('data-p', 'skills.' + i + '.rbm', s.rbm, { type: 'number', cls: 'sm', ph: 'bonus', label: 'Bonus gradi a mano', title: 'Progressione a dadi: inserisci il bonus a mano' });
    var cell = function (field, off, label) { return off ? '<span class="dim">–</span>' : U.inp('data-p', 'skills.' + i + '.' + field, s[field], { type: 'number', cls: 'sm', label: label }); };
    return '<tr><td class="l">' + label + '</td><td>' + stat + '</td><td>' + ranks + '</td><td>' + U.calc('rk', i, 'dim') + '</td><td>' + cell('prof', m.noProf, 'Bonus professione') +
      '</td><td>' + cell('obj', m.noObj, 'Bonus oggetto') + '</td><td>' + U.inp('data-p', 'skills.' + i + '.spec', s.spec, { type: 'number', cls: 'sm', label: 'Bonus speciale' }) +
      '</td><td>' + U.calc('sk', i) + '</td><td><button class="mini" data-act="rollskill" data-i="' + i + '" aria-label="Tira ' + esc(s.name) + '">🎲</button></td></tr>';
  }
  function skills(c) {
    var h = '<section class="card"><h2>Abilità</h2><p class="hint">Totale = bonus gradi + caratteristica + professione + oggetto + speciale. Il pulsante 🎲 tira il d100 aperto e somma il totale. Le abilità secondarie seguono la progressione primaria: il testo non dice altro, verifica sul manuale.</p>';
    D.CATS.forEach(function (cat) {
      var idx = []; c.skills.forEach(function (s, i) { if (s.cat === cat[0]) idx.push(i); });
      if (!idx.length) return;
      h += '<details' + (cat[0] === 'arm' || cat[0] === 'mov' ? ' open' : '') + '><summary>' + esc(cat[1]) + '</summary><div class="scroll"><table class="sk"><thead><tr><th class="l">Abilità</th><th>Car.</th><th>Gradi</th><th>B.gr.</th><th>Prof</th><th>Ogg</th><th>Spec</th><th>Tot</th><th></th></tr></thead><tbody>' +
        idx.map(function (i) { return skillRow(c, i); }).join('') + '</tbody></table></div></details>';
    });
    return h + '</section>';
  }

  function defenses(c) {
    var h = '<section class="card"><h2>Difese e tiri resistenza</h2><div class="scroll"><table class="sk"><thead><tr><th class="l">Voce</th><th>Car.</th><th>Mod. popolo</th><th>Extra</th><th>Tot</th><th></th></tr></thead><tbody>';
    D.DEFENSES.forEach(function (d) {
      h += '<tr><td class="l">' + esc(d[1]) + '</td><td>' + d[2] + '</td><td>' + U.inp('data-p', 'defs.' + d[0] + '.mod', c.defs[d[0]].mod, { type: 'number', cls: 'sm', label: d[1] + ' modifica popolo' }) +
        '</td><td>' + U.inp('data-p', 'defs.' + d[0] + '.extra', c.defs[d[0]].extra, { type: 'number', cls: 'sm', label: d[1] + ' extra' }) +
        '</td><td>' + U.calc('df', d[0]) + '</td><td><button class="mini" data-act="rolldef" data-k="' + d[0] + '" aria-label="Tira ' + esc(d[1]) + '">🎲</button></td></tr>';
    });
    return h + '</tbody></table></div></section>';
  }

  function protection(c) {
    var f = function (l, p) { return U.field(l, U.inp('data-p', 'prot.' + p, c.prot[p])); };
    return '<section class="card"><h2>Protezioni</h2><div class="grid g3">' + f('Armatura', 'armatura') + f('Tipo / colonna armatura', 'res') + f('Scudo', 'scudo') + f('Elmo', 'elmo') +
      f('Bracciali', 'bracciali') + f('Schinieri', 'schinieri') + f('Mod. al BD', 'modbd') + f('Ingombro', 'ingombro') + f('Movimento', 'mov') + '</div>' + protStats(c) + '</section>';
  }
  /* Statistiche dal compendio (TSC-4) per i pezzi scelti da «Oggetti» → «Indossa» (nome identico a quello del catalogo). */
  function protStats(c) {
    var out = '';
    [['Armatura', c.prot.armatura], ['Elmo', c.prot.elmo], ['Scudo', c.prot.scudo]].forEach(function (x) {
      var f = G.gear && G.gear.armorFind(x[1]);
      if (f) out += '<p class="hint"><b>' + x[0] + '</b>, ' + esc(x[1]) + ': ' + esc(G.gear.armorLine(f)) + '</p>';
    });
    return out ? out + '<p class="hint">MM: penalità alle Manovre in movimento · BO-M / BO-T: penalità al BO in mischia / da lancio e tiro · BD: bonus difensivo (BD-M, BD-T, BD-I: contro mischia, tiro/lancio, incantesimi diretti) · PRC: penalità al Tiro Percezione · Res: resistenza ai colpi. Un pezzo perde un punto di Res ogni volta che protegge da un colpo critico; a zero è inutilizzabile. Il calcolo non è automatico: applica tu le penalità.</p>' : '';
  }

  /* Erbario: le erbe trovate e conosciute (come il modulo «Erbario» del compendio); «Oggetti» → Erbe le aggiunge. */
  function erbario(c) {
    var h = '<section class="card"><h2>Erbario</h2><p class="hint">Erbe trovate e conosciute. Cod = codice nella tabella «Erbe, veleni e malattie» (pagina Oggetti).</p>';
    c.erbario.forEach(function (it, i) {
      var p = 'erbario.' + i + '.';
      h += '<div class="wp"><div class="li">' + U.inp('data-p', p + 'n', it.n, { ph: 'Erba', label: 'Erba' }) + U.inp('data-p', p + 'cod', it.cod, { ph: 'Cod', cls: 'sm', label: 'Codice' }) +
        U.inp('data-p', p + 'q', it.q, { ph: 'Q.tà', cls: 'sm', label: 'Quantità' }) + '<button class="mini" data-act="del" data-list="erbario" data-i="' + i + '" aria-label="Elimina">✕</button></div>' +
        '<div class="li">' + U.inp('data-p', p + 'uso', it.uso, { ph: 'Modalità d\'uso', label: 'Modalità d\'uso' }) + U.inp('data-p', p + 'note', it.note, { ph: 'Effetti / note', label: 'Effetti' }) + '</div></div>';
    });
    return h + '<button data-act="add" data-list="erbario">+ Erba</button></section>';
  }

  function list(c, key, title, cols, addLabel) {
    var h = '<section class="card"><h2>' + title + '</h2>';
    c[key].forEach(function (it, i) {
      h += '<div class="li">' + cols.map(function (col) {
        return U.inp('data-p', key + '.' + i + '.' + col[0], it[col[0]], { ph: col[1], cls: col[2] || '', label: col[1] });
      }).join('') + '<button class="mini" data-act="del" data-list="' + key + '" data-i="' + i + '" aria-label="Elimina">✕</button></div>';
    });
    return h + '<button data-act="add" data-list="' + key + '">' + addLabel + '</button></section>';
  }

  var WGROUP = { taglio1: 'Taglio, 1 mano', contund1: 'Contundenti, 1 mano', asta1: 'Asta, 1 mano', asta2: 'Asta, 2 mani', due_mani: 'A 2 mani', lancio: 'Da lancio', tiro: 'Da tiro' };

  /* Armi: si sceglie dal catalogo (tabella TSC-1) oppure si inserisce un'arma personalizzata. */
  function weapons(c) {
    var cat = U.weaponCat();
    var catOpts = [['', '(arma personalizzata)']].concat(cat.map(function (w) { return [w.id, WGROUP[w.group] + ' · ' + w.n]; }));
    var atk = [['', '(tabella di attacco)']].concat(U.allAtk().map(function (t) { return [t.id, t.name]; }));
    var ct = [['', '(tabella critici)']].concat(U.allCrit().filter(function (t) { return !/^TTM-/.test(t.id); }).map(function (t) { return [t.id, t.name]; }));
    var sk = [['', '(abilità per il BO)']];
    c.skills.forEach(function (s, i) { if ((s.cat === 'arm' || s.cat === 'ama' || s.cat === 'mag') && s.name) sk.push([String(i), s.name]); });
    var h = '<section class="card"><h2>Armi</h2><p class="hint">Scegli l\'arma dal catalogo: tabella di attacco, colpo maldestro, critici e modificatori arrivano da soli (tabella delle armi del compendio). Per ciascuna scegli solo l\'abilità da cui prendere il BO.</p>';
    c.weapons.forEach(function (w, i) {
      var cw = null; cat.forEach(function (x) { if (x.id === w.id) cw = x; });
      h += '<div class="wp"><div class="li">' + U.sel('data-act-change', 'wcat:' + i, w.id || '', catOpts, { label: 'Arma dal catalogo' }) +
        '<button class="mini" data-act="del" data-list="weapons" data-i="' + i + '" aria-label="Elimina arma">✕</button></div><div class="grid g3">' +
        U.inp('data-p', 'weapons.' + i + '.n', w.n, { ph: 'Nome', label: 'Nome arma' }) +
        U.sel('data-p', 'weapons.' + i + '.skill', w.skill, sk, { label: 'Abilità' });
      if (cw) {
        h += '</div><p class="hint">' + esc(cw.atk) + ' · colpo maldestro 01–' + String(cw.cm).padStart(2, '0') + ' · critico ' + esc(cw.c1.type) + (cw.c1.max ? '(' + cw.c1.max + ')' : '') +
          (cw.c2 ? ' + secondario ' + esc(cw.c2.type) + (cw.c2.max ? '(' + cw.c2.max + ')' : '') : '') + (cw.git ? ' · gittata base ' + esc(cw.git) : '') +
          (cw.note ? '<br>' + esc(cw.note) : '') + '</p></div>';
      } else {
        h += U.sel('data-p', 'weapons.' + i + '.atk', w.atk, atk, { label: 'Tabella di attacco' }) +
          U.sel('data-p', 'weapons.' + i + '.ct', w.ct, ct, { label: 'Tabella critici' }) +
          U.inp('data-p', 'weapons.' + i + '.fumble', w.fumble, { type: 'number', ph: 'CM: tiro max', label: 'Colpo maldestro, tiro massimo' }) +
          U.inp('data-p', 'weapons.' + i + '.git', w.git, { ph: 'Gittata', label: 'Gittata' }) + '</div></div>';
      }
    });
    return h + '<button data-act="add" data-list="weapons">+ Arma</button></section>';
  }

  function render() {
    var c = S.cur();
    return identity(c) + stats(c) + pf(c) + skills(c) + defenses(c) + protection(c) + weapons(c) +
      list(c, 'inv', 'Inventario', [['n', 'Oggetto'], ['q', 'Quantità', 'sm'], ['note', 'Note']], '+ Oggetto') + erbario(c) +
      list(c, 'spells', 'Incantesimi', [['n', 'Incantesimo'], ['lvl', 'Livello', 'sm'], ['note', 'Note']], '+ Incantesimo') +
      '<section class="card"><h2>Note</h2><textarea data-p="note" rows="5" aria-label="Note">' + esc(c.note) + '</textarea></section>';
  }

  G.pages.sheet = { render: render };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Guida: combattimento e magia (regole del Prospetto sul Combattimento, tabelle degli incantesimi, copertura, gittata, animali). */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var U = G.ui, esc = U.esc, CD = G.combatdata, CR = G.combatrules;

  function tbl(head, rows, o) {
    o = o || {};
    return '<div class="scroll"><table class="sk"><thead><tr>' + head.map(function (h, i) { return '<th' + (i === 0 || o.left ? ' class="l"' : '') + '>' + esc(h) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      rows.map(function (r) { return '<tr>' + r.map(function (c, i) { return '<td' + (i === 0 || o.left ? ' class="l"' : '') + '>' + esc(c) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>';
  }
  function sgn(v) { return v === null || v === undefined ? '—' : (v > 0 ? '+' + v : String(v).replace('-', '−')); }
  function p(t) { return '<p class="pl">' + esc(t) + '</p>'; }

  /* ---------- tabelle inserite nei testi del Prospetto sul Combattimento ---------- */
  var TABLES = {
    bo: function () {
      return tbl(['Modificatore al BO', 'Valore'], [['Attacco sul fianco', '+15'], ['Attacco da dietro (oltre il bonus dell\'attacco sul fianco)', '+20'], ['Attacco di sorpresa', '+20'],
        ['Avversario stordito*', '+20'], ['Avversario atterrato*', '+30'], ['Avversario prono*', '+50']]) +
        '<p class="hint">*Può essere applicato solo uno di questi bonus. I bonus soprascritti non sono applicabili alle armi da Tiro o da Lancio.</p>' +
        tbl(['Modificatore al BO', 'Valore'], [['Arma impugnata con la mano non dominante', '−20'], ['Sfoderare l\'arma', '−20'], ['Cambiare un\'arma o impugnare uno scudo', '−50'],
          ['Lasciare un\'arma o scudo, cambiare mano', '−10'], ['Se un\'arma viene lanciata come azione veloce', '−20'], ['L\'attaccante ha perso più del 50% dei suoi PF', '−20'],
          ['Cambiare obiettivo all\'ultimo', '−30'], ['Mirare, con armi da Tiro o da Lancio', '−30'], ['Accecato, al buio completo', '−100']]) +
        '<p class="hint">Nota: se non specificato diversamente, i modificatori sono cumulativi. Nel Combattimento li spunti uno per uno.</p>';
    },
    parata: function () {
      return tbl(['Armi', 'Limitazione alla Parata', 'Bonus alla parata'], [['Armi a una mano', '-', '+5'], ['Armi a due mani', 'Contro armi a una mano può essere convertito al massimo metà del BO', '+5'],
        ['Armi ad Asta', 'Contro armi non ad asta può essere convertito al massimo metà del BO', '+5']], { left: true });
    },
    scudi: function () {
      return '<h4>Statistiche offensive degli scudi</h4>' + tbl(['Tipo', 'Limite attacco con «Colpo di scudo»', 'BO «Colpo di Scudo»', 'CM'], [['Brocchiero', 'Piccoli*', '0', '3'], ['Rotondo', 'Medi*', '0', '4'],
        ['Scapezzato', 'Medi*', '−20', '6'], ['Palvese', 'Medi*', '−40', '8']]);
    },
    oltre150: function () {
      return tbl(['Margine (risultato − 150)', 'Critico supplementare'], [['0/30', 'Nessun critico'], ['31/60', 'A'], ['61/90', 'B'], ['91/120', 'C'], ['121/150', 'D'], ['151 o più', 'E']]) +
        '<p class="hint">Nel Combattimento, se il risultato supera l\'ultima riga di una tabella di attacco, l\'app ti mostra questo margine.</p>';
    }
  };

  function rulesHtml() {
    var h = '<section class="card"><h2>Combattimento</h2><p class="hint">Il «Prospetto sul Combattimento in Girsa» del compendio. Per attacco, critico, iniziativa e incantesimi base usa la pagina «Combattimento».</p>';
    (CR || []).forEach(function (s) {
      h += '<details><summary>' + esc(s.t) + '</summary>';
      var inList = false;
      s.items.forEach(function (it) {
        if (it.li) { if (!inList) { h += '<ul>'; inList = true; } h += '<li>' + esc(it.li) + '</li>'; return; }
        if (inList) { h += '</ul>'; inList = false; }
        if (it.p) h += p(it.p); else if (it.table) h += TABLES[it.table]();
      });
      if (inList) h += '</ul>';
      h += '</details>';
    });
    return h + '</section>';
  }

  /* ---------- tabelle di supporto ---------- */
  var ANIMALS = [
    ['Chele/Becco', '(Ch)', 'Zanne e Artigli (TA-5)', 'TA', 'IM*'], ['Morso ▲', '(Mo)', 'Zanne e Artigli (TA-5)', 'PU', 'TA(C)'], ['Artigli/Unghie', '(Ar) o (Za)', 'Zanne e Artigli (TA-5)', 'TA', 'PU(B)'],
    ['Corna/Zanne', '(Co)', 'Zanne e Artigli (TA-5)', 'PU', 'IM(C)*'], ['Pungiglioni ▼', '(Pu)', 'Zanne e Artigli (TA-5)', 'PU', 'IM(C)*'],
    ['Immobilizzare/Afferrare/Avviluppare/Inghiottire', '(Pr)', 'Immobilizz. e Sbilanciamento (TA-6)', 'PR', 'PE(C)'], ['Testa/Cornata/Urto/Botta', '(Te) o (Ur)', 'Immobilizz. e Sbilanciamento (TA-6)', 'PE', 'IM(C)*'],
    ['Piccoli Animali ▼', '(Mi)', 'Zanne e Artigli (TA-5)', 'TA(T)', '-'], ['Calpestare/Travolgere ▲', '(Sc)', 'Zanne e Artigli (TA-5)', 'IM', 'IM*'], ['Caduta/Stritolamento** ▲', '(Ca) o (Im)', 'Zanne e Artigli (TA-5)', 'IM', 'IM*'],
    ['Pugno/Calcio***', '(Pg)', 'Zanne e Artigli (TA-5)', 'PE(A)', '-'], ['Lotta/Placcaggio***', '(Lo)', 'Immobilizz. e Sbilanciamento (TA-6)', 'PR(A)', '-']];

  function supportHtml() {
    var h = '<section class="card"><h2>Copertura, gittata, animali</h2>';
    h += '<details><summary>TSC-4 · Bonus Difensivo di Copertura</summary>' +
      tbl(['Copertura', 'Mischia', 'Tiro/Lancio', 'Incantesimi Base', 'Inc. Diretti', 'Inc. ad Area'], CD.tsc4.map(function (r) { return [r.n].concat(r.v.map(function (v) { return v === null ? '-' : sgn(v); })); })) +
      '<p class="hint">Modificatori al Bonus Difensivo. Copertura Morbida: legno, rami di alberi, staccionate, porte ecc. Copertura Dura: muri di pietra, rocce ecc. Se non compare un numero (-) normalmente non si può effettuare l\'attacco. A discrezione del GM, attacchi speciali possono essere effettuati con una penalità di −100. ' +
      'Un bersaglio riparato da una copertura parziale o a metà può parare colpi in mischia o a distanza. Un bersaglio coperto da una copertura totale è stato notato, ma non è in linea di tiro: non può usare il suo Bonus Difensivo dovuto all\'Agilità e normalmente non può essere colpito in mischia, con armi da tiro/lancio o da incantesimi diretti. ' +
      'Un bersaglio coperto da qualsiasi copertura, per essere attaccato, deve essere prima notato tramite un tiro Percezione.</p></details>';
    h += '<details><summary>TSC-5 · Gittata delle armi</summary>' +
      tbl(['Base', 'Corta (+0)*', 'Media (−25)*', 'Lunga (−50)*', 'Massima (−75)*'], CD.tsc5.map(function (r) { return [String(r.base)].concat(r.r.map(function (x) { return x[0] + '-' + x[1]; })); })) +
      '<p class="hint">Valori espressi in metri; *penalità al Bonus Offensivo. La gittata base delle armi da lancio aumenta di 1 per ogni +5 del bonus in Forza.</p></details>';
    h += '<details><summary>TSC-2 · Statistiche degli animali</summary>' + tbl(['Tipo di attacco', 'Abbr.', 'Tabella d\'attacco', 'Critico primario', 'Critico secondario'], ANIMALS) +
      '<p class="hint">Colpi critici: IM = da impatto; PU = da punta; PR = da presa; TA = da taglio; PE = da perdita d\'equilibrio. Colpo critico primario: è di solito conseguente all\'attacco; tra parentesi è indicato il tipo massimo. ' +
      'Colpo critico secondario: se il primario è maggiore di A, ad esso consegue anche un secondario, sempre di un grado minore del primario, come indicato dalle tabelle d\'attacco. ' +
      '*: per questi attacchi il secondario si produce solo se si tratta di attacchi Grandi o Enormi. **: se il personaggio cade, questo attacco viene calcolato aggiungendo ai dadi un valore pari a 10 ogni 3 m di caduta (arrotondare per eccesso) e sottraendo l\'agilità del personaggio; ' +
      'l\'entità dell\'attacco dipende dalla caduta: 0-3 m (Piccolo); 3-15 m (Medio); 15-33 m (Grande); più di 33 m (Enorme). ***: i limiti al critico servono solo per il corpo a corpo senza addestramento; il limite massimo è quello degli attacchi Piccoli. ' +
      '▲: questi attacchi provocano il doppio dei PF. ▼: questi attacchi provocano la metà dei PF.</p></details>';
    var T = (G.tabledata && G.tabledata.crit || []).filter(function (t) { return /^TCM-/.test(t.id); });
    if (T.length) {
      h += '<details><summary>TCM · Colpi critici mirati da punta</summary><p class="hint">Regola opzionale della Mira: con un attacco da tiro o da lancio appuntito, penalità di −30 al BO; in caso di critico si usa la tabella della zona mirata. Modifiche: tipo T −50; A −20; B −10; C +0; D +10; E +20. r = round; PF = punti ferita. Nel Combattimento le trovi tra le tabelle dei critici.</p>' +
        T.map(function (t) {
          return '<details><summary>' + esc(t.name) + '</summary>' + tbl(['Tiro', 'Effetto'], t.rows.map(function (r) { return [(r.min == null ? '…' : r.min) + (r.max !== r.min ? '–' + r.max : ''), r.text]; }), { left: true }) + '</details>';
        }).join('') + '</details>';
    }
    return h + '</section>';
  }

  /* ---------- magia ---------- */
  function magicHtml() {
    var cols = ['Generale', 'Armatura di metallo', 'Armatura di cuoio', 'Armatura di metallo', 'Scudo di metallo', 'Elmo di metallo', 'Elmo di cuoio'];
    var h = '<section class="card"><h2>Magia</h2><p class="hint">Tabelle degli incantesimi, di attacco base, dei tiri resistenza e la Corruzione. Per lanciare un incantesimo di attacco base e fare il tiro resistenza usa la pagina «Combattimento».</p>';
    h += '<details><summary>Tipi di incantesimi</summary>' + tbl(['Abbr.', 'Classe', 'TR', 'Bonus', 'Tabella'], [
      ['ES', 'Elementale Sfera', 'No', 'Livello del personaggio**', 'TA8 Incantesimi Sfera'], ['ED', 'Elementale Diretto', 'No', 'BO Incantesimi Diretti', 'TA7 Incantesimi Dardo'],
      ['E', 'Elementale', 'No', 'Nessuno', 'TFI Fallimento Incantesimi'], ['F', 'Forza', 'Sì', 'BO Incantesimi Base', 'TA9 Incantesimi Base'], ['P', 'Passivo', 'Sì***', 'BO Incantesimi Base', 'TA9 Incantesimi Base'],
      ['U', 'Utilità', 'No', 'Nessuno', 'TFI Fallimento Incantesimi'], ['U', 'Utilità (se richiesto TR)*', 'Sì', 'BO Incantesimi Base', 'TA9 Incantesimi Base'], ['I', 'Informazione', 'No', 'Nessuno', 'TFI Fallimento Incantesimi']], { left: true }) +
      p('* Solo se il GM richiede un TR (es: il bersaglio non è cosciente dell\'incantesimo, istintiva resistenza, ecc.). Se il bersaglio è consenziente il TR ha una penalità di −50.') + p('** Solo se Usufruitore Puro o Ibrido.') +
      p('*** Un TR riuscito permette alla vittima solamente di accorgersi di essere stata bersaglio dell\'incantesimo.') +
      p('Il sottotipo M (Mentale) appartiene alla categoria F (Forza). Gli incantesimi di questo tipo non hanno effetto su creature che non possiedono una mente. I sottotipi G (Cura), A (Accessorio), D (Difensivo) appartengono alla categoria U (Utilità). ' +
        'Gli incantesimi del sottotipo S (Subconscio) possono essere lanciati automaticamente (se si possiedono sufficienti PM) quando l\'usufruitore non è cosciente o stordito, se si verificano le condizioni richieste. Possono essere programmati per reagire ad alcune condizioni particolari.') +
      '<p class="hint">La lettera che determina la categoria è segnata a fianco al nome dell\'incantesimo, sul manuale di Girsa/Merp e sugli Spell Law.</p></details>';
    h += '<details><summary>Classi di incantesimi e fallimento degli inoffensivi (TFI)</summary>' +
      tbl(['Classe', 'Livello incantesimo', 'Round di preparazione'], [['III', 'Dal livello del personaggio a −2 livelli', 'normali'], ['II', 'Da −3 a −5 livelli', 'considerato già preparato da 1 round'], ['I', 'Da −6 livelli in giù', 'considerato già preparato da 2 round']], { left: true }) +
      p('Tutti gli incantesimi appresi da un personaggio sono suddivisi in 3 Classi, ai fini del Tempo di Lancio necessario. Qualsiasi incantesimo di Classe III viene lanciato e preparato nel normale tempo richiesto (con bonus o penalità). Qualsiasi incantesimo di Classe II si considera sempre come fosse già stato preparato da 1 round. Qualsiasi incantesimo di Classe I si considera sempre come fosse già stato preparato da 2 round.') +
      tbl(['Round di preparazione', '0', '1', '2+'], [['% F incantesimi inoffensivi', '30', '15', '02'], ['% F incantesimi istantanei (*)', 'Sempre 02', 'Sempre 02', 'Sempre 02']]) +
      p('Gli incantesimi di tipo E, U e I generalmente non richiedono un TR. Per lanciare questi incantesimi si effettua un normale tiro percentuale contro il valore della percentuale di fallimento data dal numero di round di preparazione. La percentuale minima di fallimento è sempre 02%.') +
      p('Gli incantesimi lanciati tramite oggetti, che hanno un livello superiore all\'utilizzatore sono sempre considerati di Classe III. Il GM può imporre round di preparazione aggiuntivi per lanciare incantesimi di livello più alto di quello del personaggio.') +
      p('Il compendio dice: tutti gli incantesimi inoffensivi, che non richiedono TR da parte dell\'avversario o che non sono attacchi di tipo Dardo o Sfera, possono essere lanciati se si ottiene con un tiro aperto di 1d100 un risultato superiore alla percentuale di fallimento secondo la tabella TFI.') +
      p('Efficacia e raggio d\'azione: sono sempre indicati gli effetti massimi; l\'usufruitore può limitarli o diminuirli. Durata: è quantificata nel massimo possibile; l\'usufruitore può annullare l\'incantesimo prima dello scadere del termine rimanendo concentrato per un altro round.') +
      p('*Istantanei: gli incantesimi istantanei richiedono solo un minimo tempo per il lancio. Vengono sempre considerati come incantesimi di Classe I ai fini della preparazione ma non acquisiscono vantaggi da round di preparazione aggiuntivi. La loro percentuale di fallimento è sempre 02%. In nessun caso possono essere lanciati due incantesimi nello stesso round, nemmeno sotto effetto di Velocità.') + '</details>';
    h += '<details><summary>TA-9 · Attacco incantesimi base</summary><div class="scroll"><table class="sk"><thead><tr><th class="l" rowspan="2">Risultato</th><th rowspan="2">Generale</th><th colspan="2">Essenza</th><th colspan="2">Flusso</th><th colspan="2">Mentalismo</th></tr><tr>' +
      cols.slice(1).map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      CD.ta9.map(function (r) { return '<tr><td class="l">' + (r.ti ? 'TI ' : '') + (r.min === r.max ? r.min : (r.min < 10 ? '0' + r.min : r.min) + '-' + (r.max === 100 ? 100 : r.max < 10 ? '0' + r.max : r.max)) + '</td>' + r.v.map(function (v) { return '<td>' + (v === null ? 'F' : sgn(v)) + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
      p('Il numero ottenuto su questa tabella è il modificatore per il Tiro Resistenza che il bersaglio deve eseguire (vedi TRR). F indica il fallimento dell\'incantesimo e richiede un tiro sulla tabella Fallimento Incantesimi TTM-3. TI = tiro invariabile: si legge la riga del tiro non modificato, senza modificatori; con tiri da 03 a 95 i modificatori non portano il risultato sotto 3 né sopra 95.') +
      '<h4>Modificatori</h4>' + tbl(['Distanza', 'Mod.'], [['A contatto', '+30'], ['Da 0 a 3 m', '+10'], ['Da 3 a 16 m', '0'], ['Da 16 a 33 m', '−10'], ['Da 33 a 100 m', '−20'], ['Più di 100 m', '−30']]) +
      tbl(['Attaccante', 'Mod.'], [['BO Incantesimi Base dell\'attaccante', '+'], ['Ha perso più della metà dei suoi PF', '−10'], ['Incantesimo preparato per 4 r', '+20'], ['… per 3 r', '+10'], ['… per 2 r', '+0'], ['… per 1 r', '−15'], ['… per 0 r', '−30']]) +
      tbl(['Bersaglio', 'Mod.'], [['Bonus di copertura (tiro Manovra e decisione del GM)', '−'], ['Bersaglio statico (colto di sorpresa o prono ed è senza riparo)', '+10']]) +
      p('Il Livello di Attacco dell\'incantesimo è quello di chi lo lancia. Regola opzionale: corrisponde al numero di punti magia spesi per lanciare l\'incantesimo; i punti magia non possono essere inferiori al livello dell\'incantesimo o maggiori del livello del personaggio.') + '</details>';
    h += '<details><summary>TRR · Tiri resistenza</summary><div class="scroll"><table class="sk"><thead><tr><th class="l">Livello del bersaglio ↓ / dell\'attacco →</th>' + CD.trr[0].map(function (_, i) { return '<th>' + (i + 1) + '</th>'; }).join('') + '</tr></thead><tbody>' +
      CD.trr.map(function (r, i) { return '<tr><td class="l"><b>' + (i + 1) + '</b></td>' + r.map(function (v) { return '<td>' + v + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table></div>' +
      p('Per gli incantesimi, il livello dell\'attacco è quello di chi lo lancia (regola opzionale: il livello d\'attacco corrisponde al totale dei PM usati per il lancio; non può superare il livello del personaggio). Per ogni livello oltre il 15°, il livello dell\'attacco aumenta il valore di 1, mentre il livello del bersaglio lo diminuisce di 1. Il TR del bersaglio, per essere efficace, deve essere superiore o uguale al valore dato sulla tabella.') +
      '<h4>Modificatori al tiro resistenza</h4><ul><li>+: bonus al TR appropriati.</li><li>Da −125 a +70: modificatore risultante dal tiro d\'attacco base (TA-9).</li><li>−50: se il bersaglio è cosciente e consenziente (si consideri di livello 1).</li><li>+15: se il bersaglio appartiene allo stesso regno dell\'incantesimo.</li><li>Varie: decisioni del GM, oppure oggetti, incantesimi o abilità speciali.</li></ul></details>';
    h += '<details><summary>TSC-3 · Statistiche degli incantesimi di attacco</summary>' +
      tbl(['Tipo di incantesimo', 'C.C. primario', 'C.C. secondario', 'C.C. terziario', 'Modifiche speciali'], CD.tsc3.map(function (r) { return [r.n, r.c1, r.c2 || '-', r.c3 || '-', r.mod || '-']; })) +
      p('C.C. primario: è il colpo critico normalmente conseguente all\'attacco. C.C. secondario: −20 rispetto al primario (minimo C). C.C. terziario: −40 rispetto al primario (minimo E). Colpi critici: CA = da calore; FR = da freddo; EL = da elettricità; IMM = da impatto magico (urto).') +
      p('Il compendio segnala che nel manuale di Girsa il colpo critico di alcuni incantesimi è indicato come IM (impatto): è un errore di traduzione. Nelle tabelle «Crush» è tradotto con Impatto (IM) e «Impact» con Impatto Magico (IMM).') + '</details>';
    h += '<details><summary>Dardi e Sfere (TA-7 e TA-8): modificatori</summary>' +
      tbl(['Distanza (entrambe le tabelle)', 'Mod.'], [['0 m – 3 m', '+35'], ['3 m – 16 m', '0'], ['16 m – 33 m', '−25'], ['33 m – 66 m', '−40'], ['66 m – 100 m', '−55'], ['100 m in su', '−75']]) +
      tbl(['Tempo di lancio (entrambe le tabelle)', 'Mod.'], [['Incantesimo preparato per 4 round', '+20'], ['… per 3 round', '+10'], ['… per 2 round', '+0'], ['… per 1 round', '−15'], ['… per 0 round', '−30']]) +

      '<h4>TA-7 (Dardi)</h4><ul><li>Attaccante: + Bonus Offensivo Incantesimi Diretti; +30 se il bersaglio è statico (colto di sorpresa o prono).</li><li>Bersaglio: bonus di Agilità; bonus per la copertura (occorre un tiro Manovra); bonus dello scudo se è in direzione dell\'attacco.</li></ul>' +
      '<h4>TA-8 (Sfere)</h4><ul><li>Attaccante: + livello dell\'attaccante (solo se è un Usufruitore Puro o Ibrido); +20 se il bersaglio è nel punto centrale scelto dall\'attaccante per gli effetti dell\'incantesimo; +10 se il bersaglio è statico (colto di sorpresa o prono).</li>' +
      '<li>Bersaglio: bonus di Agilità oppure bonus per la copertura se trova riparo (occorre un tiro Manovra), non entrambi.</li></ul>' +
      '<h4>Entrambe</h4><ul><li>Bonus al BD contro elementi del bersaglio: +5 se non indossa un elmo; −5 se indossa un elmo completo che copre il viso.</li><li>Varie: decisioni del GM, oggetti speciali, incantesimi o abilità.</li></ul>' +
      p('Nota: gli incantesimi elementali d\'attacco possono essere potenziati spendendo PM aggiuntivi. Non si possono spendere più PM del livello del personaggio. I PF inflitti aumentano in base al moltiplicatore di PM (×2 PM = ×2 PF, ecc.). Al tiro dell\'eventuale fallimento però si applica un bonus pari ai PM aggiuntivi.') +
      p('Il compendio precisa che il bonus da applicare agli incantesimi di tipo Sfera corrisponde al livello del personaggio e non al Bonus Offensivo Base, solo se l\'usufruitore è Puro o Ibrido, altrimenti non si applicano bonus. In caso di fallimento si tira sulla tabella Fallimento degli Incantesimi (TTM-3).') + '</details>';
    h += '<details><summary>Corruzione</summary>' +
      p('Un fallimento durante il lancio di un incantesimo può portare ad acquisire Punti Corruzione (PC). Quando accade il personaggio effettua un TR contro Essenza; il livello dell\'attacco è il livello dell\'incantesimo lanciato. Se il TR ha successo il personaggio riceve solo la metà dei PC indicati. Il GM può limitare o annullare i PC ricevuti se un incantesimo è stato lanciato per fini nobili ed è giustamente misurato per l\'azione voluta.') +
      p('Un personaggio può acquisire PC ogni volta che utilizza un oggetto in grado di lanciare incantesimi che sia legato o fabbricato dalle forze Oscure. Ogni volta che utilizza l\'oggetto deve effettuare un TR contro Essenza (contro livello 10); se fallisce riceve 1 o più PC in base alla forza dell\'oggetto.') +
      p('Un personaggio inizia il gioco con 0 PC. Questi indicano la propensione di un personaggio ad avvicinarsi all\'oscurità e al male. Generalmente un punteggio di 100 indica il totale asservimento all\'Oscurità.') +
      '<ul><li>Se un personaggio subisce una tentazione malvagia il GM può effettuare un tiro sommando i PC e sottraendo il bonus in Prontezza. Se il risultato è maggiore di 100 il personaggio cede alla tentazione malvagia.</li>' +
      '<li>I Punti Corruzione sono usati come modificatore negativo per ogni TR per resistere a comandi o controlli di un essere malvagio. Se un servo del male impone un comando o un volere al personaggio, questi deve effettuare un TR contro Essenza con una penalità pari ai PC e se fallisce è costretto ad obbedire.</li></ul></details>';
    return h + '</section>';
  }

  G.refcombat = { html: function () { return rulesHtml() + supportHtml() + magicHtml(); } };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Nomi per popolo, per la pagina Crea. Raccolta fatta il 12/10/2026 da Tolkien Gateway (tolkiengateway.net, pagine di categoria dei personaggi

   Sono nomi di personaggi del legendarium: la lista dei Variag, dei Lossoth, degli Haradrim ecc. è vuota perché le fonti consultate non ne danno.
   Nomi che compaiono solo in giochi o film (per esempio Lurtz, Suladân, Yrjänä) sono stati lasciati fuori.
   m = maschili, f = femminili, x = nomi di cui la fonte non dice il genere (si propongono in entrambi i casi). Non è una lista del compendio GIRSA.
   Seconda fonte, non canonica: «Names of Middle-earth» di Colin Chapman, elenco di un appassionato (v. 1.7.2, darkshire.net/jhkim/rpg/lordoftherings/names.pdf, senza dichiarazione di licenza),
   con nomi inventati sul modello delle lingue di Tolkien. Qui sta nei campi fm, ff, fcog (nomi maschili, femminili, cognomi); le varianti con la barra («Art/Artie») sono ridotte alla prima,

(function (root) {

  var FAN = {

    esterling: [L("Böri, Edgü, Gizik, Göktîg, Kargî, Kemik, Kiliç, Kustîg, Maltök, Margöz, Öldür, Sacal, Yaban, Yiltîg, Yumruk"), L("Ana, Katun, Kuzu, Mareke, Markiz, Oyna, Tîgeke, Tîgkiz, Yileke, Yilkiz"), L("")],
    haradrim: [L("Abaan, Adnan, Amr, Aqil, Bakr, Dirar, Ghasaan, Haarith, Haashim, Hannad, Hudhayfah, Ikrimah, Jibran, Jubayr, Khaldoon, Khuzaymah, Lubayd, Marwan, Maazin, Mus'ab, Muthanna, Na'man, Nawfal, Nizar, Qusay, Sufyan, Ubaadah, Ubayy, Udayl, Umar, Umaarah, Umayr, Utbah, Waqqas, Yaman, Yazan"), L("Da'd, Firyal, Hind, Khawlah, Mawiyah, May, Nusaybah, Ramlah, Rudaynah, Rumaylah, Rumaythah, Sawda, Suhayr, Sumayyaa, Tamadhur, Yusraa, Usaymah"), L("")],

    wose: [L("Bhân-goru-Bhân, Bhôn-rema-Bhôn, Bhûn-daro-Bhûn, Dhân-moru-Dhân, Dhôn-bari-Dhôn, Dhûn-garo-Dhûn, Ghôn-rumi-ghôn, Ghûn-mera-ghûn, Rhân-duri-Rhân, Rhôn-damu-Rhôn, Rhûn-bamo-Rhûn"), L(""), L("")],
    beorniani: [L("Beran, Beranald, Beranbold, Berangár, Berangrim, Beranhame, Beranhelm, Beranhere, Beranmód, Beranmund, Beranor, Beranwine, Grim, Grimald, Grimbold, Grimfara, Grimfast, Grimgár, Grimhelm, Grimhere, Grimwine"), L("Beornhild, Beornwyn, Beranhild, Beranwyn, Grimhild, Grimwyn"), L("")]
  };
  Object.keys(FAN).forEach(function (k) { var n = NOMI[k]; n.fm = FAN[k][0]; n.ff = FAN[k][1]; n.fcog = FAN[k][2]; });
  Object.keys(NOMI).forEach(function (k) { var n = NOMI[k]; n.fm = n.fm || []; n.ff = n.ff || []; n.fcog = n.fcog || []; });
  function pick(id, sesso, a, b) { var n = NOMI[id]; if (!n) return []; return sesso === 'm' ? n[a] : sesso === 'f' ? n[b] : n[a].concat(n[b]); }

      h += '<button class="mini" data-act="cr_bgapply" data-i="' + i + '">' + (/^Empatia verso/.test(e.title) ? 'Aggiungi animale e note' : 'Metti nelle note') + '</button></div>';
    } else if (e.kind === 'den' && !e.applied) {
      h += '<div class="row"><button class="mini" data-act="cr_bgapply" data-i="' + i + '">Aggiungi al denaro</button></div>';
    } else if (e.kind === 'ogg' && !e.applied) {
      h += '<div class="row"><button class="mini" data-act="cr_bgapply" data-i="' + i + '">Aggiungi all\'inventario</button></div>';
    }
    return h + '<button class="mini ghost" data-act="cr_bgdel" data-i="' + i + '" aria-label="Elimina">✕</button></div>';
  }
  function stepBg(c) {
    var k = cr(c), p = person(c), t = T(), pts = p ? p.bg : 0, used = k.bg.length;
    var h = '<section class="card"><h2>5 · Opzioni di background</h2>';
    if (!p) return h + '<p class="hint">Scegli prima il popolo: i punti di background dipendono da lui.</p></section>';
    h += '<p class="hint">Il popolo «' + esc(p.n) + '» ha <b>' + pts + '</b> punt' + (pts === 1 ? 'o' : 'i') + ' di background (usati: ' + used + '). Il GM può far scegliere l\'opzione, farla tirare o sceglierla lui. ' +
      (p.bgAbil ? 'Per questo popolo, abilità speciali: ' + esc(p.bgAbil) : '') + '</p>';
    var bx = C.BGX[p.id] || {};
    if (bx.note) h += '<p class="hint">' + esc(bx.note) + '</p>';
    if (bx.noAdd) h += '<p class="hint">Oggetti: ' + esc(p.bgOgg) + '</p>';
    if (C.BGX[p.id] && !bx.noAdd && p.bgOgg) h += '<p class="hint">Oggetti: ' + esc(p.bgOgg) + '</p>';
    h += '<div class="bgs">' + k.bg.map(function (e, i) { return bgEntry(c, e, i); }).join('') + '</div>';
    if (used < pts) {
      h += '<h3>Usa un punto</h3><div class="row"><button data-act="cr_bgroll" data-kind="spec">Tira: abilità speciale</button><button data-act="cr_bgroll" data-kind="ogg">Tira: oggetto speciale</button><button data-act="cr_bgroll" data-kind="den">Tira: denaro</button></div>';
      h += '<div class="grid g2">' + U.field('Oppure scegli un\'abilità speciale', U.sel('data-t', 'cr.bgpick', t.bgpick, [['', '(scegli)']].concat(C.BG.spec.map(function (r) { return [X.rangeKey(r[0], r[1]), X.rangeKey(r[0], r[1]) + ' · ' + r[2]]; })))) +
        '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bgpick">Scegli questa</button></div></div>';
      h += '<div class="grid g2">' +
        U.field('Gradi: +2 a un\'abilità primaria', U.sel('data-t', 'cr.bgsk', t.bgsk, primarySkillOpts(c))) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bggradi" data-n="2">+2 gradi</button></div>' +
        U.field('Gradi: +5 a un\'abilità secondaria', U.sel('data-t', 'cr.bgsk2', t.bgsk2 || '', secSkillOpts(c))) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bggradi" data-n="5">+5 gradi</button></div>' +
        U.field('Caratteristiche: +2 a una', U.sel('data-t', 'cr.bgstat', t.bgstat, [['', '(scegli)']].concat(D.STATS.map(function (s) { return [s[0], s[1]]; })))) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bgstat" data-n="2">+2</button></div>' +
        U.field('Oppure +1 a tre (separate da virgola)', U.inp('data-t', 'cr.bgstat3', t.bgstat3, { ph: 'es. FR, AG, CO' })) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bgstat" data-n="3">+1 a tre</button></div>' +
        U.field('Lingua a grado 5', U.inp('data-t', 'cr.bglang', t.bglang, { ph: 'es. Sindarin' })) + '<div class="fld"><span>&nbsp;</span><button class="ghost" data-act="cr_bglang">Aggiungi lingua</button></div></div>';
    } else if (pts) h += '<p class="hint">Punti di background esauriti.</p>';
    return h + '</section>';
  }
  function bgFull(c, p) { if (cr(c).bg.length >= p.bg) { say('Punti di background esauriti.'); return true; } return false; }
  function addBg(c, e) { cr(c).bg.push(e); S.save(); render(); }
  G.acts.cr_bgroll = function (b) {
    var c = S.cur(), p = person(c); if (!p || bgFull(c, p)) return;
    var kind = b.dataset.kind, e = kind === 'spec' ? X.rollSpecial(p.id, dice.d100) : kind === 'ogg' ? X.rollObject(dice.d100) : X.rollMoney(dice.d100);
    U.showRoll('Background', e.title, e.roll); addBg(c, e);
  };
  G.acts.cr_bgpick = function () {
    var c = S.cur(), p = person(c), t = T(); if (!p || bgFull(c, p)) return;
    if (!t.bgpick) { say('Scegli un\'abilità speciale.'); return; }
    var x = C.BGX[p.id] || {}, row = null;
    C.BG.spec.forEach(function (r) { if (X.rangeKey(r[0], r[1]) === t.bgpick) row = r; });
    var title = row[2], text = row[3], log = [];
    if (x.rep && x.rep[t.bgpick]) { title = x.rep[t.bgpick][0]; text = x.rep[t.bgpick][1]; log.push('Sostituita per questo popolo.'); }
    if (x.reroll && x.reroll.indexOf(t.bgpick) >= 0) { say('Questo popolo non può avere l\'opzione ' + t.bgpick + ' (da ritirare).'); return; }
    addBg(c, { kind: 'spec', roll: 0, range: t.bgpick, title: title, text: text, log: log });
  };
  G.acts.cr_bggradi = function (b) {
    var c = S.cur(), p = person(c), t = T(), n = +b.dataset.n; if (!p || bgFull(c, p)) return;
    var idx = n === 2 ? t.bgsk : t.bgsk2;
    if (idx === '' || idx == null) { say('Scegli l\'abilità.'); return; }
    var s = c.skills[+idx], r = X.addRanks(c, s.k, n, dice.d);
    addBg(c, { kind: 'gradi', title: '+' + n + ' gradi in ' + s.name, text: 'Gradi ' + r.before + ' → ' + r.after + '.', applied: s.name });
  };
  G.acts.cr_bgstat = function (b) {
    var c = S.cur(), p = person(c), t = T(), n = +b.dataset.n; if (!p || bgFull(c, p)) return;
    var list = n === 2 ? [t.bgstat] : String(t.bgstat3 || '').toUpperCase().split(/[\s,]+/).filter(Boolean);
    var okList = list.filter(function (s) { return c.stats[s] && s !== 'AS'; });
    if ((n === 2 && okList.length !== 1) || (n === 3 && (okList.length !== 3 || new Set(okList).size !== 3))) { say(n === 2 ? 'Scegli la caratteristica.' : 'Scrivi tre sigle diverse (FR, AG, CO, IN, IT, PR).'); return; }
    var add = n === 2 ? 2 : 1;
    okList.forEach(function (s) { c.stats[s].score = Math.min(101, R.num(c.stats[s].score) + add); });
    addBg(c, { kind: 'car', title: n === 2 ? '+2 a ' + okList[0] : '+1 a ' + okList.join(', '), text: '', applied: 'caratteristiche aumentate' });
  };
  G.acts.cr_bglang = function () {
    var c = S.cur(), p = person(c), t = T(); if (!p || bgFull(c, p)) return;
    var l = String(t.bglang || '').trim(); if (!l) { say('Scrivi il nome della lingua.'); return; }
    c.lingue = (c.lingue ? c.lingue + ' ' : '') + l + ' (5).'; t.bglang = '';
    addBg(c, { kind: 'ling', title: 'Lingua: ' + l + ' (5)', text: '', applied: 'aggiunta alle lingue' });
  };
  G.acts.cr_bgdel = function (b) {
    var c = S.cur(), k = cr(c); if (!confirm('Togliere questa voce dal background? Gli effetti già applicati alla scheda non vengono annullati.')) return;
    k.bg.splice(+b.dataset.i, 1); S.save(); render();
  };
  G.acts.cr_bgapply = function (b) {
    var c = S.cur(), k = cr(c), e = k.bg[+b.dataset.i], t = T(); if (!e || e.applied) return;
    function bump(i, v) { var s = c.skills[i]; s.spec = R.num(s.spec) + v; }
    if (e.kind === 'den') { c.denaro = (c.denaro ? c.denaro + ' + ' : '') + e.mo + ' MO'; e.applied = e.mo + ' MO nel denaro'; }
    else if (e.kind === 'ogg') { c.inv.push({ n: e.title, q: '1', note: e.text.slice(0, 160) }); e.applied = 'nell\'inventario'; }
    else {
      var fx = SPEC_FX[e.title];
      if (!fx) {
        if (/^Empatia verso/.test(e.title)) {
          var sp = (t.bgspecie || '').trim(); if (!sp) { say('Scrivi la specie dell\'animale.'); return; }
          c.inv.push({ n: 'Compagno animale: ' + sp, q: '1', note: 'Bonus speciale +25 a ogni manovra in sua compagnia.' });
          note(c, 'Background: ' + e.title + ' (' + sp + '). ' + e.text); e.applied = 'animale (' + sp + ') nell\'inventario e nelle note';
        } else { note(c, 'Background: ' + e.title + '. ' + e.text); e.applied = 'nelle note del personaggio'; }
      } else if (fx === 'skill5' || fx === 'sec15') {
        if (!t.bgsk) { say('Scegli l\'abilità.'); return; }
        var i = +t.bgsk; bump(i, fx === 'skill5' ? 5 : 15); e.applied = '+' + (fx === 'skill5' ? 5 : 15) + ' a ' + c.skills[i].name;
      } else if (fx === 'mov10') { c.skills.forEach(function (s, i) { if (s.cat === 'mov') bump(i, 10); }); e.applied = '+10 a tutte le manovre in movimento'; }
      else if (fx === 'oss10') { ['percez', 'tracce'].forEach(function (key) { bump(X.skillIdx(c, key), 10); }); e.applied = '+10 a Percezione e Seguire tracce'; }
      else if (fx === 'bd5') { c.defs.bd.extra = R.num(c.defs.bd.extra) + 5; e.applied = '+5 al BD (il +5 al BO va aggiunto all\'arma, a mano)'; }
      else if (fx === 'lead10') { c.defs.lead.extra = R.num(c.defs.lead.extra) + 10; e.applied = '+10 alla leadership'; }
      else if (fx === 'tr10') { c.defs[t.bgdef].extra = R.num(c.defs[t.bgdef].extra) + 10; e.applied = '+10 al TR scelto'; }
    }
    S.save(); render();
  };

  /* ---------- 5. adolescenza ---------- */
  function stepAdol(c) {
    var k = cr(c), p = person(c), h = '<section class="card"><h2>6 · Adolescenza</h2>';
    if (!p) return h + '<p class="hint">Scegli prima il popolo.</p></section>';
    var t = X.adolescenceOf(p.id), plan = X.adolescencePlan(p.id);
    h += '<p class="hint">Gradi appresi prima della professione (TGP-5) per il popolo «' + esc(p.n) + '».</p><div class="chips">' +
      plan.map(function (x) { return '<span class="chip2">' + esc(SKILL_NAME[x.key] || x.key) + ' <b>' + x.ranks + '</b></span>'; }).join('') + '</div>';
    h += '<p class="hint">Lingue addizionali: <b>' + t.lingue + '</b> gradi da distribuire (massimo 5 per lingua; si possono portare a 5 le lingue del popolo o impararne di nuove) · punti background: <b>' + t.bgpunti + '</b> · probabilità di aver imparato una porzione di lista di incantesimi: <b>' + t.lista + '%</b>.</p>';
    h += '<div class="row"><button data-act="cr_adol">Applica i gradi di adolescenza</button><button class="ghost" data-act="cr_adolspell">Tira la lista di incantesimi (' + t.lista + '%)</button></div>';
    h += '<p class="hint">Applicare imposta i gradi delle abilità elencate (quelli già scritti in quelle righe vengono sostituiti). Per la Resistenza fisica l\'app tira i dadi della progressione (d10 per i gradi 1–10, d4 per i gradi 11–20, TB-4) e salva il bonus nella riga.</p>';
    if (k.adol === p.id) h += '<p class="hint ok">✔ Gradi di adolescenza applicati.</p>';
    if (k.spellRoll) h += '<p class="hint">Lista di incantesimi: ' + esc(k.spellRoll) + '</p>';
    return h + '</section>';
  }
  G.acts.cr_adol = function () {
    var c = S.cur(), p = person(c); if (!p) return;
    if (cr(c).adol === p.id && !confirm('I gradi di adolescenza sono già stati applicati: riapplicarli sostituisce di nuovo i gradi di quelle abilità. Procedere?')) return;
    var n = X.applyAdolescence(c, p.id, dice.d); S.save(); render(); say('Gradi di adolescenza applicati a ' + n + ' abilità.');
  };
  G.acts.cr_adolspell = function () {
    var c = S.cur(), p = person(c), k = cr(c); if (!p) return;
    var t = X.adolescenceOf(p.id), r = dice.d100(), ok = r <= t.lista;
    k.spellRoll = 'tiro ' + r + ' contro ' + t.lista + ': ' + (ok ? 'hai imparato una porzione di lista. Puoi sceglierla dopo aver deciso la professione, entro le restrizioni di popolo e professione.' : 'nessuna lista appresa.');
    U.showRoll('Lista di incantesimi', 'd100 contro ' + t.lista, r); S.save(); render();
  };

  /* ---------- 6. punti sviluppo ---------- */
  function stepPs(c) {
    var k = cr(c), f = prof(c), t = T();
    var h = '<section class="card"><h2>Punti sviluppo e livelli</h2>';
    if (!f) return h + '<p class="hint">Scegli e applica la professione.</p></section>';
    h += '<p class="hint">Ogni livello (e alla creazione) hai i punti della tabella TGP-4 per la professione. Un grado in un\'abilità costa 1 PS, due gradi 3 PS; nessuna abilità sale più di due gradi per livello. ' +
      'Manovre in movimento: 1 PS per grado, senza limite. Si possono trasferire PS tra categorie: ogni PS ottenuto costa 2 PS se la professione ha già almeno 1 PS in quella categoria, altrimenti 4; Arti marziali sempre 2 a 1; ' +
      'Percezione si paga con PS di altre categorie a 1 a 1.</p>';
    var cats = C.PS_CATS.filter(function (x) { return f.ps[x[0]] || X.psPool(c, x[0]) !== 0; }).concat([['perc', 'Percezione (da altre categorie)']]);
    h += '<div class="scroll"><table class="sk"><thead><tr><th class="l">Categoria</th><th>Base</th><th>Disponibili</th><th>Spendi</th></tr></thead><tbody>';
    cats.forEach(function (x) {
      var ck = x[0], pool = X.psPool(c, ck), skills = (C.PS_SKILLS[ck] || []).map(function (key) { return X.skillIdx(c, key); }).filter(function (i) { return i >= 0 && (c.skills[i].cat !== 'sec' || c.skills[i].name); });
      if (ck === 'perc') skills = [X.skillIdx(c, 'percez')];
      if (ck === 'sec') skills = c.skills.map(function (s, i) { return s.cat === 'sec' && s.name ? i : -1; }).filter(function (i) { return i >= 0; });
      var opts = skills.map(function (i) { return [String(i), c.skills[i].name]; });
      var selv = t.sk[ck] != null && opts.some(function (o) { return o[0] === String(t.sk[ck]); }) ? String(t.sk[ck]) : (opts[0] ? opts[0][0] : '');
      h += '<tr><td class="l">' + esc(x[1]) + '</td><td>' + (f.ps[ck] || 0) + '</td><td><b>' + pool + '</b></td><td>';
      if (skills.length) {
        h += '<div class="row nm0">' + (skills.length > 1 ? U.sel('data-tc', 'cr.sk.' + ck, selv, opts, { cls: 'ps', label: 'Abilità ' + x[1] }) : '<span class="dim">' + esc(opts[0][1]) + '</span>') +
          '<button class="mini" data-act="cr_raise" data-cat="' + ck + '" data-n="1" data-sk="' + selv + '">+1 grado</button>' +
          (ck === 'mov' ? '<button class="mini" data-act="cr_raise" data-cat="' + ck + '" data-n="2" data-sk="' + selv + '">+2 gradi</button>' : '<button class="mini" data-act="cr_raise" data-cat="' + ck + '" data-n="2" data-sk="' + selv + '">+2 gradi (3 PS)</button>') + '</div>';
      } else {
        h += '<div class="row nm0"><button class="mini" data-act="cr_spend" data-cat="' + ck + '" data-n="1">−1 PS</button><button class="mini" data-act="cr_spend" data-cat="' + ck + '" data-n="3">−3 PS</button><span class="hint">' + (ck === 'ling' ? 'Lingue: aggiornale nel campo Lingue' : ck === 'liste' ? 'Liste: annotale tra gli incantesimi' : 'segna la spesa') + '</span></div>';
      }
      h += '</td></tr>';
    });
    h += '</tbody></table></div>';
    h += '<h3>Trasferire punti</h3><div class="grid g3">' +
      U.field('Da', U.sel('data-t', 'cr.from', t.from, [['', '(categoria)']].concat(C.PS_CATS.map(function (x) { return [x[0], x[1]]; })))) +
      U.field('A', U.sel('data-t', 'cr.to', t.to, [['', '(categoria)'], ['perc', 'Percezione']].concat(C.PS_CATS.map(function (x) { return [x[0], x[1]]; })))) +
      U.field('PS da ottenere', U.inp('data-t', 'cr.amt', t.amt, { type: 'number' })) + '</div>' +
      '<div class="row"><button class="ghost" data-act="cr_transfer">Trasferisci</button></div>';
    var man = X.profManualBonuses(f, Math.max(1, Math.floor(R.num(c.livello)) || 1));
    h += '<div class="row"><button data-act="cr_newlevel">Passa al livello ' + ((Math.floor(R.num(c.livello)) || 0) + 1) + '</button></div>' +
      '<p class="hint">Il passaggio di livello azzera la spesa dei punti sviluppo e ricalcola i bonus di professione (TB-4.2). I PF si aggiornano da soli con i gradi di Resistenza fisica; l\'esperienza non è nei documenti: aggiornala a mano.' +
      (man.length ? ' Da aggiornare a mano: ' + esc(man.join('; ')) + '.' : '') + '</p>';
    return h + '</section>';
  }
  G.acts.cr_raise = function (b) {
    var c = S.cur(), t = T(), cat = b.dataset.cat, n = +b.dataset.n, sk = t.sk[cat] != null ? t.sk[cat] : b.dataset.sk;
    var f = X.profByName(cr(c).prof || c.prof); if (!f) { say('Scegli la professione.'); return; }
    var i = +sk; if (isNaN(i) || !c.skills[i]) { say('Scegli l\'abilità.'); return; }
    var r = X.raiseSkill(c, cat, c.skills[i].k, n, dice.d);
    if (!r.ok) { say(r.msg); return; }
    S.save(); render(); say(c.skills[i].name + ': ' + r.before + ' → ' + r.after + ' gradi (−' + r.cost + ' PS).');
  };
  G.acts.cr_spend = function (b) {
    var c = S.cur(), r = X.spendPlain(c, b.dataset.cat, +b.dataset.n); if (!r.ok) { say(r.msg); return; } S.save(); render();
  };
  G.acts.cr_transfer = function () {
    var c = S.cur(), t = T(), r = X.transfer(c, t.from, t.to, Math.floor(R.num(t.amt)));
    if (!r.ok) { say(r.msg); return; } S.save(); render(); say('Trasferiti: costo ' + r.cost + ' PS.');
  };
  G.acts.cr_newlevel = function () {
    var c = S.cur(); if (!confirm('Passare al livello ' + ((Math.floor(R.num(c.livello)) || 0) + 1) + '? La spesa dei punti sviluppo si azzera e i bonus di professione si ricalcolano.')) return;
    var lv = X.newLevel(c); S.save(); render(); say('Ora sei al livello ' + lv + '.');
  };

  function render_() {
    var c = S.cur();
    return '<section class="card"><p class="hint">Percorso di creazione del personaggio «' + esc(c.name) + '», nell\'ordine del compendio. Ogni passo scrive nella scheda; puoi tornare indietro e rifare. ' +
      'Il compendio non dà tabelle per i PF iniziali: scrivili in Scheda.</p></section>' +
      stepPeople(c) + stepName(c) + stepProf(c) + stepStats(c) + stepBg(c) + stepAdol(c) +
      '<section class="card"><p class="hint">Crescita del personaggio (punti sviluppo, nuovi livelli): <a href="#/develop">pagina Sviluppa</a>.</p></section>';
  }
  function develop_() {
    var c = S.cur();
    return '<section class="card"><p class="hint">Sviluppo di «' + esc(c.name) + '»: punti sviluppo, gradi alle abilità, trasferimenti tra categorie e passaggio di livello. La creazione (popolo, nome, professione, caratteristiche, background, adolescenza) è in <a href="#/create">Crea</a>.</p></section>' + stepPs(c);
  }
  G.pages.create = { render: render_ };
  G.pages.develop = { render: develop_ };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* Pagina Guida: popoli, professioni, tabelle di creazione, disponibilità temporale, abilità secondarie. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var R = G.rules, D = G.data, U = G.ui, S = G.store, C = G.creation, X = G.creationlogic, esc = U.esc;
  var dice = G.dice.dice;
  G.acts = G.acts || {};

  function T() { return U.tmp.ref || (U.tmp.ref = { people: '', q: '', istat: '' }); }
  var TIPO = { P: 'Usufruttore puro', I: 'Usufruttore ibrido', R: 'Usufruttore parziale', N: 'Non usufruttore', A: 'Altro' };

  function peopleSec() {
    var t = T(), p = X.personById(t.people);
    return '<section class="card"><h2>Popoli</h2>' + U.field('Popolo', U.sel('data-t', 'ref.people', t.people, [['', '(scegli)']].concat(C.PEOPLE.map(function (x) { return [x.id, x.g + ' — ' + x.n]; })), { re: 1, label: 'Popolo' })) +
      (p ? G.peopleHtml(p) : '<p class="hint">Le schede dei 28 popoli del Prospetto sui Popoli: caratteristiche speciali, lingue, professioni, equipaggiamento, background, abilità tipiche.</p>') + '</section>';
  }

  function profSec() {
    var h = '<section class="card"><h2>Professioni</h2><p class="hint">TB-6 (caratteristica fondamentale, regno, bonus per livello) e TGP-4 (punti sviluppo per livello). «Regno (n)»: livello massimo delle liste apribili.</p>' +
      '<div class="scroll"><table class="sk"><thead><tr><th class="l">Professione</th><th>Tipo</th><th>Car.</th><th>Regno</th><th class="l">Bonus per livello</th></tr></thead><tbody>';

<script>
/* Magia e iniziativa in combattimento: incantesimi di Attacco Base (TA-9) con il tiro resistenza (TRR), classi di incantesimi,
   fallimento degli incantesimi inoffensivi (TFI), tiro iniziativa, regola «oltre il 150». Le funzioni di calcolo sono pure
   e provate in tests/magic.test.js; la parte di interfaccia (scheda nel Combattimento) è in fondo. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var CD = G.combatdata || (typeof require !== 'undefined' ? require('./combatdata.js') : null);

  /* Colonne della TA-9: indice nel vettore dei valori. 0 = «Generale», poi per regno le protezioni che contano. */
  var REALMS = [
    { id: 'ess', n: 'Essenza', cols: [[0, 'Generale (nessuna delle protezioni sotto)'], [1, 'Armatura di metallo'], [2, 'Armatura di cuoio']] },
    { id: 'flu', n: 'Flusso', cols: [[0, 'Generale (nessuna delle protezioni sotto)'], [3, 'Armatura di metallo'], [4, 'Scudo di metallo']] },
    { id: 'men', n: 'Mentalismo', cols: [[0, 'Generale (nessuna delle protezioni sotto)'], [5, 'Elmo di metallo'], [6, 'Elmo di cuoio']] }
  ];
  var DIST = [[30, 'A contatto (+30)'], [10, 'Da 0 a 3 m (+10)'], [0, 'Da 3 a 16 m (0)'], [-10, 'Da 16 a 33 m (−10)'], [-20, 'Da 33 a 100 m (−20)'], [-30, 'Oltre 100 m (−30)']];
  var PREP = [[20, 'Preparato 4 round (+20)'], [10, '3 round (+10)'], [0, '2 round (0)'], [-15, '1 round (−15)'], [-30, '0 round (−30)']];

  function rowOf(first, total) {
    var rows = CD.ta9, i, r;
    // Tiro Invariabile: si legge la riga del tiro non modificato, senza modificatori.
    for (i = 0; i < rows.length; i++) { r = rows[i]; if (r.ti && first >= r.min && first <= r.max) return { row: r, ti: true }; }
    var eff = Math.min(95, Math.max(3, total));   // 03-95: i modificatori non portano fuori da questo intervallo
    for (i = 0; i < rows.length; i++) { r = rows[i]; if (!r.ti && eff >= r.min && eff <= r.max) return { row: r, ti: false, clamped: eff !== total }; }
    return null;
  }
  /* Risultato sulla TA-9: {fail, mod, row, ti, clamped}. col = indice di colonna (0–6). */
  function ta9(first, total, col) {
    var r = rowOf(first, total); if (!r) return null;
    var v = r.row.v[col];
    return { fail: v === null, mod: v, row: r.row, ti: r.ti, clamped: !!r.clamped };
  }
  /* Valore della TRR: il TR del bersaglio (tiro + bonus + modificatore) deve essere maggiore o uguale a questo numero.
     Oltre il 15° livello: +1 per ogni livello d'attacco in più, −1 per ogni livello del bersaglio in più (nota ** della tabella). */
  function trr(attackLevel, targetLevel) {
    var a = Math.max(1, Math.floor(+attackLevel || 1)), t = Math.max(1, Math.floor(+targetLevel || 1));
    return CD.trr[Math.min(t, 15) - 1][Math.min(a, 15) - 1] + Math.max(0, a - 15) - Math.max(0, t - 15);
  }
  /* Classe dell'incantesimo in base alla differenza di livello (TCI). */
  function spellClass(charLevel, spellLevel) {
    var d = (+charLevel) - (+spellLevel);
    if (isNaN(d)) return null;
    return d >= 6 ? 'I' : d >= 3 ? 'II' : 'III';
  }
  /* Percentuale di fallimento degli incantesimi inoffensivi (TFI): round di preparazione (0, 1, 2 o più). Gli istantanei: sempre 2. */
  function tfi(rounds, instant) {
    if (instant) return 2;
    var r = Math.max(0, Math.floor(+rounds || 0));
    return r === 0 ? 30 : r === 1 ? 15 : 2;
  }
  /* Tiro iniziativa: 1d100 + modificatori; il bonus alle Manovre in Movimento vale doppio. */
  function initiative(roll, o) {
    o = o || {};
    var t = roll + 2 * (+o.bmm || 0) + (o.surprised ? -20 : 0) + (o.hurt ? -20 : 0) + (o.poleFar ? 25 : 0) + (o.poleNear ? -10 : 0) + (o.twoHands ? -5 : 0) + (+o.misc || 0);
    return t;
  }
  /* Oltre il 150: margine tra il risultato e 150, e lettera del critico supplementare (a discrezione del GM). */
  function beyond150(total) {
    var m = Math.floor(+total) - 150;
    if (!(m > 0)) return null;
    var letter = m >= 151 ? 'E' : m >= 121 ? 'D' : m >= 91 ? 'C' : m >= 61 ? 'B' : m >= 31 ? 'A' : null;
    return { margin: m, letter: letter };
  }
  /* Penalità di gittata (TSC-5): distanza in metri e gittata base → fascia 0 corta, 1 media, 2 lunga, 3 massima, 4 fuori portata. */
  function range(base, meters) {
    var row = null; CD.tsc5.forEach(function (x) { if (x.base === +base) row = x; });
    if (!row) return null;
    var m = +meters;
    for (var i = 0; i < 4; i++) if (m <= row.r[i][1]) return { band: i, pen: [0, -25, -50, -75][i] };
    return { band: 4, pen: null };
  }

  var M = { REALMS: REALMS, DIST: DIST, PREP: PREP, ta9: ta9, trr: trr, spellClass: spellClass, tfi: tfi, initiative: initiative, beyond150: beyond150, range: range };
  G.magic = M;
  if (typeof module !== 'undefined') module.exports = M;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
