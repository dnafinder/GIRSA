tt":"40BO dardo el*","dim":"G/N","note":"Ostile, Risucchia 8 CO/r"},{"n":"Spettro minore (III)","lv":10,"qt":"1","vel":"VE/VC","pf":200,"ta":"NA","bd":75,"att":"80BO dardo el*","dim":"G/G","note":"Ostile, Risucchia 10 CO/r"},{"n":"Spettro maggiore (V)","lv":15,"qt":"1","vel":"VC/VC","pf":250,"ta":"NA","bd":50,"att":"100BO dardo el*","dim":"G/G","note":"Ostile, Risucchia 12 CO/r"},{"n":"Spettro dei tumuli (V)","lv":15,"qt":"1","vel":"LE/VC","pf":165,"ta":"NA","bd":75,"att":"100BO/90UR*","dim":"G/G","note":"Proteggono la loro tomba"},{"n":"Stella di palude","lv":9,"qt":"1","vel":"VC/VC","pf":30,"ta":"NA","bd":70,"att":"Illusioni, luce","dim":"G/G","note":"Inganna, Risucchia 6 CO/r"},{"n":"Ta-Fa-Lisch, Spiriti Naugrim","lv":7,"qt":"1-10","vel":"MV/VC","pf":85,"ta":"NA","bd":45,"att":"95AR/70BO","dim":"G/N","note":"Ostile, Paura lv 5"}],"nota":"(Ignorano stordimenti ed emorragie. Chiunque li incontri deve effettuare un TR contro “Risucchio della costituzione”)"},{"n":"Elementali","righe":[{"n":"Servitore elementale (I)","lv":5,"qt":"1","vel":"MV/SC","pf":50,"ta":"NA","bd":60,"att":"30 Sfera el.*","dim":"-/G","note":"Sfera elementale"},{"n":"Elementale debole (II)","lv":8,"qt":"1","vel":"VE/MV","pf":80,"ta":"CG","bd":40,"att":"80MO/speciale*","dim":"G/G","note":"Umanoide elementale"},{"n":"Elementale guardiano (III)","lv":15,"qt":"1","vel":"-/MV","pf":120,"ta":"NA","bd":60,"att":"Incantesimi*","dim":"-/G","note":"Colonna guardiana"},{"n":"Elementale forte (IV)","lv":15,"qt":"1","vel":"MV/SC","pf":250,"ta":"CR","bd":30,"att":"100MO/speciale*","dim":"G/G","note":"Umanoide elementale"}]}],"velocita":[["ST","Strisciante","1,5 m","0","0","0","-60"],["ML","Molto lento","4,5 m","0","0","0","-40"],["LE","Lento","7,5 m","5","5","0","-20"],["ME","Medio","15 m","10","10","-5","0"],["MV","Med. veloce","22,5 m","20","15","-10","+20"],["VE","Veloce","30 m","30","20","-15","+40"],["VC","Molto veloce","37,5 m","40","30","-20","+60"],["SC","Saettante","45 m","50","40","-20","+80"]],"legenda":["Tipo: indica specie e dimensioni dell’animale o del mostro.","Livello: indica il livello medio dell’animale o del mostro, per il calcolo dei Tiri Resistenza e l’attribuzione di punti esperienza. Quando il livello indicato è 0, lo si considera 0 per l’attribuzione dei punti esperienza ed 1 per il calcolo dei Tiri Resistenza.","Quantità: indica il numero di mostri o di animali in cui un gruppo di 4 - 6 personaggi può imbattersi durante un singolo incontro.","Velocità: è la velocità relativa indicata come Velocità di movimento (VM) / Velocità d’attacco (VA).","Modifiche Difensive: queste modifiche si applicano al bonus difensivo del mostro o dell’animale in situazioni adatte. Carica/balzo si ha quando l’animale attacca caricando frontalmente senza cogliere di sorpresa la vittima. La modifica si applica solo durante l’attacco della vittima della carica qualora questa attacchi per prima. Scappando/fuggendo si applica quando l’animale, a non meno di 5 metri di distanza, si muove in direzione opposta a chi lancia un’arma o un incantesimo.","PF: (Punti Ferita) è il numero di danni che un esemplare medio della specie indicata può subire prima di perdere i sensi. Per gli individui specifici può variare del 20% in più o in meno.","TA: (Tipo di armatura) è l’equivalente in armatura dell’animale o del mostro. NA: nessuna armatura; CG: cuoio grezzo; CR: cuoio rinforzato; CM: corazza di maglia; CP: corazza di piastre.","BD: (Bonus difensivo) è il punteggio da sottrarre ai tiri per colpire l’animale o il mostro. Il GM può variare il numero indicato in relazione alle circostanze, del 20% in più o in meno, anche per rendere più specifico ogni singolo esemplare.","Attacco: indica il tipo di attacco dell’animale ed il suo Bonus Offensivo. Vedi, più in particolare, la tabella TSC-2. (Il simbolo > indica che il successivo attacco è conseguente e dipendente dal precedente.","*: questo mostro dispone di attacchi o poteri speciali o multipli.","Dimensioni: indica le dimensioni dell’animale ai fini del calcolo dei risultati massimi degli attacchi (primo valore) e del calcolo del colpo critico inflitto all’animale o al mostro (secondo valore). E: enorme; G: grande; M: medio; P: piccolo; PP: piccolissimo.","Critico: indica quale colonna usare per i colpi critici inflitti all’animale o al mostro. Normali: quelle normali; Grandi: quella degli esseri grandi; Enormi: quella degli esseri enormi."]},"statiche":{"cols":[["Generale","(si applica a tutte le Manovre Statiche non comprese nelle altre colonne)"],["Interazione e Influenza"],["Disattivare Trappole","Scassinare Serrature"],["Lettura Rune","Uso di Oggetti Magici"],["Percezione","Seguire Tracce"]],"righe":[{"n":"Errore Grossolano","r":"-26 o meno","c":["Sbagli in modo spettacolare. Anzi, se possibile, la manovra sortisce effetti diametralmente opposti a quelli sperati.","Il grossolano tentativo di influenzare cade miseramente nel vuoto. Se possibile, anzi, dà effetti diametralmente opposti a quelli sperati. Se le circostanze non cambiano in meglio, falliscono anche i successivi tentativi.","Se provi a scassinare una serratura, il grimaldello si rompe nella serratura. Non potrai aprirla fin quando qualcun altro non avrà tolto il pezzo incastrato (con un altro Tiro Manovra per Scassinare Serratura). Se cerchi di disattivare una trappola, ottieni l’effetto opposto e la farai scattare.","Qualunque incantesimo o abilità presente nell’oggetto o nella pergamena, viene attivato e diretto contro di te. Ogni runa o pergamena viene consumata e non sarai più in grado di usare nessuno degli incantesimi o delle abilità contenute nell’oggetto.","Non solo non ottieni informazioni utili, ma ti convinci della validità di informazioni totalmente false relative a questo oggetto/zona. Non potete ripetere il tentativo riguardo allo stesso oggetto/zona"]},{"n":"Fallimento Completo","r":"-25/04","c":["Lapsus mentale, dovuto a incompetenza. Tutte le manovre statiche che tentate nei prossimi 10 minuti (60 round) si risolvono in un fallimento (vedi 05/75).","L’uditorio ti rifiuta seccamente, perde fiducia in te e la tua aura di autorità viene meno. Tutti i tentativi di influenzare che effettuate nella prossima ora (360 round) si risolvono in un fallimento (vedi 05/75)","Subisci un improvviso blocco mentale e i tuoi tentativi di scassinare (o disattivare) questa serratura (o trappola) falliscono automaticamente. Le trappole hanno il 50% di probabilità di essere attivate.","Subisci un blocco mentale in relazione alla runa (o all’oggetto). I successivi tentativi di letture o di uso degli stessi falliscono automaticamente. C’è il 50% di probabilità che l’incantesimo si attivi.","Sei nella confusione mentale più completa. Non solo fallisci questo Tiro Percezione ma anche tutti quelli che effettuerai nei prossimi 10 minuti (60 round)."]},{"n":"Fallimento","r":"05/75","c":["Hai fallito. Per un giorno intero non puoi tentare la stessa manovra statica nel medesimo luogo.","Hai fallito. Chi ti ascolta sarà sordo almeno, per un giorno ai tuoi tentativi di influenzarlo.","Per il momento non hai la più pallida idea di come scassinare o disattivare. Dopo 24 ore fai un Tiro Percezione: se è positivo puoi ripetere il tentativo.","Non hai idea di come leggere/usare questa runa /oggetto. Puoi effettuare un nuovo tentativo solo dopo essere progredito di un livello di esperienza. C’è il 20% di probabilità che l’incantesimo venga attivato (anche se si cercava di utilizzare un oggetto contenente un incantesimo).","Non ottieni alcuna informazione, ma sei convinto di aver saputo tutto il possibile. Per 1 giorno non puoi ripetere il tentativo nella stessa zona."]},{"n":"Successo Parziale","r":"76/90","c":["Se il successo parziale è possibile, riesci a eseguire il 20% della manovra statica. Per un’ora non puoi tentare la stessa manovra statica nel medesimo luogo.","Per lo meno continuano ad ascoltarti. Puoi ripetere in seguito la manovra.","Hai capito il funzionamento della serratura o della trappola ed hai una vaga idea del modo in cui scassinarla o disattivarla. Aspetta 10 minuti, poi ripeti il tentativo.","Ottieni un’intuizione relativa alla runa/oggetto; apprendi quanti e quali incantesimi/abilità sono contenuti. Non puoi ancora utilizzarli/leggerli. Prima di poter fare un altro tentativo devi lasciar passare una settimana.","Raccogli alcune informazioni relative al Tiro Percezione ma senza renderti conto di aver tralasciato qualcosa. Non puoi ripetere questo tentativo prima di aver lasciato passare 1 ora."]},{"n":"Quasi Successo","r":"91/110","c":["Se il successo parziale è possibile, esegui il 50% della manovra statica. Puoi tentare ancora dopo 3 round di riflessione.","Continua a parlare! Chi ti ascolta ti è sempre più favorevole. Modifica il prossimo tiro aggiungendo un bonus di +20.","Per poco! Se rifletti sul tentativo per 2 round (senza fare nient’altro), puoi ripeterlo con un bonus extra di +5.","Apprendi quanti e quali incantesimi/abilità sono contenuti. Se aspetti 24 ore e mediti sul tuo tentativo per almeno 2 ore (senza fare altro) puoi ritentare con un bonus di +10.","Raccogli alcune informazioni relative al Tiro Percezione ma ti rendi conto di aver tralasciato qualcosa. Puoi ritentare dopo aver meditato per almeno 3 round."]},{"n":"Successo","r":"111/175","c":["L’azione statica ha completo successo.","Sei riuscito a influenzare l’uditorio.","Serratura aperta (o trappola disattivata). Bonus di +50 ai tentativi successivi con la stessa serratura (o trappola).","Imparate uno degli incantesimi o delle abilità magiche dell’oggetto o di una runa. Puoi farne uso quando li impugni (ricorda che ogni runa può essere usata una sola volta). Apprendi gli altri incantesimi/abilità ma puoi farne uso solo dopo aver ottenuto altri successi.","Raccogli tutte le informazioni disponibili riguardo all’oggetto del Tiro Percezione."]},{"n":"Successo Completo","r":"175 o più","c":["L’azione statica ha successo. Benefici, inoltre, di un bonus di +20 per tutte le manovre statiche che tentate nei prossimi 10 minuti (60 round).","L’ azione ha successo e beneficia di un bonus di +50 ai tentativi di influenzare l’uditorio, fin quando non compi qualcosa che faccia venir meno la fiducia di chi ti ha ascoltato.","In futuro potrai scassinare (o disattivare) la stessa serratura (o trappola), o altre identiche, in modo automatico, in un solo round. Per le serrature (o trappole) simili benefici di un bonus di +10.","Apprendi tutti gli incantesimi/abilità contenuti nell’oggetto/runa puoi attivarli impugnando l’oggetto/runa.","Sei consapevole di qualunque informazione legata all’area esaminata, anche non relativa all’argomento. Ottieni un bonus di +20 per tutti i Tiri Percezione che effettuerai nei prossimi 10 minuti."]}],"difficolta":[["+30","Banale"],["+20","Facile"],["+10","Normale"],["0","Media"],["-10","Difficile"],["-20","Molto difficile"],["-30","Difficilissima"],["-50","Folle"],["-70","Assurda"]],"modifiche":[["Difficoltà: vedi * alla voce Generale.","+50: se chi ascolta è personalmente leale e devoto al personaggio.","+20: se chi ascolta è al servizio del personaggio.","+x: bonus dell’abilità Influenza e Interazione.","+/-x: altre modifiche dipendenti dall’atteggiamento di coloro che ascoltano, nei confronti del personaggio, e da ciò che egli vuole ottenere da loro."],["Difficoltà: vedi * alla voce Generale.","+x: bonus dell’abilità Scassinare Serrature o Disattivare Trappole."],["-x: livello dell’incantesimo","-30: se il regno dell’incantesimo è diverso da quello del personaggio.","-10: se il personaggio ignora quale sia l’incantesimo o l’abilità magica.","+20: se il personaggio sa quale sia l’incantesimo o l’abilità magica.","+30: se il personaggio è già capace di pronunciare l’incantesimo in questione.","+x: bonus dell’abilità Lettura Rune o Uso Oggetti Magici."],["Difficoltà: vedi * alla voce Generale.","+20: se il giocatore afferma chi il PG cerca un indizio specifico. Il numero di round utilizzati per la ricerca condiziona il grado di difficoltà.","+x: bonus dell’abilità Percezione o Seguire Tracce."]]},"trr2":{"freddo":{"intro":"Quando un personaggio è sottoposto a temperature particolarmente rigide deve effettuare un tiro resistenza, sommando il suo Bonus di Costituzione e il bonus di TR contro Freddo. Il tiro deve essere effettuato ogni 4 ore di esposizione continua al freddo. Si ripeterà comunque prima del termine ogni volta in cui cambiano le condizioni inerenti al tiro. Se cambiano migliorando (viene acceso un fuoco, la temperatura si alza, ecc) il risultato minimo consentito sarà quello del precedente TR effettuato. Viceversa se cambiano peggiorando (le vesti si bagnano, la temperatura scende, ecc) si ripeterà il TR ma il risultato del TR precedentemente effettuato sarà il massimo consentito.","righe":[["100 o +","TR Riuscito completamente."],["75/99","TR Riuscito, TR contro Malattie* Lv1 (Raffreddore o influenza: -10 all’attività)."],["60/74","-10 all’attività. TR contro malattie* Lv 2(Influenza)"],["50/59","Perdita di 1PF ogni ora, -20 all’attività. TR contro malattie* Lv3 (Febbre)"],["40/49","Perdita di 2PF ogni ora, -30 all’attività. TR contro malattie* Lv5 (Febbre)"],["30/39","Perdita di 3PF ogni ora, -40 all’attività. TR contro malattie* Lv7 (Febbre). Risultato minimo con temperatura maggiore di 0°."],["20/29","Principio di assideramento. Perdita di 1PF al minuto, -50 all’attività."],["10/19","Assideramento. Perdita di 1PF al minuto, -60 all’attività."],["0/09","Principio di congelamento. Perdita di 2PF al minuto, -90 all’attività."],["Meno di 0","Congelamento. Il soggetto è incapacitato e subisce 3PF al minuto (1PF ogni 2r). Possibile perdita di arti o danni permanenti"]],"mods":{"temp":[["10°/1°","+15"],["0°/-5°","+0"],["-6°/-10°","-10"],["-11°/-20°","-20"],["-21°/-30°","-30"],["Meno di -30°","-50"]],"ind":[["Nessuno","-30"],["Leggeri","-15"],["Normali","+0"],["Pesanti","+10"],["Pellicce/capotti","+20"],["Indumenti inver. (Guanti/sciarpe)","+30"]],"altro":[["Fuoco","+20/+50"],["Al chiuso","+10"],["Tenda","+10"],["Sacco a pelo","+15"],["In Movimento","+15"],["Armature metalliche","-10"],["Indumenti bagnati","-20"],["Vento forte","-15"]]},"note":["*Il TR contro malattie viene effettuato solamente se il soggetto rimane esposto al freddo per più di 4 ore."],"formula":"Il risultato del “Tiro + TR contro Freddo* + modificatori al tiro” determina gli eventuali danni subiti dal PG secondo questa tabella:"},"caldo":{"intro":"Quando un personaggio è sottoposto a temperature particolarmente alte deve effettuare un tiro resistenza, sommando il suo Bonus alla Costituzione e il bonus di TR contro Calore. Il tiro deve essere effettuato ogni 4 ore. Si ripeterà comunque prima del termine ogni volta in cui cambiano le condizioni inerenti al tiro. Se cambiano migliorando il risultato minimo consentito sarà quello del precedente TR effettuato. Viceversa se cambiano peggiorando si ripeterà il TR ma il risultato del TR precedentemente effettuato sarà il massimo consentito.","righe":[["100 o +","Tr Riuscito completamente."],["75/99","Tr Riuscito, Accaldato, -10 alle attività"],["60/74","Accaldato, -20 alle attività"],["50/59","Molto Accaldato, -30 alle attività"],["40/49","Inizio Disidratazione, -40 alle attività. (Dopo due ore passa al risultato 30-39)"],["30/39","Disidratazione, -50 alle attività (Dopo due ore passa al risultato 20-29)"],["20/29","Disidratazione, -60 alle attività (Dopo due ore passa al risultato 10-19)"],["10/19","Disidratazione avanzata, -70 alle attività (Dopo due ore passa al risultato 0-09)"],["0/09","Disidratazione grave, -85 alle attività (Dopo due ore passa al risultato “Meno di 0”)"],["Meno di 0","Il soggetto è incapacitato. Disidratazione molto grave, -100 alle attività. Ogni ora effettuare un tiro sommando il Bonus di Costituzione. Se è inferiore a 50 (o sei il risultato del dado è 1 o 2) il soggetto sviene. Continuare a ripetere il tiro ogni ora, al secondo fallimento il soggetto muore."]],"mods":{"temp":[["Oltre i 60°","-50"],["56°/60°","-30"],["51°/55°","-20"],["46°/50°","-10"],["41°/45°","-5"],["30°/40°","+0"]],"ind":[],"altro":[["All’ombra","+20"],["Mancanza d’acqua","-10/ora"],["Sole a Picco","-20"],["Vesti pesanti","-10"],["Vento, Brezza","+5/+10"],["Armature leggere","-10"],["Attività fisica","-10/-30"],["Armature metalliche","-20"],["Umidità alta","-10/-20"]]},"note":["*I TR contro Calore e Freddo si ottengono sommando il Bonus di Costituzione ed eventuali Bonus di Razza o Vari"],"formula":"Il risultato del “Tiro + Tr contro Calore* + modificatori al tiro” determina gli eventuali danni subiti dal PG secondo questa tabella:"},"nota":"*I TR contro Calore e Freddo si ottengono sommando il Bonus di Costituzione ed eventuali Bonus di Razza o Vari"},"liste":[{"n":"Pirocinesi","tipo":"Liste Chiuse, Mentalismo","sp":[{"lv":1,"n":"Manipola Fiamma","t":"E","d":"C","r":"3m","x":"La grandezza di una fiamma può essere aumentata o diminuita in maniera innaturale fino a raddoppiarne le dimensioni o fino allo spegnimento. Terminata la concentrazione se la fiamma non ha abbastanza combustibile a disposizione, tornerà alle sue dimensioni naturali. In alternativa l’Usufruitore può manipolarne la temperatura che può essere aumentata o diminuita fino ad una massimo di 2000° o fino alle spegnimento, aumentandone o diminuendone la luminosità. Se si alza la temperatura la fiamma brucerà di conseguenza più velocemente il combustibile a disposizione. Se termina la concentrazione la fiamma tornerà alla sua temperatura naturale in un round (a meno che sia stata spenta). L’Usufruitore impiegherà un round per una fiamma di candela fino a 6 round per una fiamma quale un grande fuoco da camino (a discrezione del GM)."},{"lv":2,"n":"Guida fiamma","t":"E","d":"C","r":"30m","x":"Concentrandosi l’Usufruitore può guidare una fiamma della grandezza massima di una torcia su delle superfici solide immobili facendola letteralmente camminare sul terreno o sulle pareti alla velocità di 1m/round. Finché mantiene al concentrazione la fiamma non avrà bisogno di combustibile per bruciare. Le superfici che la fiamma tocca se sono infiammabili prenderanno probabilmente fuoco (a discrezione del GM)."},{"lv":3,"n":"Combustione","t":"E","d":"","r":"3m","x":"Rende incandescente e appicca il fuoco a un qualsiasi materiale combustibile a scelta dell’Usufruitore."},{"lv":4,"n":"Trasporta Fiamma","t":"E","d":"C","r":"30m","x":"Concentrandosi l’Usufruitore può muovere una fiamma da un luogo ad un altro alla velocità di 30 cm / round. Durante il movimento la fiamma risulta sospesa e non necessita di combustibile per rimanere viva. La fiamma non può attraversare solidi o liquidi e l’Usufruitore deve sempre mantenere un contatto visivo con essa."},{"lv":5,"n":"Crea Fiamma","t":"E","d":"C","r":"","x":"L’Usufruitore crea una fiamma sul palmo della sua mano. Fintanto che manterrà la concentrazione la fiamma continuerà a bruciare ma l’Usufruitore sarà immune da essa. Se viene usata per accendere un combustibile, diverrà una normalissima fiamma e brucerà di conseguenza. Durante la fase di preparazione di questo incantesimo, l’Usufruitore può usare gli stessi round per preparare un altro incantesimo di questa lista che deve essere attivato usando la fiamma creata da “Crea Fiamma”. I round di preparazione possono così venire sovrapposti senza perdite di tempo aggiuntive. Dopo aver creato la fiamma l’Usufruitore può ulteriormente preparare il secondo incantesimo o ritardare il lancio rimanendo concentrato. Se dopo aver lanciato “Crea Fiamma” l’Usufruitore decide di cambiare il secondo incantesimo da lanciare, i round di preparazione sovrapposti vengono comunque persi."},{"lv":6,"n":"Muro di Fuoco","t":"E","d":"1rd/LVL","r":"30m","x":"L’Usufruitore crea un muro di fiamme di dimensioni massime 3x3 m. Deve essere presente una fiamma della grandezza minima di una torcia (o può essere usato l’incantesimo “Crea Fiamma) a meno di 3 metri dall’Usufruitore la quale viene totalmente consumata. Il muro deve poggiare su una superficie solida. Chiunque lo attraversi subirà un Colpo Critico da Calore di tipo “A”."},{"lv":7,"n":"Lingue di Fuoco","t":"E","d":"C","r":"30m","x":"Come “Guida Fiamma”. In questo caso però la velocità massima è di 3m/round. L’Usufruitore può decidere di far si che la fiamma lasci una linea di fuoco sul suo passaggio anche se la superficie non è combustibile. In questo caso, se poggia sul terreno può creare un muro non necessariamente lineare (per esempio un cerchio attorno all’obbiettivo) di dimensioni massime 6x2. Chiunque lo attraversi subirà un Colpo Critico da Calore di tipo “A”."},{"lv":8,"n":"Trasferisci Fiamma","t":"ED","d":"","r":"30m","x":"Una fiamma della grandezza di una torcia (o può essere usato l’incantesimo “Crea Fiamma) può essere trasportata istantaneamente da un luogo ad un altro entro il raggio d’azione. Lungo il tragitto non ci devono essere ostacoli solidi o liquidi. Se viene trasferita a contatto di un bersaglio verrà considerata come un attacco di tipo Dardo"},{"lv":9,"n":"Libera Fiamma","t":"ES","d":"","r":"1m","x":"L’Usufruitore crea una fiamma sul palmo della mano, come l’incantesimo “Crea fiamma” ma immediatamente, invece di trattenerla, libera la sua energia creando un cono infuocato di 1m di raggio davanti a se, sufficiente per colpire un solo bersaglio. Si consideri come un attacco di tipo Sfera. L’Usufruitore visto il corto raggio deve essere ad una distanza di mischia con l’avversario per colpirlo."},{"lv":10,"n":"Trasferisci Vampata","t":"ES","d":"","r":"30m","x":"Come “Trasferisci Fiamma”, ma all’arrivo la fiamma esplode in una sfera infuocata. Se viene trasferita a contatto di un bersaglio verrà considerata come un attacco di tipo Sfera con effetto per 3 m di raggio. Questo incantesimo può essere usato anche per far esplodere qualsiasi fiamma già esistente sul posto, senza trasferirla a patto che il mentalista possa vederla. In quel caso l’attacco sfera colpirà tutti nel raggio di 3 metri."},{"lv":11,"n":"Crea Fuoco","t":"E","d":"C","r":"15m","x":"Come “Crea Fiamma” ma in questo caso ha le dimensioni di 3x3x3 metri e deve poggiare su una superficie solida. Se un soggetto attraversa la fiamma subisce un critico A da Calore. Il fuoco impiega un intero round oltre a quello del lancio dell’incantesimo per comparire."},{"lv":12,"n":"Lingue di Fuoco III","t":"E","d":"C","r":"30m","x":"Come “Lingue di Fuoco”. In questo caso però la velocità massima è di 9m/round e il muro ha dimensioni massime 18x6. La fiamma può essere guidata anche su superfici mobili. In questo caso la velocità diminuisce a 1m/round e non può creare muri. Se la superficie è un bersaglio, dovrà effettuare un TR contro l’incantesimo o ogni turno subirà un Colpo Critico da Calore di tipo “A”."},{"lv":13,"n":"Trasferisci Fiamma II","t":"ED","d":"","r":"60m","x":"Come “Trasferisci Fiamma” ma il raggio è di 60 metri."},{"lv":14,"n":"Crea Fuoco II","t":"E","d":"C","r":"15m","x":"Come “Crea Fuoco” ma in questo caso ha le dimensioni di 6x6x6 metri."},{"lv":15,"n":"Fissa Fiamma","t":"E","d":"1rd/LVL","r":"tocco","x":"Una fiamma della grandezza massima di una torcia (o può essere usato l’incantesimo “Crea Fiamma) può essere fissata su un materiale inorganico. La fiamma non può essere spenta con normali mezzi e brucerà magicamente anche spostando il punto dove è fissata. Chiunque tocchi la fiamma subirà un Colpo Critico da Calore di tipo “A”. Se viene fissata su un arma si consideri come se fosse stato aggiunto un Colpo Critico Secondario da Calore al normale critico dell’arma. Se viene fissata su un oggetto di un bersaglio, esso dovrà effettuare un TR e la fiamma si fisserà per un tempo pari a 1 round ogni 10 pt fallimento (fino al massimo della durata dell’incantesimo)."},{"lv":16,"n":"Fiamma Persistente","t":"E","d":"1min/LVL","r":"tocco","x":"Il mentalista crea una fiamma come l’incantesimo “Crea Fiamma” ma può poi lasciarla in sospensione in un luogo. Deve poggiare su una superfice solida e non può essere spostata con nessun mezzo una volta lasciata. La fiamma brucerà senza combustibile per tutta la durata dell’incantesimo come se fosse ancora sulla mano del mentalista. Il round immediatamente successivo a questo incantesimo il mentalista può lanciare una altro incantesimo di questa lista che non avrà effetto ma verrà legato alla fiamma. Può usare gli stessi round di preparazione di “Fiamma Persistente” come in “Crea Fiamma”. Questo secondo incantesimo verrà attivato. esaurendo la fiamma, nel luogo dove è stata lasciata. A discrezione del mentalista potrà attivarsi all’esaurirsi del tempo, ad un evento o ad un suono preciso o dopo un tempo prefissato. Questa decisione non può essere cambiata e viene presa al momento del lancio dell’incantesimo. Se viene legato un incantesimo di attacco, questi colpirà il bersaglio più vicino entro il suo raggio al momento dell’attivazione."},{"lv":17,"n":"Trasferisci Fiamma III","t":"ED","d":"","r":"90m","x":"Come “Trasferisci Fiamma” ma il raggio è di 90 metri, oppure possono essere trasferite due fiamme in un raggio di 30 metri. I bersagli devono essere entrambi in un cono visivo di 60°. Se viene usato per attaccare il BO in incantesimi diretti deve essere spartito tra i due attacchi."},{"lv":18,"n":"Tappeto di Fuoco","t":"E","d":"1rd/LVL","r":"30m","x":"L’Usufruitore crea un tappeto di fiamme di dimensioni massime 15x15m. Deve essere presente una fiamma della grandezza minima di una torcia (o può essere usato l’incantesimo “Crea Fiamma) a meno di 3 metri dall’Usufruitore la quale viene totalmente consumata. Il tappeto deve poggiare su un terreno solido. Chiunque sia sulle fiamme subirà un Colpo Critico da Calore di tipo “A” ogni round se si sta muovendo, di tipo “B” se è fermo e di tipo “C” se è immobile o a terra."},{"lv":19,"n":"Crea Fuoco III","t":"E","d":"C","r":"15m","x":"Come “Crea Fuoco” ma in questo caso ha le dimensioni di 9x9x9 metri."},{"lv":20,"n":"Trasferisci Fiamma IV","t":"ED","d":"","r":"120m","x":"Come “Trasferisci Fiamma” ma il raggio è di 120 metri, oppure possono essere trasferite due fiamme in un raggio di 60 metri o tre in un raggio di 30 metri. I bersagli devono essere tutti in un cono visivo di 60°. Se viene usato per attaccare il BO in incantesimi diretti deve essere spartito tra tutti gli attacchi."},{"lv":25,"n":"Vero Crea Fuoco","t":"E","d":"1min/LVL","r":"30m","x":"Come “Crea Fuoco” ma in questo caso la fiamma ha le dimensioni massime di 15x15x15 metri e chiunque la tocchi subirà un Colpo Critico da Calore di tipo “B”."},{"lv":30,"n":"Supremo Crea Fiamma","t":"E","d":"1min/LVL","r":"6m","x":"Una fiamma magica grande come una falò da campo viene evocata dall’Usufruitore. Il fuoco creato con questo incantesimo appare di colore azzurro/bianco, brucia magicamente e non provoca danni ma solo luce. Può essere usato però per alimentare tutti gli incantesimi di questa lista senza esaurirsi. Ad ogni turno può alimentare al massimo un numero di incantesimi la cui somma dei livelli non superi quello dell’Usufruitore che ha evocato la fiamma."},{"lv":50,"n":"Vero Crea Fiamma","t":"E","d":"1rd/LVL","r":"6m","x":"Come “Supremo Crea Fiamma” ma per tutta la durata dell’incantesimo la fiamma può alimentare tutti gli incantesimi di questa lista senza costi aggiuntivi in Punti Magia. Anche altri Usufruitori entro il raggio di 30 metri possono lanciare gli incantesimi di questa lista servendosi del fuoco magico di colui che ha attivato questo incantesimo (essi però devono spendere i normali punti magia per ogni incantesimo lanciato). Ogni turno il totale dei livelli degli incantesimi che si alimentano con questa fiamma, senza contare quello lanciato dall’Usufruitore stesso, non deve superare il livello di colui che ha lanciato “Vero Crea Fiamma”."}],"note":[]},{"n":"Potenziamento Corporeo","tipo":"Liste Aperte, Mentalismo","sp":[{"lv":1,"n":"Slancio*","t":"U","d":"1 manovra","r":"Se stesso","x":"Il mentalista aggiunge un bonus di +10 ad una Manovra in Movimento. Non possono essere compiute altre azioni nel corso della manovra."},{"lv":2,"n":"Potenziamento I*","t":"U","d":"1 azione","r":"Se stesso","x":"Il mentalista aggiunge un bonus di +10 ad una Caratteristica fisica per compiere un singola azione in un round."},{"lv":3,"n":"Concentrazione II*","t":"U","d":"1rnd","r":"Se stesso","x":"Il mentalista aggiunge un bonus di +20 ad una Manovra statica. Nessun’altra azione può essere portata a termine nel corso dello stesso round."},{"lv":4,"n":"Potenziamento duraturo I","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Il mentalista aggiunge un bonus di +5 ad una sola Caratteristica fisica per la durata dell’incantesimo."},{"lv":5,"n":"Sensi acuti","t":"U","d":"1min/lv","r":"Se stesso","x":"Il mentalista aggiunge un bonus di +25 a tutti i tiri Percezione che richiedono l’uso di uno o più dei cinque sensi."},{"lv":6,"n":"Potenziamento II*","t":"U","d":"1 azione","r":"Se stesso","x":"Come Potenziamento I ma il bonus è di +20."},{"lv":7,"n":"Concentrazione III*","t":"U","d":"1rnd","r":"Se stesso","x":"Come Concentrazione II ma il bonus è di +30."},{"lv":8,"n":"Potenziamento duraturo II","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Come Potenziamento Duraturo I ma il bonus è di +10."},{"lv":9,"n":"Potenziamento corporeo I","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Il mentalista aggiunge un bonus di +5 a tutte e tre le Caratteristiche fisiche (Forza, Agilità e Costituzione) per la durata dell’incantesimo."},{"lv":10,"n":"Ignora dolore I*","t":"U","d":"1rnd","r":"Se stesso","x":"Il Mentalista per un round può ignorare tutte le penalità alle azioni dovute alle ferite (compreso la penalità per PF inferiori alla metà). Questo incantesimo non permette di ignorare stordimenti o incapacità dovute a ossa rotte o gravi amputazioni."},{"lv":11,"n":"Potenziamento III*","t":"U","d":"1 azione","r":"Se stesso","x":"Come Potenziamento I ma il bonus è di +30."},{"lv":13,"n":"Concentrazione IV*","t":"U","d":"1rnd","r":"Se stesso","x":"Come Concentrazione II ma il bonus è di +40."},{"lv":12,"n":"Vista nell’Oscurità","t":"U","d":"1min/lv","r":"Se stesso","x":"Permette al mentalista di vedere fino a 30 metri in qualsiasi tipo di oscurità completa. Se è di natura magica l’incantesimo ha effetto ma può essere richiesto un TR per limitarne il raggio."},{"lv":14,"n":"Potenziamento duraturo III","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Come Potenziamento Duraturo I ma il bonus è di +15."},{"lv":15,"n":"Ignora dolore II*","t":"U","d":"2rnd","r":"Se stesso","x":"Come Ignora Dolore I salvo la durata."},{"lv":16,"n":"Potenziamento corporeo II","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Come Potenziamento Corporeo I ma il bonus è +10."},{"lv":17,"n":"Concentrazione V*","t":"U","d":"1rnd","r":"Se stesso","x":"Come Concentrazione II ma il bonus è di +50."},{"lv":18,"n":"Potenziamento IV*","t":"U","d":"1 azione","r":"Se stesso","x":"Come Potenziamento I ma il bonus è di +40."},{"lv":19,"n":"Potenziamento duraturo IV","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Come Potenziamento Duraturo I ma il bonus è di +20."},{"lv":20,"n":"Ignora dolore III*","t":"U","d":"3rnd","r":"Se stesso","x":"Come Ignora Dolore I salvo la durata."},{"lv":25,"n":"Potenziamento V*","t":"U","d":"1 azione","r":"Se stesso","x":"Come Potenziamento I ma il bonus è di +50."},{"lv":30,"n":"Potenziamento corporeo III","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Come Potenziamento Corporeo I ma il bonus è +15."},{"lv":50,"n":"Potenziamento corporeo V","t":"U","d":"1rnd/lv","r":"Se stesso","x":"Come Potenziamento Corporeo I ma il bonus è +25"}],"note":["Tutti gli incantesimi di questa lista non sono cumulabili tra loro."]}],"xp":{"te0":[["Prima Volta","x 5"],["Seconda Volta","x 2"],["Normale","x 1"],["Routine","x 0.5"]],"te0t":["Tutti i Punti Esperienza assegnati devono essere moltiplicati per i seguenti fattori, in base alla frequenza con cui viene compiuta un’azione e alla familiarità che il personaggio ha con essa.","Un’azione di “Routine” è un azione con cui il personaggio ha acquisito familiarità e che reputa comune (percorrere strade conosciute, uccidere lo stesso tipo di creatura, lanciare lo stesso incantesimo, ecc.)."],"te1t":["Punti Esperienza per aver sconfitto (ucciso o messo fuori combattimento) un avversario attivo durante un combattimento. Spettano per intero a colui che infligge il colpo decisivo ma ridotti del numero di PE già assegnati per i Colpi Critici inflitti allo stesso avversario."],"te1":[[50,45,40,35,30,25,20,15,10,5,0],[200,150,130,110,100,90,80,70,60,50,40],[250,200,150,130,110,100,90,80,70,60,50],[300,250,200,150,130,110,100,90,80,70,60],[350,300,250,200,150,130,110,100,90,80,70],[400,350,300,250,200,150,130,110,100,90,80],[450,400,350,300,250,200,150,130,110,100,90],[500,450,400,350,300,250,200,150,130,110,100],[550,500,450,400,350,300,250,200,150,130,130],[600,550,500,450,400,350,300,250,200,150,150],[650,600,550,500,450,400,350,300,250,200,200]],"te1n":["* Per livelli oltre il 10 i PE sono: 200 + (50 x (Livello Nemico – Livello Personaggio), con un minimo di 200.","Moltiplicatori – Creature Grandi: x1,5 /Creature Enormi: x3."],"te3t":["Assegnati per i Colpi Critici inflitti e subiti durante un combattimento"],"te3":[["A","5 x Livello del Difensore","100"],["B","10 x  Livello del Difensore","200"],["C","15 x  Livello del Difensore","300"],["D","20 x  Livello del Difensore","400"],["E","25 x  Livello del Difensore","500"]],"te3n":["I PE per i Colpi Critici Inflitti non possono superare il totale dei Punti Uccisione per quel nemico."],"te3m":[["Nemico morente","x0"],["Stordito","x0,5"],["Svenuto o incapacitato","x0,1"],["Attaccante da solo contro più nemici","x2"]],"pf":"1 PE per ogni PF subito durante il combattimento.","morte":["Un personaggio che riceve una ferita mortale riceve tanti PE quanti un personaggio di livello 1 che uccide un nemico del suo livello, anche se la ferita mortale viene curata prima che il personaggio muoia.","Se il personaggio muore e poi viene riportato in vita (per esempio dall’incantesimo Resurrezione) i PE ricevuti per la morte vengono moltiplicati per 2."],"te2t":["Spettano per ogni incantesimo lanciato durante un combattimento o in situazioni appropriate fuori dal combattimento (l’incantesimo deve rivelarsi utile)."],"te2":[["Stesso del Personaggio",100],["-1",90],["-2",80],["-3",70],["-4",60],["-5",50],["-6",40],["-7",30],["-8",20],["-9",10],["-10 o più basso",0]],"te2m":[["In assenza di pericolo","x0,5"],["In combattimento","x1"],["In estremo pericolo","x2/x3"],["Il nemico viene sconfitto grazie all’incantesimo","x5"]],"te4t":"Assegnati per tutte le Manovre (di Movimento o Statiche) riuscite.","te4":[["Banale",0],["Facile",5],["Normale",10],["Media",50],["Difficile",100],["Molto Difficile",150],["Difficilissima",200],["Folle",300],["Assurda",500]],"te6":[["Normale","1 PE ogni 2Km"],["In Volo o in Mare","1 PE ogni 20Km"]],"te6m":[["In zone civilizzate","x0,5"],["In zone pericolose","x2"],["In zone molto pericolose","x3"]],"te7t":"Questa tabella indica un quantitativo di punti ideale per ulteriori categorie varie, sono valori indicativi che il GM deve adattare alle sessioni e scegliere di volta in volta. Possono essere maggiori o minori dei valori indicati.","te7":[["Conoscenze acquisite","Nuove conoscenze utili al personaggio ottenute da manoscritti, insegnamenti, ecc.","50/1000 PE"],["Idee o progetti","Idee, piani ed i suggerimenti dei personaggi che risultino utili e abbiano avuto successo.","100/600 PE"],["Missioni Completate","Missioni intermedie dell’avventura, obbiettivi preposti dai PG e dal GM o l’avventura stessa.","200 o più PE"],["Azioni straordinarie o eroiche","Azioni impensabili effettuate in caso di estremo pericolo per il gruppo che comportano un altissimo rischio per il PG ma che infine salvano la situazione con un completo successo.","500/1000 PE"],["Interpretazione e gioco","Interpretazione verbale, caratteriale e realistica del personaggio che rende migliore il gioco o che sprona il gruppo al proseguo dell’avventura in momenti di stallo o difficoltà.","100/500 P ura della zona e il periodo in cui è stato lanciato o altri fattori a discrezione del GM."],"fatt":[["ES (elementale sfera)",50],["ED (elemen. diretto)",40],["E (elementale)",25],["F (forza)",20],["P (passivo)",10],["U (utilità)",5],["I (informazione)",0]],"per":[["Attività Bassa (Quarta Era)",-25],["Attività Media (Inizio della Terza Era)",-15],["Attività Alta (Metà della Terza Era)",0],["Attività Molto Alta (Tarda Terza Era)",25]],"aree":["Rifugio","Urbana/ Civilizzata","Rurale/ Civilizzata","Confine/ Urbana","Confine/ Rurale","Terre Selvagge","Terre d’Ombra","Cittadelle d’Ombra"],"righe":[["≤ 05",["Niente","Niente","Niente","Niente","Niente","Niente","Niente","Niente"]],["6/20",["Niente","Niente","Niente","Percepito","Niente","Niente","Percepito","Percepito"]],["21/30",["Niente","Percepito","Niente","Percepito","Percepito","Niente","Individuato","Creatura"]],["31/40",["Niente","Percepito","Percepito","Individuato","Percepito","Percepito","Individuato","Creatura"]],["41/50",["Niente","Percepito","Percepito","Individuato","Individuato","Individuato","Creatura","Pattuglia"]],["51/60",["Niente","Individuato","Individuato","Individuato","Individuato","Creatura","Creatura","Pattuglia"]],["61/70",["Niente","Individuato","Individuato","Agguato","Creatura","Creatura","Pattuglia","Agguato"]],["71/80",["Percepito","Agguato","Creatura","Rapimento","Creatura","Creatura","Pattuglia","Contingente"]],["81/90",["Percepito","Rapimento","Agguato","Rapimento","Agguato","Creatura","Agguato","Contingente"]],["91/100",["Individuato","Assassino","Assassino","Assassino","Pattuglia","Agguato","Contingente","Speciale"]],["101/150",["Individuato","Rapimento","Rapimento","Rapimento","Assassino","Pattuglia","Speciale","Speciale"]],["151/200",["Rapimento","Assassino","Assassino","Assassino","Speciale","Speciale","Speciale","Speciale"]],["201+",["Assassino","Speciale","Speciale","Speciale","Speciale","Speciale","Speciale","Speciale"]]],"tipi":[["Rifugio","un’area completamente priva di forza di  ogni Incantesimo in più al giorno aggiungere il 50% del prezzo. Il prezzo, poi, viene raddoppiato se l’oggetto è più piccolo di un pugnale, per esempio un anello."],"cariche":[["Bacchetta","33 cm","10","2°"],["Verga","82 cm","30","5°"],["Bastone","164 cm","100","10°"]]},"muta":[["h","Mutaforma"],["p","Alcuni Beorniani di sangue nobile hanno la capacità di trasformarsi in orsi. Questa capacità viene regolata dall’abilità di Metamorfosi anche se il loro controllo rimane limitato."],["p","Metamorfosi viene considerata un abilità secondaria con caratteristica Prontezza. Il costo di avanzamento è il medesimo delle altre abilità (1pt per il primo grado e altri 2pt per il secondo grado) ma non vi è costo di trasferimento dei punti dagli altri gruppi di abilità. Si usa questa abilità per trasformarsi in orso, per resistere alla trasformazione quando questa si verificherebbe in maniera incontrollata (ad es. quando viene colpito in combattimento, quando si infuria, ecc.) e per mantenere il controllo dopo la trasformazione."],["p","Per trasformarsi il personaggio deve effettuare un tiro aperto (1d100) e sommare il bonus di Metamorfosi con i seguenti modificatori:"],["li","+5 per ogni round di concentrazione consecutivo;"],["li","+20 se riesce una manovra statica di Meditazione."],["p","Se il risultato è:"],["kv","100 o più:","la manovra è riuscita."],["kv","76 – 99:","la manovra non riesce ma il PG può tentare nuovamente il turno successivo mantenendo gli stessi bonus, compresi i round di concentrazione."],["kv","75 o meno:","la manovra non riesce e tutti i bonus vengono annullati."],["p","La trasformazione richiede un round. Per resistere alla trasformazione e per controllarsi si effettua una normale prova di Manovra Statica la cui difficoltà è data dalla situazione (a discrezione del GM)."],["p","Quando il mutaforma è in forma orso:"],["kv","i seguenti bonus raddoppiano:","PF, Percezione, Arrampicarsi, Seguire tracce, MM senza armatura, Procurarsi cibo (Foraggiamento)."],["kv","i seguenti bonus si dimezzano:","Cogliere alle spalle, Acrobazia, Addestrare animali, Speleologia, Contorsionismo, Segnalazione"],["kv","i seguenti bonus rimangono invariati:","Sapienza, Lingue, Arti marziali, Metamorfosi, Nuotare, Nascondersi, Muoversi silenziosamente, Difesa adrenalinica, Meditazione, TR e statistiche"],["p","le altre abilità non possono essere usate."],["p","La pelle d’orso protegge come Cuoio Grezzo e i colpi critici ricevuti sono risolti sulla tabella degli esseri grandi. Il BD è uguale a: BD + Difesa Adrenalinica +10. Il BO è uguale a: Arti Marziali + 25. Il danno è di un livello superiore a quello della tecnica marziale usata. I colpi in forma di orso sono del tipo Artiglio. Il Master può concedere attacchi di tipo Morso o Urto con una penalità."],["p","Durante la trasformazione in orso, il Beorniano non può parlare il linguaggio umano, ma può capirlo. Può conversare tranquillamente con gli altri orsi (grado lingua 5) e comunicare con gli altri animali della famiglia degli orsi (come i tassi) con un grado di lingua pari a 1."]],"monete":[["MS","Moneta di Stagno",1],["MR","Moneta di Rame",10],["MB","Moneta di Bronzo",100],["MA","Moneta d’Argento",1000],["MO","Moneta d’Oro",10000],["MM","Moneta di Mithril",1000000]],"anomalie":["TE-1: nella colonna «11+» i livelli nemico 8, 9 e 10 riportano 130, 150, 200 (come stampato; lo schema degli altri valori darebbe 110, 130, 150).","TM-2: l’estremo 175 compare sia in «111/175» sia in «175 o più».","TS-6: negli oggetti magici «11/22» e «21/30» si sovrappongono (21 e 22).","TS-8.2: Gelido, mese 3 (Gwaeron) è stampato «42/-12»: probabilmente «-42/-12».","TS-8: tre celle sono stampate senza la parentesi di chiusura (202(80, 126(50, 278(95).","Potenziamento Corporeo: il 13 (Concentrazione IV) precede il 12 (Vista nell’Oscurità); manca un «Potenziamento corporeo IV»; l’asterisco dei nomi (Slancio*, Potenziamento*, Concentrazione*, Ignora dolore*) non è spiegato nel PDF.","TRR-2 Caldo (riga «Meno di 0»): il testo stampato dice «o sei il risultato del dado è 1 o 2» (per «se il risultato»).","Pirocinesi: nel 2 compare «al concentrazione» (per «la»); nei punti 6, 8, 15 e 18 la citazione «“Crea Fiamma)» non ha le virgolette di chiusura; i livelli vanno da 1 a 20, poi 25, 30 e 50."]};

<script>
/* Regole «del mondo»: manovre (TM-1, TM-2), esperienza (TE-0..7), incontri (TS-10), rischio degli incantesimi (TS-12),
   tesori (TS-6), monete, meteo (TS-8). Funzioni pure sui dati del compendio (js/worlddata.js); provate in tests/world.test.js.
   L'interfaccia è in worldpage.js. Dove il compendio non dice come usare un numero, l'app non sceglie per il GM. */
(function (root) {
  'use strict';
  var G = root.GIRSA = root.GIRSA || {};
  var W = G.worlddata || (typeof require !== 'undefined' ? require('./worlddata.js') : null);

  var INF = 1e9;
  /* '01/20' -> [1,20]; '≤ 05' -> [-INF,5]; '201+' -> [201,INF]; 'più di 200' -> [201,INF]; '-26 o meno'; '175 o più'; '00' -> [100,100]; '91/00' -> [91,100] */
  function range(label) {
    var s = String(label).trim(), m;
    if (s.charAt(0) === '≤') return [-INF, parseInt(s.slice(1), 10)];
    if ((m = /^(\d+)\+$/.exec(s))) return [+m[1], INF];
    if ((m = /^più di (\d+)$/.exec(s))) return [+m[1] + 1, INF];
    if ((m = /^(-?\d+) o meno$/.exec(s))) return [-INF, +m[1]];
    if ((m = /^(-?\d+) o più$/.exec(s))) return [+m[1], INF];
    if ((m = /^(\d+) o \+$/.exec(s))) return [+m[1], INF];
    if (s === 'Meno di 0') return [-INF, -1];
    if (s === '00') return [100, 100];
    if ((m = /^(-?\d+)\/(-?\d+)$/.exec(s))) { var a = parseInt(m[1], 10), b = parseInt(m[2], 10); return [a, (b === 0 && a > 0) ? 100 : b]; }
    return null;
  }
  /* Indice della prima riga il cui intervallo contiene v (il primo vince dove il compendio si sovrappone); la prima riga vale anche per i valori più bassi. */
  function rowIndex(rows, v, key) {
    v = Math.floor(+v);
    for (var i = 0; i < rows.length; i++) {
      var r = range(key ? rows[i][key] : rows[i][0]);
      if (r && v >= r[0] && v <= r[1]) return i;
    }
    var f = range(key ? rows[0][key] : rows[0][0]);
    return f && v < f[0] ? 0 : rows.length - 1;
  }

  /* ---- TM-1: manovre in movimento ---- */
  function movCell(s) {
    if (s === 'F') return { fail: true, text: 'F' };
    var m = /^(\d+)\/(-|[+-]\d+)$/.exec(s);
    return { fail: false, pct: +m[1], m: m[2] === '-' ? 0 : +m[2], text: s };
  }
  function movLookup(total, diff) {
    var i = rowIndex(W.mov.righe, total);
    return { row: i, label: W.mov.righe[i][0], cell: movCell(W.mov.righe[i][1][diff]) };
  }

  /* ---- TM-2: manovre statiche ---- */
  function statLookup(total) {
    var i = rowIndex(W.statiche.righe, total, 'r');
    return { row: i, r: W.statiche.righe[i] };
  }

  /* ---- TS-10: incontri. Tiro d'Incontro = Tiro Attività - Tiro Evasione ---- */
  function incLookup(total, dens) {
    var i = rowIndex(W.incontri.righe, total);
    return { row: i, label: W.incontri.righe[i][0], code: W.incontri.righe[i][1][dens] };
  }
  var INC_NAMES = { t: 'trappola, imboscata o attacco di sorpresa', o: 'gruppo ostile', v: 'avvistamento da parte di un altro gruppo', a: 'attacco di un gruppo', i: 'incontro normale', '-': 'nessun incontro' };
  function incText(code) {
    var p = code.split('/');
    return { senzienti: INC_NAMES[p[0]], animali: INC_NAMES[p[1]] };
  }
  /* Valore numerico dei modificatori delle liste («+30», «-25/-50», «vario»): null se non è un numero singolo. */
  function modNum(s) { return /^[+-]?\d+$/.test(String(s)) ? parseInt(s, 10) : null; }

  /* ---- TS-12: rischio per gli incantesimi ---- */
  function rischioLookup(total, area) {
    var i = rowIndex(W.rischio.righe, total);
    return { row: i, label: W.rischio.righe[i][0], res: W.rischio.righe[i][1][area] };
  }

  /* ---- TRR-2: freddo e caldo. kind = 'freddo' | 'caldo' ---- */
  function trr2Lookup(kind, total) {
    var i = rowIndex(W.trr2[kind].righe, total);
    return { row: i, range: W.trr2[kind].righe[i][0], text: W.trr2[kind].righe[i][1] };
  }
  /* Fattore di rischio TS-12 del tipo di incantesimo (E, ED, ES, U, ...) */
  function riskFactor(code) {
    var f = W.rischio.fatt;
    for (var i = 0; i < f.length; i++) if (f[i][0].split(' ')[0] === code) return f[i][1];
    return null;
  }

  /* ---- monete (TS-6): MS=1, MR=10, MB=100, MA=1.000, MO=10.000, MM=1.000.000 ---- */
  function coinVal(code) { for (var i = 0; i < W.monete.length; i++) if (W.monete[i][0] === code) return W.monete[i][2]; return null; }
  function toMS(amount, code) { return amount * coinVal(code); }
  function fromMS(ms) { return W.monete.map(function (c) { return { code: c[0], name: c[1], v: ms / c[2] }; }); }
  function fmtNum(x) {
    var s = (Math.round(x * 1e6) / 1e6).toString();
    var p = s.split('.'), ip = p[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    return p[1] ? ip + ',' + p[1] : ip;
  }

  /* ---- TS-6: tesori ---- */
  function parseTreasure(cell) {
    var m = /^([\d.]+)(MS|MR|MB|MA|MO|MM)$/.exec(cell);
    if (m) { var n = +m[1].replace(/\./g, ''); return { kind: 'coin', n: n, code: m[2], ms: toMS(n, m[2]) }; }
    m = /^(Ge|Gio)\.\(([\d.]+)\)$/.exec(cell);
    if (m) { var mo = +m[2].replace(/\./g, ''); return { kind: m[1] === 'Ge' ? 'gem' : 'jewel', mo: mo, ms: mo * coinVal('MO') }; }
    return null;
  }
  function d100(dice) { return dice.d(100); }   /* 100 = «00» */
  function wealthIndex(name) { return W.tesori.ricchezze.indexOf(name); }
  /* Un tesoro: dice = {d(n)}, w = indice di ricchezza relativa 0..4. Ogni tiro è riportato per intero. */
  function treasure(dice, w) {
    var T = W.tesori, out = { w: w, money: null, magic: null };
    var e = d100(dice), ei = rowIndex(T.entD, e);
    out.money = { roll: e, n: T.entD[ei][1], items: [] };
    for (var k = 0; k < out.money.n; k++) {
      var r = d100(dice), ri = rowIndex(T.compD, r), cell = T.compD[ri][1][w];
      out.money.items.push({ roll: r, cell: cell, p: parseTreasure(cell) });
    }
    var e2 = d100(dice), e2i = rowIndex(T.entM, e2);
    out.magic = { roll: e2, n: T.entM[e2i][1][w], items: [] };
    for (var j = 0; j < out.magic.n; j++) {
      var r2 = d100(dice), r2i = rowIndex(T.compM, r2), c2 = T.compM[r2i][1][w], it = { roll: r2, cell: c2, ogg: null };
      if (c2 === 'J') {
        var o = d100(dice), oi = rowIndex(T.ogg, o);
        it.ogg = { roll: o, oggetto: T.ogg[oi][1], cariche: T.ogg[oi][2], livello: T.ogg[oi][3] };
      }
      out.magic.items.push(it);
    }
    out.totalMS = out.money.items.reduce(function (s, x) { return s + (x.p ? x.p.ms : 0); }, 0);
    return out;
  }

  /* ---- TE-1..: esperienza ---- */
  var SIZE_MULT = { N: 1, G: 1.5, E: 3 };
  /* PE per aver sconfitto un nemico di livello en con un personaggio di livello pc (TE-1); oltre il 10: 200+50*(en-pc), minimo 200. */
  function peKillBase(en, pc) {
    en = Math.max(0, Math.floor(+en)); pc = Math.max(1, Math.floor(+pc));
    if (en > 10) return Math.max(200, 200 + 50 * (en - pc));
    return W.xp.te1[en][Math.min(pc, 11) - 1];
  }
  function peKill(en, pc, size) { return peKillBase(en, pc) * (SIZE_MULT[size] || 1); }
  /* Colpi critici inflitti (TE-3): n[A..E] colpi; 5/10/15/20/25 x livello del difensore. */
  function peCritInflitti(counts, en) {
    var s = 0;
    ['A', 'B', 'C', 'D', 'E'].forEach(function (L, i) { s += (+counts[L] || 0) * 5 * (i + 1) * Math.max(0, +en || 0); });
    return s;
  }
  function peCritSubiti(counts) {
    var s = 0;
    ['A', 'B', 'C', 'D', 'E'].forEach(function (L, i) { s += (+counts[L] || 0) * 100 * (i + 1); });
    return s;
  }
  /* Incantesimi (TE-2): differenza = livello del PG - livello dell'incantesimo (0..10+). */
  function peSpell(diff) { var d = Math.max(0, Math.floor(+diff)); return d >= 10 ? 0 : 100 - 10 * d; }

  /* ---- TS-8: meteo ---- */
  function precParse(s) {
    var m = /^(\d+|-)\((\d\d)\)(\*)?$/.exec(s);
    return { mm: m[1] === '-' ? null : +m[1], pr: +m[2], star: !!m[3] };
  }

<script>
/* Generato da tools/extract-combatrules.py dal compendio «Istaro Quettar» (Filduin). Non modificare a mano. Vedi NOTICE.md. */
(function (root) {
  var G = root.GIRSA = root.GIRSA || {};
  G.combatrules = [{"t":"Modificatori al Bonus Offensivo","items":[{"table":"bo"}]},{"t":"Tiro Iniziativa","items":[{"p":"Il tiro viene effettuato per decidere chi tra più personaggi agisce per primo in un combattimento in mischia. Se il tiro tra due personaggi risulta identico essi agiscono in contemporanea."},{"p":"Tiro: 1d100 + Modificatori."},{"p":"Modificatori:"},{"li":"+ 2xBonus alle Manovre in Movimento (raddoppia anche se minore di zero aumentando la penalità)."},{"li":"-20 se il soggetto è sorpreso."},{"li":"-20 se il soggetto ha subito più del 50% di PF."},{"li":"+25 se il soggetto ha un Arma ad Asta e il nemico è ad una distanza maggiore di 3 metri (in genere valido solo per il primo turno)."},{"li":"-10 se il soggetto ha un Arma ad Asta e il nemico è ad una distanza minore di 3 metri."},{"li":"-5 se il soggetto ha un Arma a Due Mani."},{"li":"+/- Vari (modificatori dovuti a oggetti, posizione e casi particolari)."},{"p":"Dopo il primo round, se i combattenti continuano ad affrontarsi e non cambiano le condizioni, il GM può decidere di non ripetere il tiro e di mantenere lo stesso ordine di attacco per più turni. Se cambiano le condizioni (cambio di bersaglio, cambio di azione, ecc.) o se un combattente passa un intero turno in parata o si toglie dalla mischia e torna a combattere successivamente, il tiro andrà ripetuto."}]},{"t":"Bonus Difensivo","items":[{"p":"Se un personaggio indossa un armatura e il bonus di Manovre in Movimento in quella tipologia di armatura è inferiore a 0, esso verrà sottratto al suo Bonus Difensivo dovuto all’agilità, riducendola ad un valore minimo di 0."},{"p":"Il GM può assegnare bonus ulteriori se la posizione del bersaglio è vantaggiosa."},{"p":"Se una parte o tutto il corpo del bersaglio è coperto da altri oggetti ulteriori bonus possono essere aggiunti al bonus difensivo del soggetto (vedi TSC-4, Bonus Difensivo di Copertura)"},{"p":"Il bonus dello scudo può essere sfruttato solo contro attacchi provenienti da davanti o dal lato dello scudo."}]},{"t":"Parare","items":[{"p":"Parte o tutto il BO di un personaggio che brandisce un arma da mischia può essere sacrificato per parare e venire aggiunto al BD, l’attacco verrà effettuato col restante BO. La conversione avviene all’inizio del round. Se l’attacco viene effettuato prima e si risolve in un Colpo Maldestro la parata avrà comunque effetto, se il CM non specifica diversamente."},{"p":"Non si possono parare attacchi di sorpresa. Si può solo parare un attacco proveniente da un avversario che si sta attaccando."},{"p":"Se il personaggio ha anche uno scudo può parare un attacco da Tiro o da Lancio, ma può trasferire solo la metà del BO totale."},{"p":"Se si è storditi o a terra può essere convertito solo metà del BO totale."},{"p":"Se si impugna un’arma a una mano e uno scudo si può spostare parte del BO per parare un attacco dal soggetto ingaggiato e usare il bonus dello scudo contro un altro avversario o usare entrambi i bonus contro lo stesso."},{"p":"E’ possibile, nello stesso turno, dividere il BO per parare un attacco a distanza e un attacco in mischia dal bersaglio ingaggiato, poi attaccare con il restante BO."},{"p":"Se tutto il BO possibile viene convertito in difesa si può attaccare con un BO di +0, in questo caso si riceve inoltre un bonus alla parata pari al Bonus di Parata dell’arma."},{"p":"Le armi possiedono un Bonus alla Parata nel caso le si utilizzi posto dello scudo nella mano secondaria."},{"table":"parata"},{"p":"Alcune armi particolari hanno diversi Bonus alla parata (Vedere Statistiche delle Armi)."}]},{"t":"Uso di due armi a una mano","items":[{"p":"L’abilità “Combattimento con due Armi” (primaria, categoria Abilità con le Armi, caratteristica Forza) deve essere sviluppata separatamente per poter impugnare due Armi ad Una Mano. Il combattente potrà effettuare due attacchi in un round, uno per ognuna delle armi impugnate. Il BO per ogni attacco sarà il minore tra il BO nella categoria di armi dell’arma impugnata e il BO di “Combattimento con due Armi”. In ogni caso il BO dell’attacco con la mano secondaria subirà una penalità di -20, a meno che il giocatore non sia Ambidestro."},{"p":"(Esempio. Il personaggio ha i seguenti BO: Armi da Taglio a una Mano +100, Armi contundenti a una mano +60, Combattimento con due armi +80. Se attacca con un accetta nella mano principale e una mazza nella secondaria compirà due attacchi. Il primo, con l’accetta, avrà BO di +80 (il minore tra 100 e 80). Il secondo, con la mazza, avrà BO +40 (il minore tra 60 e 80 con la penalità di -20)"},{"p":"Un personaggio può compiere due attacchi in mischia nello stesso round, con i due differenti BO, oppure può scegliere di attaccare con un’arma ed usare l’altra come scudo utilizzando il “Bonus alla parata”."},{"p":"Se si sceglie di parare il Bonus deve essere sottratto da entrambi gli attacchi in ugual modo (al massimo può essere convertito il totale del BO minore tra i due), ma al Bonus Difensivo ne viene sommato solo uno. Un personaggio deve sferrare entrambi gli attacchi e parare contro lo stesso bersaglio."}]},{"t":"Arti Marziali","items":[{"p":"Le arti marziali si dividono in sei categorie, tre di Attacco (TA5, caratteristica FR, critico da Perdita d’Equilibrio) e tre di Immobilizzazione e Sbilanciamento (TA6, Caratteristica Agilità, critico da Presa oppure Perdita d’Equilibrio), dalle più semplici alle più letali."},{"p":"Questi sono i limiti imposti:"},{"li":"1- Novizio: Attacchi Piccoli"},{"li":"2- Standard: Attacchi Medi"},{"li":"3- Esperto: Attacchi Grandi"},{"p":"Il punteggio di un’abilità superiore non può superare quello delle abilità inferiori. Nella categoria Arti Marziali si possono sempre trasferire PS da altre categorie al costo di 2PS per ogni PS ottenuto."},{"p":"Un combattente in Arti Marziali può effettuare un attacco fulmineo, sottraendo parte del suo BO per sommarlo al Tiro Iniziativa all’inizio del round."},{"p":"Un esperto di Arti Marziali, raggiunto il grado 10, può effettuare 2 attacchi contro un bersaglio nello stesso turno con una penalità di -30 al BO per ogni attacco effettuato."},{"p":"Può inoltre (ma non nello stesso round in cui ha effettuato attacchi aggiuntivi) ingaggiare più bersagli in un turno (-20 ad ogni attacco per ogni bersaglio in più). Il numero massimo di bersagli che può ingaggiare 2 a grado 5, 3 a grado 10, 4 a grado 20 dell’abilità; i bersagli devono essere tutti in un raggio massimo di 180° Se un combattente riesce ad afferrare un nemico questo può tentare di divincolarsi all’inizio del turno successivo. L’attaccante dovrà effettuare un tiro, sommando il suo punteggio di Arti Marziali (del grado usato per afferrarlo) sulla tabella delle Manovre in Movimento. La difficoltà dipende dalla grandezza del nemico, in genere Media se è della stessa taglia. A questo tiro andrà sottratto un valore che dipenderà dal modo in cui il nemico si divincolerà, in genere il più alto tra questi: il bonus di Forza, il bonus di un abilità secondaria adatta (come Divincolarsi o Forza Adrenalinica), il bonus di Manovre in Movimento, il Bonus Offensivo di un Arte Marziale (solo uno di questi bonus può essere usato come modificatore). Un risultato di 100 indicherà che la presa è ancora salda; un risultato maggiore darà maggior bonus all’attaccante (il disavanzo maggiore di 100) al prossimo tiro per mantenere la presa; un risultato minore di 100 indica la possibilità in percentuale di mantenere la presa o di lasciare sfuggire il nemico."},{"p":"Se il nemico non riesce a divincolarsi, il turno successivo l’attaccante potrà effettuare un attacco per sbilanciarlo, sfruttando la presa. Al normale attacco (con eventuale C.C da Sbilanciamento) si aggiungerà un bonus di +20."},{"p":"Se un personaggio non è addestrato nelle Arti Marziali userà per attaccare i soli bonus di Forza o Agilità in base al tipo di attacco con una penalità di -25."}]},{"t":"Difesa adrenalinica","items":[{"p":"La Difesa Adrenalinica può essere usata se il soggetto non indossa armatura e non tiene uno scudo, oggetti pesanti o armi in mano. Nella lotta in mischia viene aggiunta al BD. Contro gli attacchi a distanza e gli incantesimi elementali di tipo Dardo viene dimezzata e poi aggiunta. Contro Incantesimi Base o ad Area non può essere usata. Il soggetto deve essere cosciente degli attacchi che riceve."}]},{"t":"Stordimento","items":[{"p":"Un personaggio stordito non può attaccare. Può parare soltanto con metà del suo BO. Può effettuare Manovre in Movimento con una penalità di -50 o muoversi di metà del Movimento Base."}]},{"t":"Accecato / al buio","items":[{"p":"Se un soggetto è completamente accecato o al buio completo gli attacchi da mischia che porta subiranno una penalità di -100 al BO. Il GM può richiedere prima un successo su un tiro Percezione per individuare il nemico. Attacchi a distanza, a discrezione del GM, non possono però essere effettuati."}]},{"t":"Ingaggiato","items":[{"p":"Un combattente si considera Ingaggiato in Mischia quando:"},{"li":"Ha subito un attacco da un nemico nella precedente fase di mischia."},{"li":"Il nemico è ancora ad un massimo di 3 metri di distanza"},{"li":"L’azione del nemico nel round corrente è di attaccare il combattente"},{"p":"Per togliersi da un ingaggio occorre una effettuare una Manovra in Movimento (Vedi Movimento in Combattimento e Disimpegno)."}]},{"t":"Incantesimi in Combattimento","items":[{"p":"Normalmente un personaggio non può lanciare incantesimi se è Ingaggiato in Combattimento. Fanno eccezione gli incantesimi Istantanei. Se il personaggio vuole lanciare incantesimi in situazioni complesse il GM può richiedere un tiro Concentrazione (PR) oppure applicare una penalità al tiro per il lancio di incantesimi. Normalmente gli incantesimi che funzionano toccando un bersaglio richiedono che il bersaglio sia fermo per il tempo sufficiente (qualche secondo), se non specificato diversamente. Un semplice tocco durante un azione di combattimento non è sufficiente. Se un personaggio riesce, con un attacco corpo a corpo, ad afferrare l’avversario, può lanciare un incantesimo con raggio Tocco il round successivo se riesce a tenere il nemico e se supera con successo un tiro Concentrazione (in alternativa il GM può applicare una penalità)."}]},{"t":"Movimento e Attacco (Carica)","items":[{"p":"Un combattente può muoversi al massimo di 3 metri prima dell’attacco senza penalità."},{"p":"Può coprire una distanza superiore facendo una Manovra in Movimento. La distanza massima che può coprire è pari al metà del normale Movimento (come tutte le Manovre in Movimento); successivamente potrà attaccare con solamente metà del Bonus Offensivo modificato di un bonus o di una penalità derivante dal risultato della Manovra nella misura di :”risultato -100”. La difficoltà della Manovra è Normale ma può essere incrementata da fattori come il tipo di terreno o altro."}]},{"t":"Movimento in Combattimento e Disimpegno","items":[{"p":"Una volta ingaggiato un nemico, qualsiasi movimento eseguito all’interno del combattimento è considerato una Manovra in Movimento e il risultato del tiro potrà dare delle penalità o eventualmente dei bonus (a discrezione del GM) all’azione portata immediatamente dopo, come per esempio un attacco. Queste Manovre possono comprendere il portarsi al lato o alle spalle di un nemico che sta attaccando un altro personaggio, per esempio. Di norma se le manovre coprono una distanza minore di tre metri, si potrà attaccare con il pieno Bonus Offensivo, altrimenti verrà dimezzato, come per la Carica (vedi sopra), prima di applicare gli eventuali modificatori dati dal risultato della Manovra."},{"p":"Se un combattente vuole fuggire da un combattimento, (Disimpegno) può semplicemente voltarsi e fuggire ma in questo caso il movimento avrà effetto dopo l’attacco dell’avversario (il GM potrebbe concedere all’attaccante l’opportunità di un attacco probabilmente a lato o alle spalle senza che il difensore possa parare o schivare). In alternativa il difensore può effettuare una manovra per indietreggiare difendendosi, cercando lo spiraglio giusto per allontanarsi; occorre effettuare una Manovra di disimpegno (con il bonus di Manovre in Movimento o dell’abilità Disimpegnarsi). In questo caso il personaggio può usare fino a metà del suo Bonus Offensivo per parare l’attacco del nemico e successivamente compiere una manovra fino a una distanza massima pari a metà del Movimento Base. Il risultato del tiro può determinare un aumento o diminuzione della distanza percorsa."},{"p":"L’abilità di Schivata acrobatica invece permette di tentare di eludere l’attacco allontanandosi nel frattempo."}]},{"t":"Attacco a Distanza, Gittata, Mira","items":[{"p":"Un personaggio non può colpire con Armi da Lancio o da Tiro se è ingaggiato in mischia."},{"p":"La Gittata Base delle Armi da Lancio viene incrementata di 1 per ogni +5 del Bonus in Forza"},{"p":"Con un Arma da Tiro o da Lancio appuntita è possibile mirare ad una parte del corpo. Il BO dell’attacco subisce una penalità di -30 ma i Colpi Critici si risolvono sulla tabella dei Colpi Critici Mirati da Punta. Se una parte del bersaglio è scoperta da armatura il GM può decidere di usare una colonna diversa nella tabella d’attacco (per esempio la colonna Nessuna Armatura se un nemico con una corazza non ha elmo e l’arciere mira alla testa)"},{"p":"Lancio Veloce: Un combattente può lanciare un arma in una azione veloce. Il tiro subisce in questo modo una penalità di -20 al Bonus Offensivo. Successivamente però il personaggio può muoversi della metà del Movimento Base oppure compiere un secondo attacco (o parare), in Mischia o ancora con Armi da Lancio con metà del Bonus Offensivo spostandosi al massimo di 3 metri prima dell’attacco. Se il secondo attacco è ancora con Armi da Lancio viene risolto nella fase di Mischia secondo l’ordine di Iniziativa. Per ogni attacco si devono considerare tutte le eventuali penalità per spostamento o estrazione delle armi, la penalità per la mano non dominante ecc."}]},{"t":"Combattimento a Cavallo","items":[{"p":"Ogni volta che un personaggio intende manovrare un cavallo facendolo muovere al galoppo deve ricorrere ad un tiro Cavalcare seguendo le stesse regole delle Manovre in Movimento per un personaggio che corre, incrementando o diminuendo la distanza percorsa."},{"p":"Se invece vuole intraprendere una qualsiasi azione mentre si trova a cavallo, come portare un attacco, deve fare un altro tiro (un secondo tiro se il cavallo è al galoppo) sommando il bonus dell’abilità Cavalcare e controllando sempre sulla tabella delle Manovre in Movimento. Il risultato però determinerà un eventuale bonus o penalità all’azione da eseguire nella misura di: “risultato – 100”."}]},{"t":"Colpi Critici su esseri Grandi o Enormi","items":[{"p":"Gli esseri Grandi ignorano i Critici inferiori a B. Gli esseri Enormi ignorano i Critici inferiori a D. Gli altri critici vengono tutti effettuati senza considerare il modificatore in base all’Entità del Critico, ma solamente i modificatori in base al Tipo di Arma."},{"p":"Esempio: Se un Essere Enorme subisce un Critico di tipo E con un arma normale il modificatore al Critico sarà -20 sulla tabella dei Colpi Critici Fisici agli Esseri Enormi."},{"p":"Gli incantesimi agiscono alla stessa maniera e i Colpi Critici avranno un modificatore di +0 a meno che il bersaglio non sia particolarmente debole ad un elemento, in quel caso risulta Sterminatore e avrà un modificatore di +20."},{"p":"Se un Arma Sterminatrice o Sacra contro una particolare razza effettua un Colpo Critico contro un soggetto di grandezza normale (es: un arma sterminatrice di orchetti contro un orchetto) si tirerà il normale critico in base al tipo di arma (con il modificatore in base all’entità del critico), poi si aggiungeranno gli effetti di un secondo Critico sulla tabella dei Colpi Critici agli Esseri Grandi, derivato dallo stesso risultato del dado ma dal diverso modificatore dell’arma (+10 se Sacra, +20 se Sterminatrice)."}]},{"t":"Colpo Critico Alternativo","items":[{"p":"Qualsiasi arma che ne abbia la possibilità può essere usata per provocare un Colpo Critico di un altro tipo (per esempio un Colpo Critico da Impatto con il piatto della lama della spada o da Sbilanciamento con il Bastone, ecc.). In questo caso, se non indicato diversamente nelle statistiche delle armi (TSC-1) si avrà una penalità al BO di -20, la gravità del Colpo Critico sarà al massimo C e non ci saranno C.C. Secondari. Questa penalità, e il cambio di critico, si applica anche se l’arma deve venir usata in un modo diverso (come una spada lunga in uno spazio stretto che viene usata solo con l’affondo)."}]},{"t":"Attacchi aggiuntivi e velocità in combattimento","items":[{"p":"Tutti gli attacchi aggiuntivi oltre il primo portati contro un bersaglio dovuti ad abilità (es: Combattimento con due armi o Arti Marziali) oppure dovuti a Incantesimi, come Velocità, devono essere effettuati alla fine della fase di Combattimento in Mischia, anche se il personaggio ha il vantaggio di Iniziativa. Il nemico deve poter effettuare un attacco dopo il primo attacco portato contro di lui e dopo subire i restanti attacchi. Velocità aumenta la progressione di tutti i fattori dipendenti dal tempo che influenzano il corpo fisico del personaggio, come la perdita di sangue in un round, i round di stordimento o la durata di alcune penalità."}]},{"t":"Abilità con le armi aggiuntive","items":[{"p":"Queste abilità sono normali Bonus Offensivi della categoria Abilità con le Armi. Devono essere sviluppate separatamente per ogni categoria di Armi diversa. Ricevono i normali Bonus alla Professione della categoria e si sviluppano normalmente"},{"p":"Colpo di Scudo (FR): Bonus Offensivo per colpire un bersaglio con lo scudo. Se impugnato con la mano secondaria e non si è ambidestri subisce la penalità di -20. Si risolve sulla tabella TA-6, Sbilanciamento, con colpi critici da Perdita di Equilibrio. I colpi maldestri si risolvono come Arma Contundente a Una Mano. Il colpo di scudo può essere effettuato nello stesso round di un attacco in mischia (indirizzato allo stesso bersaglio) che verrà risolto successivamente (vedi Attacchi aggiuntivi) con metà del Bonus Offensivo."},{"p":"Il turno in cui si effettua un colpo di scudo, il suo bonus viene utilizzato per la difesa solo contro il bersaglio che si sta attaccando. Un combattente può tentare di colpire con lo scudo un bersaglio (posto dal lato dello scudo o davanti) e con l’attacco in mischia un secondo nemico (posto davanti o dal lato dell’arma) con un arco massimo di 90 gradi; in questo caso entrambi gli attacchi subiscono una penalità di -20. Come per il Combattimento con Due Armi, se il combattente sceglie di Parare dovrà spostare una parte del Bonus Offensivo in difesa prendendolo da entrambi gli Attacchi (dopo averli eventualmente dimezzati); alla difesa ne verrà sommato solo uno."},{"table":"scudi"},{"p":"*Un essere Grande (es: Troll, ecc.) può fare attacchi Grandi con Scapezzato e Palvese. Un essere Piccolo fa solo attacchi Piccoli."},{"p":"Spezza Scudo (FR): Se il bersaglio ha uno scudo e il colpo va a segno con un critico non si conterà nessun danno alla vittima ma lo scudo perderà un livello di resistenza per ogni grado di colpo critico ricevuto. L’attacco naturalmente dovrà essere portato dal lato dello scudo o da davanti. Il Bonus dello scudo non si conterà nel totale del BD della vittima. Se l’attacco fallisce con un maldestro l’arma se non magica avrà il “100% - bonus dell’arma” di probabilità di rompersi. Scudi di metallo possono ignorare il danno effettuato da armi leggere o di legno."},{"p":"Abilità con Pugnale/Fioretto (AG): Un’abilità di combattimento può essere sviluppata separatamente per il Pugnale o il Fioretto, sfruttando l’agilità al posto della forza. Questa abilità si usa per attaccare normalmente come le classiche Abilità con le Armi, sfrutta però la caratteristica di Agilità e provoca la metà dei normali PF per ogni attacco (se l’arma provoca già la metà dei PF questi NON vengono ulteriormente dimezzati). Altre armi appartenenti a questa categoria, leggere e veloci e che possano ferire con poca forza, possono essere scelte dal GM. In genere armi non più pesanti di un pugnale L’abilità deve essere appresa separatamente per ogni singola arma differente."}]},{"t":"Oltre il 150","items":[{"p":"Se un attacco viene effettuato con un risultato molto alto, che supera il limite di tabella di 150, il GM può concedere un ulteriore Colpo Critico, dello stesso tipo del C.C. Primario dell’arma. La gravità di questo Colpo Critico viene determinata dal margine tra il risultato e 150."},{"table":"oltre150"}]}];
