<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3e2e">
<meta name="color-scheme" content="light dark">
<title>GIRSA Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header id="top">
  <div class="bar">
    <select id="charsel" data-act-change="char" aria-label="Personaggio"></select>
    <button class="mini" data-act="newchar" title="Nuovo personaggio" aria-label="Nuovo personaggio">＋</button>
    <button class="mini" data-act="dupchar" title="Duplica" aria-label="Duplica personaggio">⧉</button>
    <button class="mini" data-act="delchar" title="Elimina" aria-label="Elimina personaggio">🗑</button>
  </div>
  <div class="bar pfbar">
    <span id="pfstrip" data-state="nd"></span>
    <span class="pfbtns">
      <button class="mini" data-act="pf" data-n="10">−10</button><button class="mini" data-act="pf" data-n="5">−5</button><button class="mini" data-act="pf" data-n="1">−1</button>
      <button class="mini heal" data-act="pf" data-n="-1">+1</button><button class="mini heal" data-act="pf" data-n="-5">+5</button><button class="mini heal" data-act="pf" data-n="-10">+10</button>
    </span>
  </div>
  <nav id="nav" aria-label="Sezioni"></nav>
</header>
<main id="view"></main>
<footer id="lastbar"><span id="lastroll" aria-live="polite">Nessun tiro</span></footer>
<div id="toast" role="status"></div>
<script src="js/data.js"></script>
<script src="js/rules.js"></script>
<script src="js/dice.js"></script>
<script src="js/tables.js"></script>
<script src="js/tabledata.js"></script>
<script src="js/weapondata.js"></script>
<script src="js/combatdata.js"></script>
<script src="js/combatrules.js"></script>
<script src="js/creationdata.js"></script>
<script src="js/creationpdf.js"></script>
<script src="js/secdata.js"></script>
<script src="js/creation.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/sheet.js"></script>
<script src="js/refcombat.js"></script>
<script src="js/createpage.js"></script>
<script src="js/refpage.js"></script>
<script src="js/dicepage.js"></script>
<script src="js/magic.js"></script>
<script src="js/magicpage.js"></script>
<script src="js/combat.js"></script>
<script src="js/diary.js"></script>
<script src="js/datapage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
